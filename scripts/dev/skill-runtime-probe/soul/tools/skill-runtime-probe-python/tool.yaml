  inputSchema:
    type: object
    additionalProperties: false
    properties:
      message:
        type: string
        maxLength: 256
  outputSchema:
    type: object
    additionalProperties: true
    properties:
      ok:
        type: boolean
      runtime:
        type: string
      interpreter:
        type: string
      echoed:
        type: string
  adapter:
    kind: sandbox
    ref: skill:skill-runtime-probe/probe_python
