apiVersion: tulipfarm.ai/v1
kind: ToolContract
metadata:
  id: 69c6d074-7dd1-44f7-bd05-8b6d97807e60
  slug: skill-runtime-probe-shell
  displayName: Skill runtime probe (shell)
  schemaVersion: 1
  authoredVersion: 1
  lifecycle: active
spec:
  toolId: skill-runtime-probe-shell
  toolVersion: "1"
  description: Run the skill-runtime-probe shell entrypoint in the sandbox and echo its argument back.
  action: probe
  riskClass: low
  mutating: false
  dryRun: false
  idempotency:
    strategy: none
  timeout:
    activeMs: 60000
  inputSchema:
    type: object
    additionalProperties: false
    properties:
      message:
        type: string
        maxLength: 256
  outputSchema:
    type: object
    additionalProperties: true
    properties:
      ok:
        type: boolean
      runtime:
        type: string
      interpreter:
        type: string
      echoed:
        type: string
  adapter:
    kind: sandbox
    ref: skill:skill-runtime-probe/probe_shell
