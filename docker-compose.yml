# Compose project name: namespaces every container and volume. Overridable by
# COMPOSE_PROJECT_NAME (env or the `.env` next to this file) and by `-p`, both of which win
# over this line. Do not edit it in place on an existing install — the volumes are named
# after it, so renaming orphans your database and soul repo.
name: tulipfarm

# TulipFarm — paste-and-run stack (ARCH-V1, Postgres-only). `app` is the single image
# (API + built SPA + in-process pg-boss workers); `worker` runs the durable Run/wait/outbox
# loops off that same image. Bundled `postgres` ships pgvector.
#
# No `.env` is required. Every variable below has a default, and the three bootstrap
# secrets (ENCRYPTION_KEY / JWT_SECRET / WEBHOOK_SIGNING_SECRET) are generated by the app
# on first boot and persisted to the `tulipfarm-data` volume. Setting any of
# them in the environment overrides the generated one — the installer does exactly that.
#
#   docker compose up -d   →   http://localhost:8080
#
# Variables you may want to set (in a `.env` next to this file, or your platform's UI):
#   HOST_PORT       host port to publish (default 8080)
#   PUBLIC_URL      the origin users reach; drives CORS and the cookie `Secure` flag
#   PUBLIC_API_URL  the public API origin; defaults to PUBLIC_URL for this combined image
#   PUBLIC_ORIGINS_LOCKED  set true to keep those environment values authoritative
#   POSTGRES_PASSWORD  password for the bundled database (default `tulipfarm`)
#   COMPOSE_PROJECT_NAME  see "more than one business" below (default `tulipfarm`)
#
# WHERE UPLOADED AND GENERATED FILES GO
#   The bundled `bucket` service (Garage) is an S3 server, so file upload works out of the box
#   with no cloud account. Its access key is generated by `app` on first boot and persisted to
#   the `tulipfarm-data` volume alongside the other bootstrap secrets — nothing to configure, and
#   no default password to leak. Its bytes live on `tulipfarm-bucket`; back that up too.
#
#   To use S3, R2, B2, MinIO or any other S3-compatible provider instead, turn the bundled one
#   off and point at yours — the driver is the same either way:
#
#     BUCKET_ADMIN_URL=            # empty disables the bundled bucket
#     S3_ENDPOINT=https://s3.eu-central-1.amazonaws.com   # omit for AWS's default host
#     S3_BUCKET=my-bucket
#     S3_REGION=eu-central-1
#     S3_ACCESS_KEY_ID=...
#     S3_SECRET_ACCESS_KEY=...
#
#   Then start without it: `docker compose up -d app worker integration-worker postgres`.
#   Setting `BLOB_STORE=filesystem` keeps files on the `tulipfarm-data` volume instead, which
#   suits a single-container trial but not a deployment you intend to keep.
#
# RUNNING MORE THAN ONE BUSINESS ON ONE MACHINE
#   Copying this file to a second directory is not enough. The project name — not the
#   directory — is what Compose uses to tell stacks apart, and it is pinned above, so a
#   second `docker compose up -d` reuses the first stack's containers and volumes. Both
#   businesses then share one database and one soul repo. Nothing errors; the second
#   simply comes up on the first's data. Give each stack its own name and port:
#
#     docker compose -p acme  up -d     # with HOST_PORT=8081
#     docker compose -p globex up -d    # with HOST_PORT=8082
#
#   Then keep using the same `-p` for every later command (`logs`, `down`, `pull`) — one
#   without it targets `tulipfarm`, not your stack. Setting COMPOSE_PROJECT_NAME in each
#   directory's `.env` is the less error-prone option.
#
# External / managed Postgres: set EXTERNAL_DATASTORE=true and DATABASE_URL to your
# server (it must allow the `vector` and `citext` extensions), then name every service except
# it: `docker compose up -d app worker integration-worker bucket`. Naming services explicitly
# starts their dependencies but not their dependents, so `bucket` must be listed or `app` waits
# for a file store that was never created and then refuses to boot.
#
# SECURITY NOTES
#   * The bundled database defaults to the password `tulipfarm`. That is required for a
#     file that runs with no prior setup — Postgres needs a password at init time. It is
#     safe only because port 5432 is never published to the host; do not publish it.
#     The installer generates a strong password instead.
#   * Generated secrets live on the same host as the database volume, so a full host
#     compromise yields both. Supply ENCRYPTION_KEY from a real secret store for
#     production/enterprise deployments.
#   * The `bucket` service publishes no port. Files are authorized per request by the API, so a
#     bucket reachable from a browser would be a way around that check; do not publish 3900.
services:
  app:
    # Shipped to the install dir, which has no build context — pull the published image only.
    # (For local image builds use a docker-compose.override.yml with `build: .`.)
    image: ghcr.io/tulipfarm/tulipfarm:${TULIPFARM_VERSION:-latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
        # External mode starts only `app`, so `postgres` is absent from the run —
        # don't block startup on a service that isn't part of it.
        required: false
    environment:
      PORT: "8080"
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${HOST_PORT:-8080}}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-${PUBLIC_URL:-http://localhost:${HOST_PORT:-8080}}}
      PUBLIC_ORIGINS_LOCKED: ${PUBLIC_ORIGINS_LOCKED:-false}
      # Bundled mode wires this from POSTGRES_PASSWORD; override it for managed Postgres.
      DATABASE_URL: ${DATABASE_URL:-postgresql://tulipfarm:${POSTGRES_PASSWORD:-tulipfarm}@postgres:5432/tulipfarm}
      # Empty means "generate and persist to /data on first boot" — see the header.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      SOUL_PATH: /opt/tulipfarm/soul
      TF_DATA_DIR: /data
      TULIPFARM_VERSION: ${TULIPFARM_VERSION:-}
      # Files go to the bundled `bucket` service. Its access key is provisioned by this process on
      # first boot and persisted to /data, like the other generated secrets — see the header for
      # using an external S3 provider instead.
      BLOB_STORE: ${BLOB_STORE:-s3}
      S3_BUCKET: ${S3_BUCKET:-tulipfarm}
      S3_REGION: ${S3_REGION:-garage}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://bucket:3900}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Empty turns the bundled bucket off entirely. Note the single `-`: unlike the others, this
      # honours an explicitly empty value rather than falling back to the default.
      BUCKET_ADMIN_URL: ${BUCKET_ADMIN_URL-http://bucket:3903}
    ports:
      # HOST_BIND=127.0.0.1 keeps the plain-HTTP port off the network behind a proxy.
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    volumes:
      - tulipfarm-soul:/opt/tulipfarm/soul
      # Generated bootstrap secrets and backups. Losing this volume loses the encryption
      # key for every stored secret — back it up.
      - tulipfarm-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    # Same image as `app` — one tag always pairs an API with a worker that speaks the same
    # schema. The worker never migrates; it refuses to boot below the schema floor it needs,
    # which is why it waits for `app` (the migrator) to be healthy first.
    image: ghcr.io/tulipfarm/tulipfarm:${TULIPFARM_VERSION:-latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "worker.cjs"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://tulipfarm:${POSTGRES_PASSWORD:-tulipfarm}@postgres:5432/tulipfarm}
      WORKER_PORT: "4020"
      # Exactly one replica owns cron and maintenance consumers.
      WORKER_MAINTENANCE: "true"
      # The turn runs here, so this process calls back into the API for Context, Tool dispatch
      # and Turn completion. Service-to-service on the compose network — never the public URL.
      INTERNAL_API_URL: http://app:8080
      # Both empty by default, and both persisted to /data by `app` on its first boot: the
      # encryption key by the bootstrap-secrets pass, the credential by the `run-executor`
      # client it mints for this process. Setting either here overrides the file.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      WORKER_API_CREDENTIAL: ${WORKER_API_CREDENTIAL:-}
      TF_DATA_DIR: /data
      # Same store as `app`. The access key is not set here: `app` provisions it and writes it to
      # /data, and this process reads it back from there like its other credentials.
      BLOB_STORE: ${BLOB_STORE:-s3}
      S3_BUCKET: ${S3_BUCKET:-tulipfarm}
      S3_REGION: ${S3_REGION:-garage}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://bucket:3900}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      # Read-only: `app` owns everything on this volume. The worker only reads back the two
      # values it was given.
      - tulipfarm-data:/data:ro
    # No published port: the probes are for the orchestrator, not for users.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4020/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  integration-worker:
    # Same image as `app` and `worker` — one tag always pairs them against the same schema. This
    # process never migrates either; it waits for `app` (the migrator) to be healthy first.
    image: ghcr.io/tulipfarm/tulipfarm:${TULIPFARM_VERSION:-latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "integration-worker.cjs"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://tulipfarm:${POSTGRES_PASSWORD:-tulipfarm}@postgres:5432/tulipfarm}
      INTEGRATION_WORKER_PORT: "4030"
      # Same pattern as `worker`: this process calls back into the API for identity/delivery
      # lookups, so it needs a URL and a service credential of its own.
      INTERNAL_API_URL: http://app:8080
      # Empty by default, and persisted to /data by `app` on its first boot: the credential for
      # the `integration-worker-executor` client it mints for this process. Setting this here
      # overrides the file.
      INTEGRATION_WORKER_API_CREDENTIAL: ${INTEGRATION_WORKER_API_CREDENTIAL:-}
      TF_DATA_DIR: /data
    volumes:
      # Read-only: `app` owns everything on this volume. This process only reads back the
      # credential it was given.
      - tulipfarm-data:/data:ro
    # No published port: the probes are for the orchestrator, not for users.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4030/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  bucket:
    # The S3 server every install speaks to, so no deployment needs a cloud account to store a
    # file. Pinned by digest as well as tag: an unpinned rebuild can change the server underneath
    # an existing data volume. `--single-node` builds the cluster layout on first boot; it is the
    # reason this needs v2.3.0 or newer, and there is no floating `v2` tag to drift onto.
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    restart: unless-stopped
    command: ["/garage", "server", "--single-node"]
    depends_on:
      # Only to be started, never healthy: `app` writes the two secrets below and then waits for
      # this service, so requiring health here would deadlock the pair. Until they exist this
      # container exits and `restart` brings it back, which costs seconds on a first boot only.
      app:
        condition: service_started
    environment:
      # Generated by `app` on first boot, exactly as the other bootstrap secrets are. This image
      # carries no shell and Compose cannot invent randomness, so nothing else in the stack could
      # have — and a fixed default would make a paste-and-run install a known-password install.
      GARAGE_RPC_SECRET_FILE: /data/bucket/rpc-secret
      GARAGE_ADMIN_TOKEN_FILE: /data/bucket/admin-token
    configs:
      - source: garage
        target: /etc/garage.toml
    volumes:
      # Read-only: `app` owns everything on this volume. Only the two secrets are read back.
      - tulipfarm-data:/data:ro
      - tulipfarm-bucket:/var/lib/garage
    # No published port: bytes reach a browser through the API, which is where authorization for
    # a File is decided. A bucket reachable from outside would be a way around that.
    healthcheck:
      # The image has no shell and no curl, so this is `garage` itself. It proves more than the
      # HTTP probe does: the node answers on its own RPC port and is in the cluster layout.
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres:
    # Pinned by digest as well as tag: `pg17` is a moving target, so an unpinned rebuild can change
    # the server or pgvector version underneath an existing data volume. Update both together.
    image: pgvector/pgvector:pg17@sha256:494dff7e67e7bc2c826b94c331364978d145ebb86fd338154138b084223b7f67
    restart: unless-stopped
    # `pg_stat_statements` cannot be loaded by `CREATE EXTENSION` alone — it must be preloaded at
    # server start. Without it there is no way to answer "which query is slow" after the fact.
    # The migration that enables it tolerates its absence, so a managed host that does not preload
    # it still boots.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      # Defaults are sized for a tiny container. These suit a single-node deployment; a managed
      # host ignores them entirely because it is not started by this file.
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
    environment:
      POSTGRES_USER: tulipfarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tulipfarm}
      POSTGRES_DB: tulipfarm
    volumes:
      - tulipfarm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tulipfarm", "-d", "tulipfarm"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  tulipfarm-postgres:
  tulipfarm-soul:
  tulipfarm-data:
  tulipfarm-bucket:

configs:
  # Written by Compose itself, so the paste-and-run promise survives: no file to create, and no
  # value here is a secret. Garage takes `metadata_dir`, `data_dir` and both bind addresses from a
  # config file only — its environment variables cover secrets and nothing else.
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      # One node stores one copy. Garage refuses any other value for a single-node layout.
      replication_factor = 1

      # Bound to loopback: cluster RPC has no second node to reach on a single-node install, and
      # leaving it off the compose network keeps the port unreachable even from a sibling service.
      rpc_bind_addr = "127.0.0.1:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "0.0.0.0:3900"

      [admin]
      api_bind_addr = "0.0.0.0:3903"
