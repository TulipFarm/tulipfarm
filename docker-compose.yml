name: tulipfarm

# TulipFarm — paste-and-run stack (ARCH-V1, Postgres-only). `app` is the single image
# (API + built SPA + in-process pg-boss workers); `worker` runs the durable Run/wait/outbox
# loops off that same image. Bundled `postgres` ships pgvector.
#
# No `.env` is required. Every variable below has a default, and the three bootstrap
# secrets (ENCRYPTION_KEY / JWT_SECRET / WEBHOOK_SIGNING_SECRET) are generated by the app
# on first boot and persisted to the `tulipfarm-data` volume. Setting any of
# them in the environment overrides the generated one — the installer does exactly that.
#
#   docker compose up -d   →   http://localhost:8080
#
# Variables you may want to set (in a `.env` next to this file, or your platform's UI):
#   HOST_PORT       host port to publish (default 8080)
#   PUBLIC_URL      the origin users reach; drives CORS and the cookie `Secure` flag
#   POSTGRES_PASSWORD  password for the bundled database (default `tulipfarm`)
#
# External / managed Postgres: set EXTERNAL_DATASTORE=true and DATABASE_URL to your
# server (it must allow the `vector` and `citext` extensions), then start only the app and
# worker: `docker compose up -d app worker`. The bundled `postgres` service is never created.
#
# SECURITY NOTES
#   * The bundled database defaults to the password `tulipfarm`. That is required for a
#     file that runs with no prior setup — Postgres needs a password at init time. It is
#     safe only because port 5432 is never published to the host; do not publish it.
#     The installer generates a strong password instead.
#   * Generated secrets live on the same host as the database volume, so a full host
#     compromise yields both. Supply ENCRYPTION_KEY from a real secret store for
#     production/enterprise deployments.
services:
  app:
    # Shipped to the install dir, which has no build context — pull the published image only.
    # (For local image builds use a docker-compose.override.yml with `build: .`.)
    image: ghcr.io/tulipfarm/tulipfarm:${TULIPFARM_VERSION:-latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
        # External mode starts only `app`, so `postgres` is absent from the run —
        # don't block startup on a service that isn't part of it.
        required: false
    environment:
      PORT: "8080"
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${HOST_PORT:-8080}}
      # Bundled mode wires this from POSTGRES_PASSWORD; override it for managed Postgres.
      DATABASE_URL: ${DATABASE_URL:-postgresql://tulipfarm:${POSTGRES_PASSWORD:-tulipfarm}@postgres:5432/tulipfarm}
      # Empty means "generate and persist to /data on first boot" — see the header.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      SOUL_PATH: /opt/tulipfarm/soul
      TF_DATA_DIR: /data
    ports:
      # HOST_BIND=127.0.0.1 keeps the plain-HTTP port off the network behind a proxy.
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    volumes:
      - tulipfarm-soul:/opt/tulipfarm/soul
      # Generated bootstrap secrets and backups. Losing this volume loses the encryption
      # key for every stored secret — back it up.
      - tulipfarm-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    # Same image as `app` — one tag always pairs an API with a worker that speaks the same
    # schema. The worker never migrates; it refuses to boot below the schema floor it needs,
    # which is why it waits for `app` (the migrator) to be healthy first.
    image: ghcr.io/tulipfarm/tulipfarm:${TULIPFARM_VERSION:-latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "worker.cjs"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://tulipfarm:${POSTGRES_PASSWORD:-tulipfarm}@postgres:5432/tulipfarm}
      WORKER_PORT: "4020"
      # Exactly one replica owns cron and maintenance consumers.
      WORKER_MAINTENANCE: "true"
      # The turn runs here, so this process calls back into the API for Context, Tool dispatch
      # and Turn completion. Service-to-service on the compose network — never the public URL.
      INTERNAL_API_URL: http://app:8080
      # Both empty by default, and both persisted to /data by `app` on its first boot: the
      # encryption key by the bootstrap-secrets pass, the credential by the `run-executor`
      # client it mints for this process. Setting either here overrides the file.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      WORKER_API_CREDENTIAL: ${WORKER_API_CREDENTIAL:-}
      TF_DATA_DIR: /data
    volumes:
      # Read-only: `app` owns everything on this volume. The worker only reads back the two
      # values it was given.
      - tulipfarm-data:/data:ro
    # No published port: the probes are for the orchestrator, not for users.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4020/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  integration-worker:
    # Same image as `app` and `worker` — one tag always pairs them against the same schema. This
    # process never migrates either; it waits for `app` (the migrator) to be healthy first.
    image: ghcr.io/tulipfarm/tulipfarm:${TULIPFARM_VERSION:-latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "integration-worker.cjs"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://tulipfarm:${POSTGRES_PASSWORD:-tulipfarm}@postgres:5432/tulipfarm}
      INTEGRATION_WORKER_PORT: "4030"
      # Same pattern as `worker`: this process calls back into the API for identity/delivery
      # lookups, so it needs a URL and a service credential of its own.
      INTERNAL_API_URL: http://app:8080
      # Empty by default, and persisted to /data by `app` on its first boot: the credential for
      # the `integration-worker-executor` client it mints for this process. Setting this here
      # overrides the file.
      INTEGRATION_WORKER_API_CREDENTIAL: ${INTEGRATION_WORKER_API_CREDENTIAL:-}
      TF_DATA_DIR: /data
    volumes:
      # Read-only: `app` owns everything on this volume. This process only reads back the
      # credential it was given.
      - tulipfarm-data:/data:ro
    # No published port: the probes are for the orchestrator, not for users.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4030/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tulipfarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tulipfarm}
      POSTGRES_DB: tulipfarm
    volumes:
      - tulipfarm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tulipfarm", "-d", "tulipfarm"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  tulipfarm-postgres:
  tulipfarm-soul:
  tulipfarm-data:
