name: Compose parity

# Reusable parity gate (INST-008 / AC-007), called by publish-image.yml to verify the
# exact published release candidate before it is promoted.
#
# The pull-request and main-push copy of this gate lives in container.yml, where the
# image it tests is built once and shared. This file is deliberately `workflow_call`
# only: having it also trigger on `pull_request` meant a third independent build of the
# same amd64 image, racing two other jobs for one BuildKit cache scope.
#
# Three phases, all against the one candidate image:
#   1. zero-env   — no `.env` at all, the paste-and-run path (INST-002). Also proves the
#                   generated secrets survive a restart.
#   2. key-loss   — data volume wiped, database intact: the app must REFUSE to boot rather
#                   than silently orphan every encrypted secret.
#   3. configured — the installer's path, with real secrets supplied in `.env`.
on:
  workflow_call:
    inputs:
      image:
        description: "Published candidate image to verify"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  compose-parity:
    name: Compose parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # `--pull missing` in the compose files plus this pinned tag make compose reuse the
      # image pulled below instead of the not-yet-published release tag. Exported rather
      # than written to `.env` so phase 1 genuinely runs with no `.env` file on disk.
      TULIPFARM_VERSION: ci
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull and tag the candidate
        env:
          CANDIDATE_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          docker pull "$CANDIDATE_IMAGE"
          docker tag "$CANDIDATE_IMAGE" ghcr.io/tulipfarm/tulipfarm:ci
      - name: Run Compose parity test
        run: |
          set -o pipefail
          bash scripts/test/compose-parity.sh 2>&1 | tee compose-parity.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Compose parity"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Zero-env boot, key-loss guard, and configured stack all passed**"
            else
              echo "❌ **Compose parity failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 compose-parity.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-compose-parity-candidate
          path: compose-parity.log
          if-no-files-found: ignore
          retention-days: 7
