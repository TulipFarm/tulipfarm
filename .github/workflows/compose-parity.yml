name: Compose parity

# Reusable parity gate (INST-008 / AC-007): boot the FULL bundled compose stack
# and prove `/health` passes in-container. The container path — not native
# `pnpm dev` — is the tested release path. Called from two places:
#   - ci.yml (every PR / main push) as a standalone quality signal
#   - publish-image.yml (tag pushes), which gates the GHCR publish on it
on:
  workflow_call:

permissions:
  contents: read

jobs:
  compose-parity:
    name: Compose parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build the single bundled image once and load it into the local daemon, tagged
      # to match what compose resolves (TULIPFARM_VERSION=ci below). No push, no creds.
      - name: Build app image (load into daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/tulipfarm/tulipfarm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Throwaway CI-only secrets — never real. `--pull never` (below) + this pinned
      # TULIPFARM_VERSION make compose reuse the image we just built.
      - name: Write CI .env
        run: |
          cat > .env <<EOF
          TULIPFARM_VERSION=ci
          COMPOSE_PROFILES=bundled
          POSTGRES_PASSWORD=ci-postgres-pw
          ENCRYPTION_KEY=$(openssl rand -base64 32)
          JWT_SECRET=$(openssl rand -base64 32)
          WEBHOOK_SIGNING_SECRET=$(openssl rand -base64 32)
          HOST_PORT=8080
          SETUP_MODE=wizard
          EOF
      # `--wait` blocks until BOTH services report healthy (postgres pg_isready, app's
      # /health healthcheck) or the timeout trips — this is the health gate.
      # `--pull missing`: pull images absent locally (the bundled `pgvector/pgvector:pg17`
      # base) but REUSE the `tulipfarm:ci` image the buildx step just loaded — never try to pull
      # the not-yet-published app tag from GHCR. (`--pull never` would also block postgres.)
      - name: Bring up the bundled stack and wait for health
        run: |
          set -o pipefail
          docker compose up -d --wait --wait-timeout 180 --pull missing 2>&1 | tee compose-parity.log
      - name: Assert /health on the host port
        run: |
          set -o pipefail
          curl -fsS --retry 5 --retry-connrefused --retry-delay 3 \
            http://localhost:8080/health 2>&1 | tee -a compose-parity.log
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color 2>&1 | tee -a compose-parity.log
      - name: Tear down
        if: always()
        run: docker compose down -v
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Compose parity"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Bundled stack booted and /health passed**"
            else
              echo "❌ **Compose parity failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 compose-parity.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-compose-parity
          path: compose-parity.log
          if-no-files-found: ignore
          retention-days: 7
