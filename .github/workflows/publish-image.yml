name: Publish release

# A merged release PR is the only publication trigger. The workflow validates
# the reviewed release-branch snapshot, builds one immutable multi-arch
# candidate, verifies that exact candidate, promotes its manifest, and creates
# the GitHub Release last.
on:
  pull_request:
    types: [closed]
    branches: [main]

# Only a genuine merged release branch takes the shared `release-publish` lock. Every
# other closed pull request instantiates this workflow too (GitHub offers no head-branch
# trigger filter) and skips every job in ~2s — but it used to claim the same group first,
# so an ordinary merge could sit queued behind a running release. Giving those no-op runs
# a per-run group keeps them out of the queue entirely.
concurrency:
  group: >-
    release-${{
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
      && 'publish' || github.run_id
    }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release merge
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      candidate: ${{ steps.release.outputs.candidate }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "26.5.0"
      - id: release
        name: Validate release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          version="${HEAD_BRANCH#release/v}"
          tag="v$version"
          package_version="$(node -p "require('./package.json').version")"
          [ "$package_version" = "$version" ] || {
            echo "Release branch requests $version but package.json contains $package_version"
            exit 1
          }
          VERSION="$version" node --input-type=module -e '
            import { isReleaseVersion } from "./scripts/request-release.ts";
            if (!isReleaseVersion(process.env.VERSION ?? "")) {
              throw new Error("Invalid release version: " + process.env.VERSION);
            }
          '
          while IFS= read -r file; do
            case "$file" in
              CHANGELOG.md|package.json) ;;
              *)
                echo "Release PR contains an unexpected file: $file"
                exit 1
                ;;
            esac
          done < <(gh pr diff "$PR_NUMBER" --name-only)
          grep -Fq "## [$version]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $version"
            exit 1
          }
          node scripts/release-changelog.ts validate "$version"
          git fetch origin main --tags
          source_sha="$(git merge-base "$RELEASE_SHA" origin/main)"
          git merge-base --is-ancestor "$source_sha" origin/main || {
            echo "Release source $source_sha is not reachable from main"
            exit 1
          }
          changed="$(git diff --name-only "$source_sha" "$RELEASE_SHA")"
          [ -n "$changed" ] || {
            echo "Release snapshot has no generated changes"
            exit 1
          }
          while IFS= read -r file; do
            case "$file" in
              CHANGELOG.md|package.json) ;;
              *)
                echo "Release snapshot contains an unexpected file: $file"
                exit 1
                ;;
            esac
          done <<< "$changed"
          if git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
            tagged_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
            [ "$tagged_sha" = "$RELEASE_SHA" ] || {
              echo "$tag already points to $tagged_sha"
              exit 1
            }
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release_sha=$RELEASE_SHA"
            echo "source_sha=$source_sha"
            echo "candidate=ghcr.io/tulipfarm/tulipfarm:sha-$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"
  # This used to re-run `pnpm lint && typecheck && test && build` against a commit whose
  # CI run was already green — ~16 minutes of duplicated work on the release critical
  # path, gated on root `pnpm test`, which is the least reliable command in the repo. A
  # single spurious worker-suite hook timeout killed releases that had nothing wrong with
  # them. Assert the recorded verdict for that exact SHA instead: same guarantee, seconds.
  quality:
    name: Verify merged source
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require green required checks on the release commit
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ needs.metadata.outputs.release_sha }}
        with:
          script: |
            // Exactly the contexts `main` branch protection requires.
            const required = [
              "CI Success",
              "Docker build",
              "Compose parity",
              "Installer smoke",
            ];
            const sha = process.env.RELEASE_SHA;
            const { owner, repo } = context.repo;
            // A skipped job is a legitimate pass: its workflow decided the diff could
            // not affect it. Anything else — including a still-running check — is not.
            const passing = new Set(["success", "skipped", "neutral"]);
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // Check runs are eventually consistent right after a merge, and a check can
            // still be in flight. Poll for up to ~5 minutes before giving up.
            const deadline = Date.now() + 5 * 60_000;
            let latest = new Map();
            let pending = [];
            for (;;) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: sha, per_page: 100,
              });
              latest = new Map();
              for (const run of runs) {
                if (!required.includes(run.name)) continue;
                const seen = latest.get(run.name);
                // Keep the most recent attempt for each context.
                if (!seen || new Date(run.started_at) >= new Date(seen.started_at)) {
                  latest.set(run.name, run);
                }
              }
              pending = required.filter((name) => {
                const run = latest.get(name);
                return !run || run.status !== "completed";
              });
              if (pending.length === 0 || Date.now() >= deadline) break;
              core.info(`Waiting on: ${pending.join(", ")}`);
              await sleep(15_000);
            }

            const lines = required.map((name) => {
              const run = latest.get(name);
              if (!run) return `| ${name} | ❌ not reported |`;
              if (run.status !== "completed") return `| ${name} | ⏳ ${run.status} |`;
              const ok = passing.has(run.conclusion);
              return `| ${name} | ${ok ? "✅" : "❌"} ${run.conclusion} |`;
            });
            await core.summary
              .addRaw(
                `## Required checks on \`${sha}\`\n\n| Check | Result |\n| --- | --- |\n${lines.join("\n")}\n`
              )
              .write();

            const bad = required.filter((name) => {
              const run = latest.get(name);
              return !run || run.status !== "completed" || !passing.has(run.conclusion);
            });
            if (bad.length) {
              core.setFailed(
                `Release commit ${sha} does not have green required checks: ${bad.join(", ")}`
              );
            }

  # Each platform builds on a runner of its own architecture. arm64 previously built
  # under QEMU on an amd64 runner, where Vite's native Rollup binary plus worker threads
  # deadlock — no crash, no output, just a job pinned until the timeout. Native runners
  # remove that failure mode and cut the arm64 build from ~10m to ~3m.
  build-candidate-arch:
    name: Build candidate (${{ matrix.platform }})
    needs: [metadata, quality]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.release_sha }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: candidate
        name: Check for an existing candidate platform
        env:
          CANDIDATE_IMAGE: ${{ needs.metadata.outputs.candidate }}-${{ matrix.arch }}
        run: |
          if docker buildx imagetools inspect "$CANDIDATE_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push candidate platform
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.metadata.outputs.candidate }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=tulipfarm-${{ matrix.arch }}
          cache-to: type=gha,mode=min,ignore-error=true,scope=tulipfarm-${{ matrix.arch }}

  build-candidate:
    name: Assemble immutable candidate manifest
    needs: [metadata, build-candidate-arch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: candidate
        name: Check for an existing candidate manifest
        env:
          CANDIDATE_IMAGE: ${{ needs.metadata.outputs.candidate }}
        run: |
          if docker buildx imagetools inspect "$CANDIDATE_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create candidate manifest
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        env:
          CANDIDATE_IMAGE: ${{ needs.metadata.outputs.candidate }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$CANDIDATE_IMAGE" \
            "${CANDIDATE_IMAGE}-amd64" \
            "${CANDIDATE_IMAGE}-arm64"
      - name: Verify candidate platforms
        env:
          CANDIDATE_IMAGE: ${{ needs.metadata.outputs.candidate }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$CANDIDATE_IMAGE" --raw > manifest.json
          jq -e '
            [
              .manifests[].platform
              | select(.os == "linux")
              | "\(.os)/\(.architecture)"
            ] | unique | sort
              == ["linux/amd64", "linux/arm64"]
          ' manifest.json

  verify-image:
    name: Verify candidate
    needs: [metadata, build-candidate]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/compose-parity.yml
    with:
      image: ${{ needs.metadata.outputs.candidate }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [metadata, verify-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      CANDIDATE_IMAGE: ${{ needs.metadata.outputs.candidate }}
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/tulipfarm/tulipfarm
      RELEASE_SHA: ${{ needs.metadata.outputs.release_sha }}
      SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
      TAG: ${{ needs.metadata.outputs.tag }}
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.release_sha }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create source tag
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          if git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
            [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$RELEASE_SHA" ]
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" "$RELEASE_SHA" \
              --message "Release $TAG" \
              --message "TulipFarm-Source-SHA: $SOURCE_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Promote verified image
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE:$TAG")
          if [[ "$VERSION" != *-* ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$CANDIDATE_IMAGE"
          docker buildx imagetools inspect "$IMAGE:$TAG"
      - name: Generate release notes
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          {
            echo "## Container image"
            echo
            echo '```sh'
            echo "docker pull $IMAGE:$TAG"
            echo '```'
            echo
            node scripts/release-changelog.ts section "$VERSION"
          } > "$NOTES_FILE"
      - name: Create GitHub Release
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
            exit 0
          fi
          args=(release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES_FILE")
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
      - name: Summarize
        run: |
          {
            echo "## $TAG published"
            echo
            echo "- Release snapshot: \`$RELEASE_SHA\`"
            echo "- Main source boundary: \`$SOURCE_SHA\`"
            echo "- Image: \`$IMAGE:$TAG\`"
            echo "- Candidate: \`$CANDIDATE_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
