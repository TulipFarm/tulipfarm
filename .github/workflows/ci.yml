name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Skip the quality jobs on tag refs: a release pushes the commit (PR/main CI
    # already ran these) AND the `v*` tag — running the full suite twice on the
    # same SHA is wasteful. On a tag only compose-parity → publish-image run.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Lint"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Lint passed**"
            else
              echo "❌ **Lint failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 lint.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-lint
          path: lint.log
          if-no-files-found: ignore
          retention-days: 7

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Typecheck"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Typecheck passed**"
            else
              echo "❌ **Typecheck failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 typecheck.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-typecheck
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build (api + web; docs has its own job)
        run: |
          set -o pipefail
          pnpm exec turbo build --filter='!@tulipfarm/docs' 2>&1 | tee build.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Build"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Build passed**"
            else
              echo "❌ **Build failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 build.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-build
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # `.source` is generated by the docs app's `postinstall` (fumadocs-mdx),
      # which already ran during the frozen install above.
      - name: Build docs (fumadocs / Next static export)
        run: |
          set -o pipefail
          pnpm --filter @tulipfarm/docs run build 2>&1 | tee docs-build.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Docs build"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Docs build passed**"
            else
              echo "❌ **Docs build failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 docs-build.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-docs-build
          path: docs-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload docs static site
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: apps/docs/out
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Test"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Tests passed**"
            else
              echo "❌ **Tests failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 test.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-test
          path: test.log
          if-no-files-found: ignore
          retention-days: 7

  # Non-blocking coverage for the bulk of the suite (apps/api). Runs in parallel;
  # never gates merges. A separate job keeps the authoritative `test` job lean.
  coverage:
    name: Coverage (apps/api)
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Coverage (apps/api)
        continue-on-error: true
        # Invoke vitest directly (not via `run test --`, whose arg-forwarding
        # drops these flags). cwd is apps/api, so output lands in apps/api/coverage.
        run: |
          set -o pipefail
          pnpm --filter @tulipfarm/api exec vitest run \
            --coverage \
            --coverage.reporter=text-summary \
            --coverage.reporter=json-summary 2>&1 | tee coverage.log
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Coverage (apps/api) — informational"
            echo '```'
            tail -n 15 coverage.log 2>/dev/null || echo "(no coverage captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: apps/api/coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  # Single required status check. Aggregates the four core jobs, posts a sticky
  # PR comment, mirrors it to the run summary, and fails if any core check did
  # not succeed. Require ONLY this check ("CI Success") in branch protection.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, docs-build, test, coverage]
    # always() so it still runs when a core job fails — but not on tag refs,
    # where the gated quality jobs are skipped (publish-image is the tag path).
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download logs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: logs
          merge-multiple: true
      - name: Report and gate
        uses: actions/github-script@v9
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_BUILD_RESULT: ${{ needs['docs-build'].result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const marker = "<!-- tulipfarm-ci-report -->";

            const coreChecks = [
              ["Lint", "lint", process.env.LINT_RESULT],
              ["Typecheck", "typecheck", process.env.TYPECHECK_RESULT],
              ["Build", "build", process.env.BUILD_RESULT],
              ["Docs build", "docs-build", process.env.DOCS_BUILD_RESULT],
              ["Test", "test", process.env.TEST_RESULT],
            ];
            const icon = (r) =>
              r === "success" ? "✅ pass"
              : r === "failure" ? "❌ fail"
              : r === "cancelled" ? "🚫 cancelled"
              : r === "skipped" ? "⏭️ skipped"
              : `❔ ${r}`;

            let body = `${marker}\n### CI results\n\n`;
            body += "| Check | Result |\n| --- | --- |\n";
            for (const [label, , res] of coreChecks) body += `| ${label} | ${icon(res)} |\n`;
            const covOk = process.env.COVERAGE_RESULT === "success";
            body += `| Coverage (apps/api) | ${covOk ? "ℹ️ see below" : "— (non-blocking)"} |\n\n`;

            const readTail = (file, n = 50) => {
              try {
                const lines = fs.readFileSync(path.join("logs", file), "utf8").split("\n");
                return lines.slice(-n).join("\n").trim();
              } catch {
                return null;
              }
            };
            for (const [label, key, res] of coreChecks) {
              if (res === "failure") {
                const tail = readTail(`${key}.log`);
                if (tail) {
                  body += `<details><summary>❌ ${label} — last 50 lines</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n\n</details>\n\n`;
                }
              }
            }

            try {
              const cov = JSON.parse(fs.readFileSync("logs/coverage-summary.json", "utf8"));
              const t = cov.total || {};
              const pct = (m) => (t[m] && t[m].pct != null ? `${t[m].pct}%` : "n/a");
              body += "<details><summary>Coverage (apps/api) — informational, not a merge gate</summary>\n\n";
              body += "| Metric | % |\n| --- | --- |\n";
              body += `| Lines | ${pct("lines")} |\n| Statements | ${pct("statements")} |\n| Functions | ${pct("functions")} |\n| Branches | ${pct("branches")} |\n\n`;
              body += "</details>\n\n";
            } catch {
              /* coverage absent — non-blocking */
            }

            body += "_Full logs are attached as run artifacts (`log-*`)._\n";

            await core.summary.addRaw(body).write();

            // Commenting is best-effort: a fork PR gets a read-only token, so
            // never let a comment failure flip the gate. Pass/fail is decided
            // solely by the four core jobs below.
            if (context.eventName === "pull_request") {
              try {
                const { owner, repo } = context.repo;
                const issue_number = context.issue.number;
                const { data: comments } = await github.rest.issues.listComments({
                  owner, repo, issue_number, per_page: 100,
                });
                const existing = comments.find(
                  (c) => c.user && c.user.type === "Bot" && c.body && c.body.includes(marker)
                );
                if (existing) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number, body });
                }
              } catch (err) {
                core.warning(`Could not post PR comment (likely a fork PR with a read-only token): ${err.message}`);
              }
            }

            const failed = coreChecks.filter(([, , r]) => r !== "success");
            if (failed.length) {
              core.setFailed(
                `Required checks not passing: ${failed.map(([l, , r]) => `${l}=${r}`).join(", ")}`
              );
            }

  # Parity gate (INST-008 / AC-007): boot the FULL bundled compose stack on every run
  # and prove `/health` passes in-container. The container path — not native `pnpm dev`
  # — is the tested release path. Standalone (not part of the `ci-success` merge gate),
  # but `publish-image` below `needs:` it, so nothing ships that this hasn't exercised.
  compose-parity:
    name: Compose parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build the single bundled image once and load it into the local daemon, tagged
      # to match what compose resolves (TULIPFARM_VERSION=ci below). No push, no creds.
      - name: Build app image (load into daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/tulipfarm/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Throwaway CI-only secrets — never real. `--pull never` (below) + this pinned
      # TULIPFARM_VERSION make compose reuse the image we just built.
      - name: Write CI .env
        run: |
          cat > .env <<EOF
          TULIPFARM_VERSION=ci
          COMPOSE_PROFILES=bundled
          POSTGRES_PASSWORD=ci-postgres-pw
          ENCRYPTION_KEY=$(openssl rand -base64 32)
          JWT_SECRET=$(openssl rand -base64 32)
          WEBHOOK_SIGNING_SECRET=$(openssl rand -base64 32)
          HOST_PORT=8080
          SETUP_MODE=wizard
          EOF
      # `--wait` blocks until BOTH services report healthy (postgres pg_isready, app's
      # /health healthcheck) or the timeout trips — this is the health gate.
      # `--pull missing`: pull images absent locally (the bundled `pgvector/pgvector:pg17`
      # base) but REUSE the `app:ci` image the buildx step just loaded — never try to pull
      # the not-yet-published app tag from GHCR. (`--pull never` would also block postgres.)
      - name: Bring up the bundled stack and wait for health
        run: |
          set -o pipefail
          docker compose up -d --wait --wait-timeout 180 --pull missing 2>&1 | tee compose-parity.log
      - name: Assert /health on the host port
        run: |
          set -o pipefail
          curl -fsS --retry 5 --retry-connrefused --retry-delay 3 \
            http://localhost:8080/health 2>&1 | tee -a compose-parity.log
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color 2>&1 | tee -a compose-parity.log
      - name: Tear down
        if: always()
        run: docker compose down -v
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Compose parity"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Bundled stack booted and /health passed**"
            else
              echo "❌ **Compose parity failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 compose-parity.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-compose-parity
          path: compose-parity.log
          if-no-files-found: ignore
          retention-days: 7

  # Installer smoke (issue 186 / AC-001): run the real OCI installer
  # (scripts/get.tulipfarm.sh) against the locally-built image into a throwaway dir and
  # assert /health (+ idempotent re-run). Standalone, non-tag refs only (like the other
  # quality jobs); not part of the publish path.
  installer-smoke:
    name: Installer smoke
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build app image as :ci into the daemon; the smoke harness reuses it (no rebuild).
      - name: Build app image (load into daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/tulipfarm/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run installer smoke test
        run: |
          set -o pipefail
          bash scripts/test/installer-smoke.sh 2>&1 | tee installer-smoke.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Installer smoke"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Installer brought up the stack and /health passed**"
            else
              echo "❌ **Installer smoke failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 installer-smoke.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-installer-smoke
          path: installer-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  # Multi-arch publish (INST-001/011, AC-003): build the single bundled image for
  # linux/amd64 + linux/arm64 and push to GHCR under one pinned version tag (no skew).
  # Tags only (v*); gated on `compose-parity` so only health-checked images ship.
  publish-image:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [compose-parity]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Always tag the exact version. Only move `:latest` for STABLE releases —
      # prerelease/canary tags carry a `-` identifier (e.g. v0.1.0-alpha.0, from
      # `pnpm release:canary`) and must not clobber the latest stable image.
      - name: Compute image tags
        id: imgtags
        run: |
          ref="${{ github.ref_name }}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/tulipfarm/app:${ref}"
            if [[ "$ref" != *-* ]]; then
              echo "ghcr.io/tulipfarm/app:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
