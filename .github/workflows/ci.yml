name: CI

# Quality suite for PRs and main pushes. Tag pushes (`v*`) are handled entirely
# by publish-image.yml — this workflow never runs on tags.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect whether a PR touches anything beyond docs. `code` is 'true' when any
  # changed file is NOT under apps/docs/ and NOT a .md/.mdx file. Dependency-free
  # (no marketplace actions). Non-PR events (e.g. push to main) always set true.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              apps/docs/*) ;;
              *.md) ;;
              *.mdx) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Lint"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Lint passed**"
            else
              echo "❌ **Lint failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 lint.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-lint
          path: lint.log
          if-no-files-found: ignore
          retention-days: 7

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Typecheck"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Typecheck passed**"
            else
              echo "❌ **Typecheck failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 typecheck.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-typecheck
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build (api + web; docs has its own job)
        run: |
          set -o pipefail
          pnpm exec turbo build --filter='!@tulipfarm/docs' 2>&1 | tee build.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Build"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Build passed**"
            else
              echo "❌ **Build failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 build.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-build
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

  # Static architecture guardrail (AW-004): enforce the package/app dependency
  # allowlist and block forbidden imports and import cycles. Encodes
  # docs/architecture/dependency-rules.md. Fast and deterministic — always runs.
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Enforce dependency and import rules
        run: |
          set -o pipefail
          pnpm architecture:test 2>&1 | tee architecture.log
          pnpm architecture:check 2>&1 | tee -a architecture.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Architecture"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Dependency and import rules passed**"
            else
              echo "❌ **Architecture check failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 architecture.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-architecture
          path: architecture.log
          if-no-files-found: ignore
          retention-days: 7

  # Schema contract fixtures (AW-004 / SPEC §25 layer 1): run the schema package's
  # fixture and property tests as a focused, always-on signal for the single
  # contract authority. Independent of the sharded package test job.
  schema-fixtures:
    name: Schema fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Validate schema fixtures
        run: |
          set -o pipefail
          pnpm --filter @tulipfarm/schema test 2>&1 | tee schema-fixtures.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Schema fixtures"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Schema fixtures passed**"
            else
              echo "❌ **Schema fixtures failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 schema-fixtures.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-schema-fixtures
          path: schema-fixtures.log
          if-no-files-found: ignore
          retention-days: 7

  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # `.source` is generated by the docs app's `postinstall` (fumadocs-mdx),
      # which already ran during the frozen install above.
      - name: Build docs (fumadocs / Next static export)
        run: |
          set -o pipefail
          pnpm --filter @tulipfarm/docs run build 2>&1 | tee docs-build.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Docs build"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Docs build passed**"
            else
              echo "❌ **Docs build failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 docs-build.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-docs-build
          path: docs-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload docs static site
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: apps/docs/out
          if-no-files-found: warn
          retention-days: 7

  test-api:
    name: Test API (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test API shard ${{ matrix.shard }}/5 with coverage
        run: |
          set -o pipefail
          pnpm --filter @tulipfarm/api exec vitest run \
            --shard=${{ matrix.shard }}/5 \
            --coverage \
            --coverage.reporter=json \
            --reporter=default \
            --reporter=blob \
            --outputFile="${{ github.workspace }}/coverage-blobs/api-${{ matrix.shard }}.json" \
            2>&1 | tee test-api-${{ matrix.shard }}.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Test API (${{ matrix.shard }}/5)"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **API shard passed with coverage**"
            else
              echo "❌ **API shard failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 test-api-${{ matrix.shard }}.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-test-api-${{ matrix.shard }}
          path: test-api-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage blob
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-blob-api-${{ matrix.shard }}
          path: coverage-blobs/api-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  test-packages:
    name: Test packages
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test packages with coverage
        run: |
          set -o pipefail
          pnpm exec turbo test --filter='./packages/*' -- \
            --coverage \
            --coverage.reporter=json \
            --reporter=default \
            --reporter=blob \
            2>&1 | tee test-packages.log
      - name: Collect package coverage blobs
        run: |
          mkdir -p coverage-blobs
          while IFS= read -r report; do
            package="${report#packages/}"
            package="${package%%/*}"
            cp "$report" "coverage-blobs/package-${package}.json"
          done < <(find packages -path '*/.vitest-reports/blob.json' -type f)
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Test packages"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Package tests passed with coverage**"
            else
              echo "❌ **Package tests failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 test-packages.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-test-packages
          path: test-packages.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage blobs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-blob-packages
          path: coverage-blobs/*.json
          if-no-files-found: error
          retention-days: 1

  # Preserve the existing web and worker suites while keeping the requested
  # API shards and package tests independently visible in CI.
  test-apps:
    name: Test other apps
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test non-API apps with coverage
        run: |
          set -o pipefail
          pnpm exec turbo test \
            --filter=@tulipfarm/web \
            --filter=@tulipfarm/worker \
            --filter=@tulipfarm/integration-worker \
            -- \
            --coverage \
            --coverage.reporter=json \
            --reporter=default \
            --reporter=blob \
            2>&1 | tee test-apps.log
      - name: Collect app coverage blobs
        run: |
          mkdir -p coverage-blobs
          while IFS= read -r report; do
            app="${report#apps/}"
            app="${app%%/*}"
            cp "$report" "coverage-blobs/app-${app}.json"
          done < <(find apps -path '*/.vitest-reports/blob.json' -type f)
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Test other apps"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Other app tests passed with coverage**"
            else
              echo "❌ **Other app tests failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 test-apps.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-test-apps
          path: test-apps.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage blobs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-blob-apps
          path: coverage-blobs/*.json
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: [changes, test-api, test-packages, test-apps]
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Download coverage blobs
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-blob-*
          path: coverage-blobs
          merge-multiple: true
      - name: Merge and report coverage
        run: |
          set -o pipefail
          pnpm exec vitest \
            --merge-reports=coverage-blobs \
            --passWithNoTests \
            --coverage \
            --coverage.reporter=text-summary \
            --coverage.reporter=json-summary \
            2>&1 | tee coverage.log
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Combined coverage"
            echo '```'
            tail -n 15 coverage.log 2>/dev/null || echo "(no coverage captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-coverage
          path: coverage.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage summary
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

  # Single required status check. Aggregates the core jobs, posts a sticky
  # PR comment, mirrors it to the run summary, and fails if any core check did
  # not succeed. Require ONLY this check ("CI Success") in branch protection.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        lint,
        typecheck,
        build,
        architecture,
        schema-fixtures,
        docs-build,
        test-api,
        test-packages,
        test-apps,
        coverage,
      ]
    # always() so it still runs when a core job fails.
    if: ${{ always() }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download logs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: log-*
          path: logs
          merge-multiple: true
      - name: Download coverage summary
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-summary
          path: logs
      - name: Report and gate
        uses: actions/github-script@v9
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          SCHEMA_FIXTURES_RESULT: ${{ needs['schema-fixtures'].result }}
          DOCS_BUILD_RESULT: ${{ needs['docs-build'].result }}
          TEST_API_RESULT: ${{ needs['test-api'].result }}
          TEST_PACKAGES_RESULT: ${{ needs['test-packages'].result }}
          TEST_APPS_RESULT: ${{ needs['test-apps'].result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const marker = "<!-- tulipfarm-ci-report -->";

            // Fourth tuple field `allowSkip`: when true, a `skipped` result
            // counts as passing (test and coverage jobs are gated off for
            // docs/markdown-only PRs via the `changes` job).
            const coreChecks = [
              ["Lint", "lint", process.env.LINT_RESULT, false],
              ["Typecheck", "typecheck", process.env.TYPECHECK_RESULT, false],
              ["Build", "build", process.env.BUILD_RESULT, false],
              ["Architecture", "architecture", process.env.ARCHITECTURE_RESULT, false],
              ["Schema fixtures", "schema-fixtures", process.env.SCHEMA_FIXTURES_RESULT, false],
              ["Docs build", "docs-build", process.env.DOCS_BUILD_RESULT, false],
              ["Test API (5 shards)", "test-api", process.env.TEST_API_RESULT, true],
              ["Test packages", "test-packages", process.env.TEST_PACKAGES_RESULT, true],
              ["Test other apps", "test-apps", process.env.TEST_APPS_RESULT, true],
              ["Coverage report", "coverage", process.env.COVERAGE_RESULT, true],
            ];
            const icon = (r) =>
              r === "success" ? "✅ pass"
              : r === "failure" ? "❌ fail"
              : r === "cancelled" ? "🚫 cancelled"
              : r === "skipped" ? "⏭️ skipped"
              : `❔ ${r}`;

            let body = `${marker}\n### CI results\n\n`;
            body += "| Check | Result |\n| --- | --- |\n";
            for (const [label, , res] of coreChecks) body += `| ${label} | ${icon(res)} |\n`;
            body += "\n";

            const readTail = (file, n = 50) => {
              try {
                const lines = fs.readFileSync(path.join("logs", file), "utf8").split("\n");
                return lines.slice(-n).join("\n").trim();
              } catch {
                return null;
              }
            };
            const readCheckTail = (key) => {
              const exact = readTail(`${key}.log`);
              if (exact) return exact;
              try {
                return fs.readdirSync("logs")
                  .filter((file) => file.startsWith(`${key}-`) && file.endsWith(".log"))
                  .sort()
                  .map((file) => `# ${file}\n${readTail(file) || "(no log captured)"}`)
                  .join("\n\n");
              } catch {
                return null;
              }
            };
            for (const [label, key, res] of coreChecks) {
              if (res === "failure") {
                const tail = readCheckTail(key);
                if (tail) {
                  body += `<details><summary>❌ ${label} — last 50 lines</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n\n</details>\n\n`;
                }
              }
            }

            try {
              const cov = JSON.parse(fs.readFileSync("logs/coverage-summary.json", "utf8"));
              const t = cov.total || {};
              const pct = (m) => (t[m] && t[m].pct != null ? `${t[m].pct}%` : "n/a");
              body += "<details><summary>Combined coverage</summary>\n\n";
              body += "| Metric | % |\n| --- | --- |\n";
              body += `| Lines | ${pct("lines")} |\n| Statements | ${pct("statements")} |\n| Functions | ${pct("functions")} |\n| Branches | ${pct("branches")} |\n\n`;
              body += "</details>\n\n";
            } catch {
              /* Coverage is absent when the coverage job was skipped or failed. */
            }

            body += "_Full logs are attached as run artifacts (`log-*`)._\n";

            await core.summary.addRaw(body).write();

            // Commenting is best-effort: a fork PR gets a read-only token, so
            // never let a comment failure flip the gate. Pass/fail is decided
            // solely by the core jobs below.
            if (context.eventName === "pull_request") {
              try {
                const { owner, repo } = context.repo;
                const issue_number = context.issue.number;
                const { data: comments } = await github.rest.issues.listComments({
                  owner, repo, issue_number, per_page: 100,
                });
                const existing = comments.find(
                  (c) => c.user && c.user.type === "Bot" && c.body && c.body.includes(marker)
                );
                if (existing) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number, body });
                }
              } catch (err) {
                core.warning(`Could not post PR comment (likely a fork PR with a read-only token): ${err.message}`);
              }
            }

            const failed = coreChecks.filter(
              ([, , r, allowSkip]) => r !== "success" && !(allowSkip && r === "skipped")
            );
            if (failed.length) {
              core.setFailed(
                `Required checks not passing: ${failed.map(([l, , r]) => `${l}=${r}`).join(", ")}`
              );
            }

  # Parity gate (INST-008 / AC-007): boot the FULL bundled compose stack on every run
  # and prove `/health` passes in-container. Reusable workflow, shared with
  # publish-image.yml (where it gates the GHCR publish on tag pushes). Standalone
  # here — not part of the `ci-success` merge gate.
  compose-parity:
    name: Compose parity
    uses: ./.github/workflows/compose-parity.yml

  # Installer smoke (issue 186 / AC-001): run the real OCI installer
  # (scripts/get.tulipfarm.sh) against the locally-built image into a throwaway dir and
  # assert /health (+ idempotent re-run). Standalone; not part of the publish path.
  installer-smoke:
    name: Installer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build app image as :ci into the daemon; the smoke harness reuses it (no rebuild).
      - name: Build app image (load into daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/tulipfarm/tulipfarm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run installer smoke test
        run: |
          set -o pipefail
          bash scripts/test/installer-smoke.sh 2>&1 | tee installer-smoke.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Installer smoke"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Installer brought up the stack and /health passed**"
            else
              echo "❌ **Installer smoke failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 installer-smoke.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-installer-smoke
          path: installer-smoke.log
          if-no-files-found: ignore
          retention-days: 7
