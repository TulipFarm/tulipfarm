name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - id: classify
        name: Detect code changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          code=true
          if [[ "$EVENT" == pull_request ]] &&
            files=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR/files" --jq '.[].filename') &&
            [[ -n "$files" ]]; then
            code=false
            while IFS= read -r file; do
              case "$file" in
                # Skills ship as runtime content; test Markdown files are fixtures.
                */skills/* | test/* | */test/*) code=true ;;
                *.md | *.mdx | docs/* | LICENSE) ;;
                *) code=true ;;
              esac
              echo "$file"
            done <<<"$files"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.task }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, 'test:apps', 'test:memory', 'test:integrations', 'test:platform']
    env:
      # Lint always runs; typecheck and tests are skipped when only docs changed.
      RUN: ${{ matrix.task == 'lint' || needs.changes.outputs.code == 'true' }}
    steps:
      - name: Skip ${{ matrix.task }} for docs-only change
        if: env.RUN != 'true'
        run: echo "Only documentation changed; skipping $TASK."
        env:
          TASK: ${{ matrix.task }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: env.RUN == 'true'
        with:
          node-version-file: .node-version
      - name: Install pnpm
        if: env.RUN == 'true'
        run: npm install --global pnpm@11.5.3
      - name: Cache pnpm store
        if: env.RUN == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install repository dependencies
        if: env.RUN == 'true'
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store"
      - name: Run ${{ matrix.task }}
        if: env.RUN == 'true'
        env:
          TASK: ${{ matrix.task }}
        run: pnpm run "$TASK"
      - name: Install Chromium for shell accessibility checks
        if: env.RUN == 'true' && matrix.task == 'test:apps'
        run: pnpm --filter @tulipfarm/web exec playwright install --with-deps chromium
      - name: Check shell accessible names in Chromium
        if: env.RUN == 'true' && matrix.task == 'test:apps'
        run: |
          pnpm exec turbo run build --filter='@tulipfarm/web^...' --concurrency=2
          pnpm --filter @tulipfarm/web test:shell-accessibility

  skill-authoring:
    name: skill-authoring
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:local-postgres@127.0.0.1:5432/postgres
      XAI_API_KEY: synthetic-not-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install --global pnpm@11.5.3
      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store"
      - name: Create the local database roles
        run: psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - name: Build skill authoring dependencies
        run: pnpm --filter @tulipfarm/agents... build
      - name: Check skill package authoring and recovery
        run: |
          pnpm --filter @tulipfarm/agents exec node --test --test-concurrency=1 test/skill-imports.integration.mjs
          pnpm --filter @tulipfarm/conversations exec node --test --test-concurrency=1 --test-name-pattern='skill failures name|skill reads retry' test/integration/tool-errors.test.mjs

  # A release starts its code before workspace-rollout applies its common migrations to every workspace. This runs
  # chats and background jobs against a workspace one migration short, so a missing table (42P01) fails the build.
  behind-workspace:
    name: behind-workspace
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:local-postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install --global pnpm@11.5.3
      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store"
      - name: Create the local database roles
        run: psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - name: Run chats and jobs against a workspace behind the release
        run: pnpm run test:behind-workspace
      - name: Check private task reads and access revocation
        run: pnpm --filter @tulipfarm/api exec node --experimental-test-module-mocks --test --test-concurrency=1 test/agent-tasks.integration.mjs
      - name: Check that authorization lock readers share and writers queue fairly
        run: pnpm --filter @tulipfarm/access exec node --test --test-concurrency=1 test/authorization-lock.integration.mjs
      - name: Check workspace route admission and membership revocation
        run: |
          pnpm --filter @tulipfarm/api exec node --test --test-name-pattern='workspace HTTP conceals' test/governance.integration.mjs
          pnpm --filter @tulipfarm/workspace-storage exec node --test --test-name-pattern='membership admission' test/integration/runtime.test.mjs
      - name: Check row and project review drafts
        env:
          XAI_API_KEY: synthetic-not-secret
        run: pnpm --filter @tulipfarm/agents exec node --test --test-concurrency=1 test/row-drafts.integration.mjs test/project-drafts.integration.mjs
      - name: Check API call approvals and per-turn limits
        env:
          XAI_API_KEY: synthetic-not-secret
        run: pnpm --filter @tulipfarm/conversations exec node --test --test-concurrency=1 test/integration/api-calls.test.mjs
      - name: Check table approvals and workspace skill sources
        run: |
          pnpm --filter @tulipfarm/agents exec node --test --test-concurrency=1 test/table-approval.integration.mjs
          pnpm --filter @tulipfarm/tables exec node --test --test-concurrency=1 test/integration/activation-retry.test.mjs
      - name: Check agent table access
        run: |
          pnpm --filter @tulipfarm/agents exec node --test --test-concurrency=1 test/task-data-scope.integration.mjs
          pnpm --filter @tulipfarm/agents exec node --test --test-name-pattern='table enrollment' test/setup.integration.mjs
      - name: Check activation replacement and running-task authority
        run: pnpm --filter @tulipfarm/agents exec node --test --test-concurrency=1 test/activation-replacement.integration.mjs
      - name: Check private task ordering and paging
        run: pnpm --filter @tulipfarm/agents exec node --test --test-concurrency=1 test/tasks.integration.mjs
