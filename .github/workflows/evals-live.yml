name: Evals (live)

# Live agent/model quality evals against REAL providers. Manual-only for now: trigger from the
# GitHub Actions UI ("Run workflow"). There is deliberately NO schedule/cron — we run these
# ourselves on demand. They are never a PR gate (cost, nondeterminism, fork-PR secrets). The run is
# smoothed by the harness's multi-run pass-rate threshold, and the JSON/Markdown report is uploaded
# as an artifact. Configure `LLM_API_KEY` (secret) and optionally `EVAL_PROVIDER` / `EVAL_MODEL` /
# `EVAL_BASE_URL` (repo variables) for this workflow.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Samples per case (multi-run threshold smoothing)"
        required: false
        default: "3"

concurrency:
  group: evals-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  evals:
    name: Live evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run live evals
        env:
          EVAL_LIVE: "1"
          EVAL_RUNS: ${{ github.event.inputs.runs || '3' }}
          EVAL_PROVIDER: ${{ vars.EVAL_PROVIDER }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: pnpm evals
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval-results/
          if-no-files-found: warn
