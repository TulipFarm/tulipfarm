name: CodeQL

# Prefix run titles so CodeQL runs are distinguishable from CI runs on the same
# commit (both otherwise default to the commit message / PR title).
run-name: >-
  CodeQL scan ·
  ${{ github.event_name == 'schedule' && 'weekly full scan'
    || github.event_name == 'pull_request' && github.event.pull_request.title
    || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan (Mondays 06:00 UTC) to catch newly published query rules.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # JS/TS is interpreted — no compilation step required.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
