# Two pull requests that take the same number cannot both merge, because each rewrites its stream's LATEST file and
# git reports a conflict.
name: Migrations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numbers:
    name: migration numbers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Fetch the latest main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Check migration numbers
        run: node tooling/check-migration-numbers.mjs --base origin/main
