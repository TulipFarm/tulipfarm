name: Installer smoke

# Exercise the real OCI installer independently of the ordinary application CI.
# The workflow builds locally and needs no registry writes or secrets, so it is
# safe and reliable for fork and Dependabot PRs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: installer-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer-smoke:
    name: Installer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build app image (load into daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/tulipfarm/tulipfarm:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=tulipfarm-amd64
          cache-to: type=gha,mode=max,scope=tulipfarm-amd64
      - name: Run installer smoke test
        run: |
          set -o pipefail
          bash scripts/test/installer-smoke.sh 2>&1 | tee installer-smoke.log
      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Installer smoke"
            if [ "$STATUS" = "success" ]; then
              echo "✅ **Installer brought up the stack and /health passed**"
            else
              echo "❌ **Installer smoke failed** — last 100 lines:"
              echo ""
              echo '<details><summary>Log tail</summary>'
              echo ""
              echo '```'
              tail -n 100 installer-smoke.log 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-installer-smoke
          path: installer-smoke.log
          if-no-files-found: ignore
          retention-days: 7
