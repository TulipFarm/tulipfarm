name: Docker build

# Container-definition and multi-platform build gate. This deliberately runs for
# every PR: a stable required check is more reliable than a path filter that can
# silently miss a new Docker build input.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate container definitions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate Dockerfile, Compose files, and test harnesses
        run: |
          set -euo pipefail
          docker buildx build --check .
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          bash -n \
            scripts/install.sh \
            scripts/uninstall.sh \
            scripts/test/compose-parity.sh \
            scripts/test/installer-smoke.sh

  build:
    name: Build image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and export OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=oci,dest=${{ runner.temp }}/tulipfarm-${{ matrix.arch }}.tar
          provenance: false
          sbom: false
          cache-from: type=gha,scope=tulipfarm-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tulipfarm-${{ matrix.arch }}

  docker-success:
    name: Docker build
    runs-on: ubuntu-latest
    if: always()
    needs: [validate, build]
    steps:
      - name: Gate container validation and platform builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          [ "$VALIDATE_RESULT" = "success" ] || {
            echo "Container definition validation: $VALIDATE_RESULT"
            exit 1
          }
          [ "$BUILD_RESULT" = "success" ] || {
            echo "Multi-platform image build: $BUILD_RESULT"
            exit 1
          }
          echo "Container definitions and linux/amd64 + linux/arm64 builds passed."
