version: 2
updates:
  # JS/TS dependencies across the pnpm workspace (root + apps/* + packages/*).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "node"
      - dependency-name: "@types/node"
    groups:
      # Collapse the noisy minor/patch churn into a single PR per week.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep the GitHub Actions used by CI pinned and current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
