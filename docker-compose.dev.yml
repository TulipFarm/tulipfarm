name: tulipfarm

# Dev-only override (INST-007 / AC-006): expose the bundled Postgres to a natively
# running `pnpm dev`. The production compose keeps Postgres internal-only; this host
# port appears only when you explicitly pass `-f docker-compose.dev.yml`.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres
# then point the dev app's .env.local at it:
#   DATABASE_URL=postgresql://tulipfarm:<POSTGRES_PASSWORD>@localhost:5432/tulipfarm
services:
  postgres:
    ports:
      - "5432:5432"
