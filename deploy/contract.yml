# The TulipFarm runtime contract.
#
# What TulipFarm needs in order to run, stated once and independently of any platform. Everything
# here is true on a VM, on Kubernetes, on Container Apps, and on a platform nobody has tried yet.
# How one platform satisfies it belongs in a target manifest, never here — a fact stated per-target
# must be restated per-target forever.
#
# Zones answer the only question a reader arrives with: am I allowed to change this.
#   set-these       normal configuration; change it to suit the deployment
#   installer-sets  overridable, but a wrong value gives a broken or non-standard install
#   never-set       internal plumbing; setting it by hand breaks things
#
# `consumers` records which process actually reads the value. `compose` and `installer` are
# load-bearing: those never reach the application, so setting one and expecting the app to honour
# it is already a mistake.

version: 1

services:
  - name: app
    role: API, built web UI, and database migrations
    port: 8080
    health:
      path: /readyz
      expect: 200
  - name: worker
    role: Run dispatch, waits, outbox delivery, cron, and maintenance consumers
    port: 4020
    health:
      path: /livez
      expect: 200
  - name: integration-worker
    role: Slack and GitHub ingress, sync, delivery, retries, and reconciliation
    port: 4030
    health:
      path: /livez
      expect: 200

dependencies:
  - id: postgres
    required: true
    detail: PostgreSQL 17 with pgvector. The correctness core — transactions, leases, inbox/outbox
      and recovery all depend on it, so it is not replaceable.
    drivers:
      - postgres
  - id: blob
    required: true
    detail: Object storage for every File's bytes, uploaded by people and generated by agents.
    drivers:
      - filesystem
      - s3
      - azure

state:
  - path: TF_DATA_DIR
    holds: Generated secrets.env, worker.env, integration-worker.env, and bucket.env
    durability: Must survive restart and upgrade
    consequence: It holds the key that decrypts every Secret this instance stores. Losing it means
      losing them, because the database holds only ciphertext. Booting a fresh ENCRYPTION_KEY
      against a populated database refuses to start rather than silently orphaning them.
  - path: SOUL_PATH
    holds: The live soul git checkout — Resource schemas, Agents, Skills, Routines, Integrations
    durability: Must survive restart and upgrade
    consequence: Losing it loses everything the business built, and its git history is the audit
      trail for who changed what.
  - path: postgres data directory
    holds: Every Record, Run, Turn, audit event, and vector index
    durability: Must survive restart and upgrade
    consequence: Losing it loses all business data. Restoring it without TF_DATA_DIR leaves every
      stored Secret undecryptable.

env:
  # ---------------------------------------------------------------- required boot configuration
  - name: DATABASE_URL
    group: Required boot configuration
    zone: set-these
    consumers: [app, worker, integration-worker]
    required: true
    description: PostgreSQL connection string. Must start with postgres:// or postgresql://.
    consequence: Without it the process cannot start. Pointed at the wrong database, migrations
      run against data that was never TulipFarm's.
  - name: ENCRYPTION_KEY
    group: Required boot configuration
    zone: set-these
    consumers: [app, worker, integration-worker]
    required: Yes outside managed data-dir boot
    secret: true
    generate: openssl rand -base64 32
    description: 32-byte base64 key-encryption key for every stored Secret.
    consequence: A fresh key against a database that already holds encrypted Secrets refuses to
      boot, by design, rather than orphaning them.
  - name: JWT_SECRET
    group: Required boot configuration
    zone: set-these
    consumers: [app]
    required: Yes outside managed data-dir boot
    secret: true
    generate: openssl rand -base64 32
    description: 32-byte base64 signing secret for auth and session surfaces.
    consequence: Changing it invalidates every existing session.
  - name: WEBHOOK_SIGNING_SECRET
    group: Required boot configuration
    zone: set-these
    consumers: [app, integration-worker]
    required: Yes outside managed data-dir boot
    secret: true
    generate: openssl rand -base64 32
    description: 32-byte base64 secret for webhook signature verification.
    consequence: Changing it makes every already-registered provider webhook fail verification.
  - name: SOUL_PATH
    group: Required boot configuration
    zone: set-these
    consumers: [app, worker, integration-worker]
    required: Yes, unless SOUL_ROOT is set
    description: Absolute path to the live soul git checkout.
    consequence: Mutually exclusive with SOUL_ROOT. Setting neither leaves the instance with no
      configuration to load.
  - name: SOUL_ROOT
    group: Required boot configuration
    zone: set-these
    consumers: [app, worker, integration-worker]
    required: Yes, unless SOUL_PATH is set
    description: Root for per-business soul checkouts, resolved as <root>/<businessId>/soul.
    consequence: Mutually exclusive with SOUL_PATH.

  # -------------------------------------------------------------------------- networking and URLs
  - name: PORT
    group: Networking and URLs
    zone: set-these
    consumers: [app]
    default: "4010 from source, 8080 in the production image"
    description: API listen port.
    consequence: Changing it without changing the platform's port mapping makes the instance
      unreachable while appearing healthy internally.
  - name: PUBLIC_URL
    group: Networking and URLs
    zone: set-these
    consumers: [app]
    default: http://localhost:4000
    description: Public origin users reach. Drives CORS fallback, cookie secure behaviour, and
      channel-link URLs.
    consequence: Wrong here and generated links point somewhere users cannot reach. An address
      saved under Business then About overrides it unless PUBLIC_ORIGINS_LOCKED is true.
  - name: PUBLIC_API_URL
    group: Networking and URLs
    zone: set-these
    consumers: [app]
    default: PUBLIC_URL in Docker Compose, otherwise http://localhost:${PORT}
    description: Public API origin used for Integration OAuth callbacks and webhooks.
    consequence: Set it separately only when the API has a different public origin; otherwise
      OAuth callbacks return to an origin the provider cannot reach.
  - name: PUBLIC_ORIGINS_LOCKED
    group: Networking and URLs
    zone: set-these
    consumers: [app]
    default: "false"
    description: Set true to make the environment origins authoritative and disable changes from
      Business then About.
    consequence: Left false, an in-app value silently overrides the environment, so the deployed
      configuration is not the effective one.
  - name: CORS_ORIGIN
    group: Networking and URLs
    zone: set-these
    consumers: [app]
    default: PUBLIC_URL, then http://localhost:${VITE_PORT}
    description: Browser origin allowed to call the API with credentials.
    consequence: Wrong here and the browser silently blocks every authenticated call, which
      presents as an app that loads but does nothing.
  - name: VITE_PORT
    group: Networking and URLs
    zone: set-these
    consumers: [web, app]
    default: "4000"
    description: Web dev-server port, and the API's CORS fallback.
    consequence: Development only; changing it without CORS_ORIGIN breaks local authenticated calls.
  - name: VITE_API_URL
    group: Networking and URLs
    zone: set-these
    consumers: [web]
    default: http://localhost:4010
    description: Browser API base URL for the web app, read at build time.
    consequence: Baked into the built client, so changing it requires a rebuild, not a restart.
  - name: VITE_API_TOKEN
    group: Networking and URLs
    zone: set-these
    consumers: [web]
    secret: true
    description: Optional bearer token the web dev client adds to API calls.
    consequence: Development convenience only. Setting it in a built image ships a credential to
      every browser that loads the app.
  - name: WEB_DIST
    group: Networking and URLs
    zone: installer-sets
    consumers: [app]
    description: Directory of built web assets for the API to serve in combined image mode.
    consequence: Wrong here and the API serves no UI while still answering on its API routes.
  - name: INTERNAL_API_URL
    group: Networking and URLs
    zone: installer-sets
    consumers: [worker, integration-worker]
    required: Yes for worker processes
    description: Base URL workers use for service-only internal API calls.
    consequence: Without it workers cannot reach the API, so Runs are claimed and never progress.

  # ------------------------------------------------------------------------------ headless seeding
  - name: ADMIN_EMAIL
    group: Headless seeding
    zone: set-these
    consumers: [app]
    description: Email for the first admin account during headless boot.
    consequence: Set with ADMIN_PASSWORD it skips the browser setup wizard. In production, setting
      both without LLM_API_KEY refuses to boot.
  - name: ADMIN_PASSWORD
    group: Headless seeding
    zone: set-these
    consumers: [app]
    secret: true
    description: Password for the first admin account during headless boot.
    consequence: Read once at first boot. Leaving it in the environment afterwards leaves an admin
      credential in plaintext where every process can read it.
  - name: LLM_API_KEY
    group: Headless seeding
    zone: set-these
    consumers: [app]
    required: Required with admin credentials in production
    secret: true
    description: Seeded into the selected provider Secret during headless boot.
    consequence: Without it a headless production boot refuses to start rather than creating an
      instance whose agents cannot think.
  - name: LLM_PROVIDER
    group: Headless seeding
    zone: set-these
    consumers: [app]
    default: anthropic
    description: Headless provider for LLM_API_KEY. openai is the other accepted value.
    consequence: Subscription providers cannot be seeded headlessly, so naming one silently leaves
      the instance without a usable model.
  - name: BUSINESS_NAME
    group: Headless seeding
    zone: set-these
    consumers: [app]
    description: Written to soul business metadata during headless boot.
    consequence: Read only at first boot; later changes belong in the product, not the environment.
  - name: BUSINESS_DESCRIPTION
    group: Headless seeding
    zone: set-these
    consumers: [app]
    default: Empty string when BUSINESS_NAME is set
    description: Written to soul business metadata during headless boot.
    consequence: Read only at first boot.
  - name: NODE_ENV
    group: Headless seeding
    zone: installer-sets
    consumers: [app, worker, integration-worker]
    default: Depends on the process manager
    description: Enables production-only headless validation and non-development route behaviour.
    consequence: Left unset in production, development-only routes and looser validation stay
      reachable.

  # -------------------------------------------------------------------------------- soul and git
  - name: SOUL_GIT_REMOTE_URL
    group: Soul and git
    zone: set-these
    consumers: [app]
    default: Persisted soul git config, if present
    description: Remote URL cloned on first boot or synced later.
    consequence: Changing it on a running instance repoints the audit trail at a different history.
  - name: SOUL_GIT_CREDENTIAL
    group: Soul and git
    zone: set-these
    consumers: [app]
    secret: true
    description: Credential used for soul remote sync.
    consequence: Without it a private remote fails to sync, and the instance runs on its local
      checkout with no off-box copy of the configuration.
  - name: BOT_GIT_NAME
    group: Soul and git
    zone: set-these
    consumers: [app]
    default: tulipfarm-bot
    description: Git author name for soul commits.
    consequence: Cosmetic, but it is what appears in the audit trail for every agent-authored change.
  - name: BOT_GIT_EMAIL
    group: Soul and git
    zone: set-these
    consumers: [app]
    default: tulipfarmhq@gmail.com
    description: Git author email for soul commits.
    consequence: Cosmetic, but it is what appears in the audit trail for every agent-authored change.
  - name: GIT_TERMINAL_PROMPT
    group: Soul and git
    zone: never-set
    consumers: [app]
    default: Forced to 0
    description: Disables interactive git credential prompts.
    consequence: Allowing a prompt makes a failed sync hang forever instead of failing, because
      nothing is attached to answer it.
  - name: BUSINESS_ID
    group: Soul and git
    zone: installer-sets
    consumers: [app, worker, integration-worker]
    default: tulipfarm-local
    description: Deployment business id, used in constants and per-business soul paths.
    consequence: Changing it on an existing install orphans that install's soul checkout.
  - name: SOUL_BUNDLE_RETENTION_DAYS
    group: Soul and git
    zone: set-these
    consumers: [app]
    default: "30"
    description: How long an unreferenced published execution bundle is kept before the nightly
      sweep may delete it. The floor is 7.
    consequence: Bundles that are active, previously activated, pinned by a Run, cited by an audit
      event, or still publishing are never deleted at any age, so lowering this cannot break a
      live Run.

  # ------------------------------------------------------------ workers and service credentials
  - name: TF_DATA_DIR
    group: Workers and service credentials
    zone: installer-sets
    consumers: [app, worker, integration-worker]
    default: /data when that directory exists
    description: Stores generated secrets.env, worker.env, integration-worker.env, and bucket.env.
    consequence: This is the durable path that holds the encryption key. Pointing it at ephemeral
      storage loses every stored Secret on the next restart.
  - name: WORKER_API_CREDENTIAL
    group: Workers and service credentials
    zone: installer-sets
    consumers: [worker]
    required: Yes unless read from the data directory
    secret: true
    description: Service credential for the durable Run worker.
    consequence: Without it the worker cannot authenticate, so Runs are never executed and Chat
      Turns hang mid-stream.
  - name: INTEGRATION_WORKER_API_CREDENTIAL
    group: Workers and service credentials
    zone: installer-sets
    consumers: [integration-worker]
    required: Yes unless read from the data directory
    secret: true
    description: Service credential for the integration worker.
    consequence: Without it inbound provider events are accepted and never processed.
  - name: WORKER_PORT
    group: Workers and service credentials
    zone: set-these
    consumers: [worker]
    default: "4020"
    description: Worker health probe port.
    consequence: Health probes and the readiness gate have nowhere to answer.
  - name: WORKER_OWNER
    group: Workers and service credentials
    zone: never-set
    consumers: [worker]
    default: <hostname>:<pid>
    description: Lease owner recorded on claimed Runs.
    consequence: Two workers sharing an owner string can reclaim each other's live Runs.
  - name: WORKER_RUN_POLL_MS
    group: Workers and service credentials
    zone: set-these
    consumers: [worker]
    default: "1000"
    description: Durable Run dispatch poll interval.
    consequence: Raising it adds latency to every Chat Turn; lowering it adds database load.
  - name: WORKER_WAIT_SWEEP_MS
    group: Workers and service credentials
    zone: set-these
    consumers: [worker]
    default: "5000"
    description: Wait timer sweep interval.
    consequence: Raising it delays every timer-based Routine step.
  - name: WORKER_OUTBOX_POLL_MS
    group: Workers and service credentials
    zone: set-these
    consumers: [worker]
    default: "1000"
    description: Event outbox delivery poll interval.
    consequence: Raising it delays outbound delivery of every emitted event.
  - name: WORKER_BATCH_SIZE
    group: Workers and service credentials
    zone: set-these
    consumers: [worker]
    default: "25"
    description: Maximum Runs claimed per dispatch batch.
    consequence: Raising it increases throughput and the number of Runs lost to a single crash.
  - name: WORKER_LEASE_MS
    group: Workers and service credentials
    zone: set-these
    consumers: [worker]
    default: "60000"
    description: Run lease duration.
    consequence: Must exceed WORKER_RUN_POLL_MS or the worker refuses to start.
  - name: WORKER_RUN_MAX_LIFETIME_MS
    group: Workers and service credentials
    zone: set-these
    consumers: [worker]
    default: "900000"
    description: Longest a single Run keeps renewing its lease before the worker abandons it for
      reclaim.
    consequence: Must exceed WORKER_LEASE_MS or the worker refuses to start.
  - name: WORKER_DRAIN_TIMEOUT_MS
    group: Workers and service credentials
    zone: set-these
    consumers: [worker]
    default: "15000"
    description: Worker shutdown drain budget.
    consequence: Set below the platform's termination grace period, or in-flight Runs are killed
      rather than drained.
  - name: WORKER_MAINTENANCE
    group: Workers and service credentials
    zone: installer-sets
    consumers: [worker]
    default: "false"
    description: Enables singleton maintenance consumers on one worker replica.
    consequence: Enabling it on more than one replica runs singleton work concurrently.
  - name: INTEGRATION_WORKER_PORT
    group: Workers and service credentials
    zone: set-these
    consumers: [integration-worker]
    default: "4030"
    description: Integration-worker health probe port.
    consequence: A port collision presents as a worker that will not start.
  - name: INTEGRATION_WORKER_DRAIN_TIMEOUT_MS
    group: Workers and service credentials
    zone: set-these
    consumers: [integration-worker]
    default: "15000"
    description: Integration-worker shutdown drain budget.
    consequence: Set below the platform's termination grace period, or in-flight delivery is killed.

  # ------------------------------------------------------------------- sessions, Secrets, limits
  - name: SESSION_TTL_SECONDS
    group: Sessions, Secrets, and limits
    zone: set-these
    consumers: [app]
    default: "604800"
    description: Session cookie lifetime in seconds.
    consequence: Lowering it signs people out sooner; raising it widens the window a stolen cookie
      stays usable.
  - name: ENCRYPTION_KEY_PREVIOUS
    group: Sessions, Secrets, and limits
    zone: set-these
    consumers: [app]
    secret: true
    description: Previous 32-byte base64 key, read during key rotation.
    consequence: Removing it before rotation completes leaves anything still encrypted under the
      old key undecryptable.
  - name: API_TOKEN_PEPPER
    group: Sessions, Secrets, and limits
    zone: set-these
    consumers: [app]
    secret: true
    generate: openssl rand -base64 32
    description: 32-byte base64 HMAC key for hashing personal API tokens.
    consequence: Changing it invalidates every existing personal API token at once.
  - name: RECOVERY_KEY
    group: Sessions, Secrets, and limits
    zone: set-these
    consumers: [app]
    secret: true
    description: Offline recovery key, consumed by the key recovery command.
    consequence: Command-line use only. Leaving it in a running process's environment defeats the
      point of an offline key.
  - name: HOOKS_DISABLED
    group: Sessions, Secrets, and limits
    zone: never-set
    consumers: [app]
    description: Set true to skip Resource hook execution.
    consequence: Disables every side effect Records are supposed to trigger. A debugging switch,
      not configuration.
  - name: AUTHZ_MODE
    group: Sessions, Secrets, and limits
    zone: set-these
    consumers: [app]
    default: enforcing
    description: Set to the exact value shadow to rehearse an authorization change — the engine
      still evaluates, but every route falls back to its declared admin or member check.
    consequence: Shadow mode can refuse nobody, so leaving it on means a policy that looks applied
      is not. Every disagreement is logged as authz.divergence; run in shadow until that log is
      quiet, then unset it.
  - name: AUTHZ_MODEL_GATE
    group: Sessions, Secrets, and limits
    zone: set-these
    consumers: [app]
    default: shadow
    description: Set to the exact value enforcing to make model-access decisions refuse rather than
      only report.
    consequence: Defaults to shadow so an upgrade cannot lock a deployment out of its own models.
      Enforcing it before the divergence log is quiet denies real callers.

  # ------------------------------------------------------------------------------ file storage
  - name: BLOB_STORE
    group: File storage
    zone: set-these
    consumers: [app, worker]
    default: Inferred from S3_BUCKET or the Azure variables
    description: filesystem, s3 or azure. Exists only to force the choice; naming a bucket, or an
      Azure account or connection string, already selects the driver.
    consequence: Setting a driver without its credentials refuses to boot rather than silently
      storing files on a disk that vanishes.
  - name: S3_BUCKET
    group: File storage
    zone: set-these
    consumers: [app, worker]
    required: S3 only
    description: Bucket that holds every File's bytes.
    consequence: Naming it selects the S3 driver, so a typo here silently changes which driver runs.
  - name: S3_REGION
    group: File storage
    zone: set-these
    consumers: [app, worker]
    default: us-east-1
    description: Signing region. Every S3-compatible provider signs with one, even single-region
      ones.
    consequence: A wrong region fails at request-signing time, which reads as an auth error rather
      than a configuration one.
  - name: S3_ENDPOINT
    group: File storage
    zone: set-these
    consumers: [app, worker]
    default: Amazon's own host
    description: Provider endpoint. Omit it for Amazon S3 itself.
    consequence: Setting it also turns on path-style addressing by default, because a custom
      endpoint is usually MinIO, Ceph, or a host reached by IP.
  - name: S3_ACCESS_KEY_ID
    group: File storage
    zone: set-these
    consumers: [app, worker]
    required: S3 only
    secret: true
    description: Access key for the bucket.
    consequence: Provisioned automatically when the bundled bucket service is on.
  - name: S3_SECRET_ACCESS_KEY
    group: File storage
    zone: set-these
    consumers: [app, worker]
    required: S3 only
    secret: true
    description: Secret key for the bucket.
    consequence: Provisioned automatically when the bundled bucket service is on.
  - name: S3_FORCE_PATH_STYLE
    group: File storage
    zone: set-these
    consumers: [app, worker]
    default: On whenever S3_ENDPOINT is set
    description: Use path-style bucket addressing.
    consequence: MinIO, Ceph, and any host reached by IP cannot serve virtual-hosted bucket names.
  - name: S3_PREFIX
    group: File storage
    zone: set-these
    consumers: [app, worker]
    description: Key prefix, for sharing one bucket with something else.
    consequence: Changing it on a populated bucket hides every File already stored under the old
      prefix.
  - name: AZURE_STORAGE_CONTAINER
    group: File storage
    zone: set-these
    consumers: [app, worker]
    required: Azure only
    description: Blob container that holds every File's bytes.
    consequence: Naming it, with a credential, selects the Azure driver; a typo silently changes
      which container the instance reads and writes.
  - name: AZURE_STORAGE_CONNECTION_STRING
    group: File storage
    zone: set-these
    consumers: [app, worker]
    required: Azure, unless AZURE_STORAGE_ACCOUNT and AZURE_STORAGE_KEY are set
    secret: true
    description: Full Azure Storage connection string. The one credential shape that also carries a
      sovereign-cloud or Azurite endpoint.
    consequence: Naming it selects the Azure driver. Present, it wins over account-and-key.
  - name: AZURE_STORAGE_ACCOUNT
    group: File storage
    zone: set-these
    consumers: [app, worker]
    required: Azure, unless AZURE_STORAGE_CONNECTION_STRING is set
    description: Storage account name, paired with AZURE_STORAGE_KEY, for the public Azure cloud.
    consequence: Naming it selects the Azure driver. Without AZURE_STORAGE_KEY the instance refuses
      to boot rather than starting without a usable credential.
  - name: AZURE_STORAGE_KEY
    group: File storage
    zone: set-these
    consumers: [app, worker]
    required: Azure, unless AZURE_STORAGE_CONNECTION_STRING is set
    secret: true
    description: Account key for AZURE_STORAGE_ACCOUNT.
    consequence: The shared key that authorises every read, write and same-account copy; wrong here
      reads as an auth error at boot, not a configuration one.
  - name: BUCKET_ADMIN_URL
    group: File storage
    zone: installer-sets
    consumers: [app]
    default: http://bucket:3903 in Compose
    description: Admin API of the bundled bucket service. The API provisions the bucket and its
      access key there on first boot.
    consequence: Set it empty to use an external provider instead; left pointing at a bundled
      service that is not running, first boot fails to provision storage.

  # ---------------------------------------------------------- database and knowledge tuning
  - name: DATABASE_URL_MIGRATIONS
    group: Database and knowledge tuning
    zone: set-these
    consumers: [app]
    secret: true
    description: Separate connection string used only to run migrations, for deployments where the
      runtime role cannot alter schema.
    consequence: Unset, migrations run as the runtime role, which then needs schema privileges it
      otherwise would not.
  - name: PG_POOL_MAX
    group: Database and knowledge tuning
    zone: set-these
    consumers: [app, worker, integration-worker]
    description: Maximum PostgreSQL pool connections per process.
    consequence: Every replica opens its own pool, so the effective total is this times the replica
      count, against the server's own connection limit.
  - name: PG_CONNECTION_TIMEOUT_MS
    group: Database and knowledge tuning
    zone: set-these
    consumers: [app, worker, integration-worker]
    description: How long to wait for a pool connection before failing.
    consequence: Raising it turns pool exhaustion into slow requests rather than fast errors.
  - name: PG_STATEMENT_TIMEOUT_MS
    group: Database and knowledge tuning
    zone: set-these
    consumers: [app, worker, integration-worker]
    description: Server-side statement timeout.
    consequence: Set too low, long migrations and large retrieval queries are cancelled mid-flight.
  - name: PG_IDLE_TIMEOUT_MS
    group: Database and knowledge tuning
    zone: set-these
    consumers: [app, worker, integration-worker]
    description: How long an idle pool connection is kept before it is closed.
    consequence: Set too high, idle connections hold server slots; too low, every burst pays to
      reopen them.
  - name: PG_IDLE_IN_TRANSACTION_TIMEOUT_MS
    group: Database and knowledge tuning
    zone: set-these
    consumers: [app, worker, integration-worker]
    description: Server-side timeout for a session left idle inside an open transaction. 0 disables
      it, keeping the server default.
    consequence: A transaction left open holds its locks; without this a stuck client can block
      others indefinitely.
  - name: KNOWLEDGE_TRGM_FALLBACK
    group: Database and knowledge tuning
    zone: set-these
    consumers: [app]
    default: "on"
    description: Enables pg_trgm typo tolerance for lexical page search unless set to 0 or false.
    consequence: Disabling it makes misspelled searches return nothing rather than near matches.
  - name: KNOWLEDGE_RERANK
    group: Database and knowledge tuning
    zone: never-set
    consumers: [app]
    description: Opts into the wired rerank seam.
    consequence: The enabled stage is an honest not-implemented stub, so turning it on changes
      nothing today.
  - name: KNOWLEDGE_GRAPHRAG
    group: Database and knowledge tuning
    zone: never-set
    consumers: [app]
    description: Graph-augmented retrieval switch.
    consequence: Internal retrieval tuning; changing it alters what agents cite without any
      product-level control.
  - name: KNOWLEDGE_GRAPH_EXPAND
    group: Database and knowledge tuning
    zone: never-set
    consumers: [app]
    description: Graph expansion switch for retrieval candidates.
    consequence: Internal retrieval tuning; widening candidates costs latency on every retrieval.
  - name: KNOWLEDGE_AUTHORED_PAGES_IN_RETRIEVAL
    group: Database and knowledge tuning
    zone: never-set
    consumers: [app]
    description: Whether authored pages join retrieval candidates.
    consequence: Internal retrieval tuning; changing it alters what agents cite.

  # ---------------------------------------------------- Skills, sandbox, and install sources
  - name: MARKETPLACE_SOURCE
    group: Skills, sandbox, and install sources
    zone: set-these
    consumers: [app]
    default: tulipfarm/skills
    description: Skills marketplace source repository.
    consequence: Pointing it elsewhere installs Skills nobody on this project reviewed.
  - name: BUNDLED_SKILLS_DIR
    group: Skills, sandbox, and install sources
    zone: never-set
    consumers: [app]
    default: The image or repo bundled skills directory
    description: Overrides where bundled Skills are read from.
    consequence: Development override. Wrong here and the instance ships with no Skills.
  - name: BUNDLED_INTEGRATIONS_DIR
    group: Skills, sandbox, and install sources
    zone: never-set
    consumers: [app]
    default: The image or repo bundled integrations directory
    description: Overrides where bundled Integrations are read from.
    consequence: Development override. Wrong here and no Integration is installable.
  - name: SANDBOX_RUNTIME_IMAGE
    group: Skills, sandbox, and install sources
    zone: never-set
    consumers: [app]
    description: Exact repository@sha256 image used for published Skill shell, TypeScript, and
      Python Tools.
    consequence: Development only. Ignored as an execution backend in production, so setting it
      there gives false confidence that sandboxing changed.
  - name: SANDBOX_RUNTIME_IMAGE_DIGEST
    group: Skills, sandbox, and install sources
    zone: never-set
    consumers: [app]
    description: Pinned digest for the sandbox runtime image.
    consequence: Development only, and meaningless without SANDBOX_RUNTIME_IMAGE.
  - name: GIT_SOURCE_ALLOWED_HOSTS
    group: Skills, sandbox, and install sources
    zone: set-these
    consumers: [app]
    description: Exact hosts a Skill or Integration may be installed from.
    consequence: Widening it widens what code this instance will fetch and run.
  - name: GIT_SOURCE_ALLOW_LOCAL_PATHS
    group: Skills, sandbox, and install sources
    zone: never-set
    consumers: [app]
    description: Permits installing from local filesystem paths.
    consequence: Development only. Enabling it in production lets a local path become an install
      source.
  - name: TULIPFARM_VERSION
    group: Skills, sandbox, and install sources
    zone: installer-sets
    consumers: [app, compose]
    default: dev
    description: Version reported by the update-check endpoint, and the image tag Compose pulls.
    consequence: In Compose this selects which image runs, so it is not cosmetic there.

  # ------------------------------------------------------- consumed by Compose, not by the app
  - name: POSTGRES_PASSWORD
    group: Compose-consumed values
    zone: set-these
    consumers: [compose]
    required: Bundled PostgreSQL only
    secret: true
    default: tulipfarm
    description: Password for the bundled PostgreSQL container, and for the DATABASE_URL generated
      from it.
    consequence: The shipped default is a well-known value. Anything reachable beyond localhost
      must change it.
  - name: HOST_PORT
    group: Compose-consumed values
    zone: set-these
    consumers: [compose]
    default: "8080"
    description: Host port published by the Compose stack.
    consequence: Two instances on one machine must not share it.
  - name: HOST_BIND
    group: Compose-consumed values
    zone: set-these
    consumers: [compose]
    default: 0.0.0.0
    description: Host interface Compose binds for the app port.
    consequence: The default publishes on every interface. Set 127.0.0.1 when a reverse proxy
      terminates in front.
  - name: COMPOSE_PROJECT_NAME
    group: Compose-consumed values
    zone: installer-sets
    consumers: [compose]
    default: tulipfarm
    description: Namespaces every container and volume.
    consequence: Renaming it on an existing install orphans that install's database and soul repo.
  - name: EXTERNAL_DATASTORE
    group: Compose-consumed values
    zone: set-these
    consumers: [compose, installer]
    default: "false"
    description: Records that DATABASE_URL points at managed PostgreSQL rather than the bundled
      container.
    consequence: Left false with an external DATABASE_URL, Compose still starts a database nobody
      uses.

  # ----------------------------------------------------- consumed by the installer, not the app
  - name: TF_VERSION
    group: Installer-consumed values
    zone: set-these
    consumers: [installer]
    default: latest
    description: Pins the image tag to install, and writes it as TULIPFARM_VERSION.
    consequence: latest moves under you on every re-run; pin it for anything reproducible.
  - name: TF_PORT
    group: Installer-consumed values
    zone: set-these
    consumers: [installer]
    default: "8080"
    description: The port published on the host. A re-run updates the saved port.
    consequence: Two installs on one machine must each have their own.
  - name: TF_INSTALL_DIR
    group: Installer-consumed values
    zone: set-these
    consumers: [installer]
    default: /opt/tulipfarm
    description: Where the stack and its .env are written.
    consequence: Moving it after install leaves the original stack running from the old path.
  - name: TF_PROJECT_NAME
    group: Installer-consumed values
    zone: set-these
    consumers: [installer]
    default: tulipfarm
    description: The Compose project name, which prefixes containers and volumes.
    consequence: Two installs on one machine must each have their own, or the second collides with
      the first.
  - name: TF_RUNTIME
    group: Installer-consumed values
    zone: set-these
    consumers: [installer]
    default: Auto-detected
    description: Forces docker or podman instead of detecting one.
    consequence: Forcing a runtime that is not installed fails the install outright.
  - name: TF_BASE_URL
    group: Installer-consumed values
    zone: installer-sets
    consumers: [installer]
    default: The public TulipFarm download host
    description: Where the installer fetches the Compose file and example environment file from.
    consequence: Pointing it elsewhere means installing software that is not TulipFarm.
  - name: TF_REF
    group: Installer-consumed values
    zone: installer-sets
    consumers: [installer]
    description: Fetches those files from a specific ref instead of the release path.
    consequence: For testing an unreleased change. Mismatched files fail in confusing ways.
  - name: TF_LOCAL_SRC
    group: Installer-consumed values
    zone: installer-sets
    consumers: [installer]
    description: Copies installer inputs from a local checkout instead of downloading.
    consequence: For developing the installer itself.
  - name: TF_TTY_INPUT
    group: Installer-consumed values
    zone: never-set
    consumers: [installer]
    default: /dev/tty
    description: Where the uninstall script reads a typed confirmation from.
    consequence: Point it at anything that is not a terminal and uninstall fails, because it can no
      longer ask the question it must ask before destroying data.
  - name: TF_TTY_OUTPUT
    group: Installer-consumed values
    zone: never-set
    consumers: [installer]
    default: /dev/tty
    description: Where the uninstall script writes its confirmation prompt.
    consequence: Same failure as TF_TTY_INPUT — uninstall refuses rather than destroying data
      unasked.
