# Generated from deploy/contract.yml by @tulipfarm/deploy-render. Edit the contract, not this
# file. TulipFarm ships no official chart yet: these are the machine-generated configuration
# values — every key grounded in the runtime contract — to feed the chart you supply.

image:
  repository: ghcr.io/tulipfarm/tulipfarm
  # Pin a tag in a cluster; never track a moving tag.
  tag: "latest"
  pullPolicy: IfNotPresent

# One replica each — TulipFarm does not scale horizontally, so use strategy: Recreate.
workloads:
  app:
    replicas: 1
    port: 8080
    role: "API, built web UI, and database migrations"
    healthProbe:
      path: "/readyz"
      expect: 200
  worker:
    replicas: 1
    port: 4020
    role: "Run dispatch, waits, outbox delivery, cron, and maintenance consumers"
    healthProbe:
      path: "/livez"
      expect: 200
  integration-worker:
    replicas: 1
    port: 4030
    role: "Slack and GitHub ingress, sync, delivery, retries, and reconciliation"
    healthProbe:
      path: "/livez"
      expect: 200

dependencies:
  postgres:
    # A cluster rarely wants a bundled database. Point DATABASE_URL at managed PostgreSQL 17
    # (pgvector + citext) and supply it from a Secret; see secretRefs below.
    external: true
  blob:
    # One of: filesystem, s3, azure. A cluster has no durable local disk, so filesystem suits
    # only a single-node test; use s3 or azure for anything real.
    driver: "s3"

# Durable state that must survive restart and upgrade. The contract names these symbolically
# (by the variable that points at them); the chart maps each to a PersistentVolumeClaim.
persistence:
  - path: "TF_DATA_DIR"
    holds: "Generated secrets.env, worker.env, integration-worker.env, and bucket.env"
  - path: "SOUL_PATH"
    holds: "The live soul git checkout, including Resource schemas, Agents, Skills, Routines, Integrations"
  - path: "postgres data directory"
    holds: "Every Record, Run, Turn, audit event, and vector index"

