name: google-docs
version: "1.1.0"
description: Let TulipFarm agents read Google Docs — and index them into Knowledge with
  Drive-backed per-user ACL fidelity — using one OAuth token.
maintainer: TulipFarm
icon: googledocs
capabilities:
  - Read a document's title and body content
  - Index documents into Knowledge with Drive-backed per-user ACL fidelity
grants:
  - label: documents
    access: read
    description: Read the title and body of documents the token's scopes cover.

# Read-only by design: the declared scope below is read, so Docs' batchUpdate is deliberately not
# published — a write Tool against a read token would report edits that never happened.
egress:
  type: openapi
  spec: openapi.json
  base_url: https://docs.googleapis.com/v1
  auth:
    token_env: GOOGLE_DOCS_ACCESS_TOKEN
  operations:
    - operation: getDocument
      name: read_document
      description: Read a document's title and body by id. The id is the long segment in a
        /document/d/<id>/edit URL. If you only know the document by name, search Drive first.

auth:
  # `auth` fully supersedes `required_env` (see resolveAuthSteps), so the Knowledge-sync workspace
  # id is re-declared here. Dropping it would silently stop indexing Docs into Knowledge.
  - kind: fields
    title: Connect Google Docs
    description: One OAuth token serves both the agent Tool and Knowledge indexing.
    fields:
      - name: GOOGLE_WORKSPACE_ID
        label: Google Workspace ID
        description: Workspace/customer identifier used for sync checkpoints. Needed only if you
          want documents indexed into Knowledge; the agent Tool works without it.
        secret: false
      - name: GOOGLE_DOCS_ACCESS_TOKEN
        label: Google Docs OAuth Access Token
        description: OAuth bearer token with Docs export plus Drive metadata and permissions scopes.
        secret: true
        setup_url: https://console.cloud.google.com/apis/credentials
        steps:
          - In Google Cloud Console, open the project serving this deployment and enable both the
            Google Docs API and the Google Drive API.
          - Create an OAuth client (or a service account with domain-wide delegation for a whole
            workspace) and grant the documents.readonly and drive.metadata.readonly scopes. Docs
            has no ACL API of its own, so Knowledge reads per-document access from Drive.
          - Copy a current access token and paste it below.

setup_guide_path: setup-guide.md
