version: 1
cases:
  - name: reads-page-blocks
    operationId: get-block-children
    request:
      block_id: page-redacted
      page_size: 2
    response:
      status: 200
      body:
        object: list
        results:
          - object: block
            id: block-redacted
            type: paragraph
            has_children: false
            paragraph:
              rich_text:
                - type: text
                  text: { content: Launch checklist }
        next_cursor: null
        has_more: false
    expect:
      request:
        method: GET
        url: https://api.notion.com/v1/blocks/page-redacted/children?page_size=2
      result:
        results:
          - id: block-redacted
            type: paragraph
            has_children: false

  - name: creates-page
    operationId: create-page
    request:
      body:
        parent:
          page_id: parent-redacted
        properties:
          title:
            title:
              - type: text
                text: { content: Launch checklist }
    response:
      status: 200
      body:
        object: page
        id: page-redacted
        created_time: "2026-09-07T06:00:00.000Z"
        last_edited_time: "2026-09-07T06:00:00.000Z"
        url: https://www.notion.so/page-redacted
        properties: {}
    expect:
      request:
        method: POST
        url: https://api.notion.com/v1/pages
        body:
          parent:
            page_id: parent-redacted
          properties:
            title:
              title:
                - type: text
                  text: { content: Launch checklist }
      result:
        id: page-redacted
        object: page

  - name: rejects-invalid-credential
    operationId: get-block-children
    request:
      block_id: page-redacted
      page_size: 1
    response:
      status: 401
      body:
        object: error
        status: 401
        code: unauthorized
        message: API token is invalid.
    expect:
      request:
        method: GET
        url: https://api.notion.com/v1/blocks/page-redacted/children?page_size=1
      expectedError:
        phase: before_dispatch
        code: provider_unauthorized
        retryable: false
