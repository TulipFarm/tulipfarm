name: notion
version: "1.1.0"
description: Let TulipFarm agents search your Notion workspace, read and write pages, and query
  databases — and optionally index shared pages into Knowledge — using one internal integration
  token you create in Notion.
maintainer: TulipFarm
icon: notion
capabilities:
  - Search pages and databases across the workspace
  - Read page properties and body content
  - Create pages and append content to existing ones
  - Query database rows and read database schemas
  - Index shared pages into Knowledge when per-user ACLs are verifiable
# Notion has no scope system: an internal integration can do anything the API allows, on exactly
# the pages you share with it. So access is described in those terms rather than as fake scopes.
grants:
  - label: shared pages
    access: write
    description: Read and edit any page or database you explicitly share with the integration.
      Nothing else in the workspace is reachable.
  - label: workspace search
    access: read
    description: Search titles of the pages and databases shared with the integration.

# Fully declarative — the generic OpenAPI runtime executes these, so this integration ships no
# TypeScript. Adding an operation is adding an entry here plus a path in openapi.json.
egress:
  type: openapi
  spec: openapi.json
  base_url: https://api.notion.com/v1
  auth:
    # Shared with the Knowledge sync below rather than a second credential: both are the same
    # Notion internal integration, and issuing two tokens would mean two things to rotate.
    token_env: NOTION_ACCESS_TOKEN
  headers:
    # Notion rejects any request without this. Pinned rather than tracking latest: Notion's
    # versions are breaking, so a silent bump would change response shapes under the agent.
    Notion-Version: "2022-06-28"
  # A deliberate subset, not the whole API. The model reads these descriptions to choose a tool,
  # so each says what it is for and what it needs, not just what it calls.
  operations:
    - operation: search
      name: search
      description: Search Notion for pages and databases by title. Use this first when you know a
        page by name but not by id — nearly every other Notion tool needs an id. Returns nothing
        for pages that have not been shared with the integration.
      # A read Notion models as a POST. Without this the method-derived default would gate every
      # search behind an operator approval.
      mutating: false
    - operation: retrievePage
      name: read_page
      description: Read a page's properties (title, status, dates, relations) by id. This does NOT
        return the page body — use read_page_content for that.
    - operation: listBlockChildren
      name: read_page_content
      description: Read the body content of a page as blocks. Pass the page id as block_id. Nested
        blocks are not expanded; call again with a child block's id to go deeper.
    - operation: createPage
      name: create_page
      description: Create a page, either inside another page or as a row in a database. When the
        parent is a database, call read_database_schema first — every property key must match a
        column in that database.
      mutating: true
    - operation: appendBlockChildren
      name: append_page_content
      description: Append content blocks to the end of a page. Pass the page id as block_id. Use
        this to add to a page; it cannot edit or remove existing content.
      mutating: true
    - operation: updatePage
      name: update_page
      description: Update a page's property values, or archive it by setting archived to true.
        Changes properties only — use append_page_content to add body content.
      mutating: true
    - operation: retrieveDatabase
      name: read_database_schema
      description: Read a database's columns and their types. Required before creating a row in it
        or filtering a query, because both are expressed in terms of this schema.
    - operation: queryDatabase
      name: query_database
      description: List rows in a database, optionally filtered and sorted. Prefer this over
        search when you want the contents of a known database rather than a title match.
      # Notion models this read as a POST; without this flag the default would gate a plain
      # listing behind an approval.
      mutating: false

auth:
  # An internal integration rather than OAuth. Notion's OAuth is for multi-workspace public
  # integrations and requires submitting one for review; a self-hosted TulipFarm serves a single
  # workspace, where an internal integration is Notion's own recommended path and needs no review.
  #
  # `auth` fully supersedes `required_env` (see resolveAuthSteps), so the Knowledge-sync variables
  # are declared here too — dropping them would leave k3-sync-schedule.ts with no workspace id and
  # silently stop indexing Notion into Knowledge, with nothing failing loudly.
  - kind: fields
    title: Create a Notion integration
    description: Notion issues a token from its integrations page. Creating the integration grants
      no access on its own — you choose what it can reach in the next step.
    fields:
      - name: NOTION_ACCESS_TOKEN
        label: Internal Integration Secret
        description: The token Notion issues for your integration (starts with ntn_ or secret_).
        secret: true
        setup_url: https://www.notion.so/my-integrations
        steps:
          - Open notion.so/my-integrations and click New integration. Name it TulipFarm, pick the
            workspace you want it to serve, and set its capabilities to Read, Update, and Insert
            content.
          - Open the integration you just created, go to the Configuration tab, and copy the
            Internal Integration Secret. Paste it below.
          - Access is per-page, so the integration sees nothing until you share with it. In Notion,
            open a page you want agents to work with, click the ••• menu → Connections → and pick
            TulipFarm. Sharing a page shares everything nested under it.
      - name: NOTION_WORKSPACE_ID
        label: Notion Workspace ID
        description: Workspace identifier used for Knowledge sync checkpoints. Needed only if you
          want Notion pages indexed into Knowledge; agent tools work without it.
        secret: false
      - name: NOTION_READER_PROPERTY
        label: Reader Property
        description: Optional People or email property naming who may read each page, used only by
          Knowledge sync. Notion's API cannot report effective page ACLs, so a page whose reader
          property cannot be read is excluded from Knowledge rather than exposed.
        secret: false

setup_guide_path: setup-guide.md
