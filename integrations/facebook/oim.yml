oimVersion: "1.0"
kind: Integration

metadata:
  id: facebook
  name: Facebook Pages
  version: 2.0.0
  description: List managed Facebook Pages and read or create posts on one authorized Page.
  license: Apache-2.0
  maintainers:
    - name: TulipFarm
      url: https://tulipfarm.dev

profiles:
  core: "1.1"
  auth: "1.1"

files:
  - path: fixtures.yml
    role: fixture
    sha256: "0629195d3e9b956deea9eeb30b720b387bd52c0ea6ae12d5b2d0cdd7e1f93079"
  - path: setup-guide.md
    role: guide
    sha256: "68c5090a4d888821ea8c6fcf775112e4e59fbda31b86578e8fdffcacdbcbb35e"

auth:
  allowedOriginHosts:
    - graph.facebook.com
  credentialSlots:
    - id: user_access_token
      label: Facebook User access token
      kind: oauth2_access_token
      required: true
    - id: page_access_token
      label: Facebook Page access token
      kind: oauth2_access_token
      required: true
  configurationFields:
    - id: page_id
      label: Facebook Page ID
      type: string
      required: true
      agentVisible: true
  steps:
    - id: tokens
      type: fields
      title: Add Facebook Login and Page tokens
      description: >-
        Paste a User token with pages_show_list and a Page token for the Page whose posts this
        Connection will read or create. The guide explains App Review, Tasks, and token exchange.
      fields:
        - id: user_access_token
          label: User access token
          input: password
          required: true
          target:
            type: credential
            slot: user_access_token
        - id: page_access_token
          label: Page access token
          input: password
          required: true
          target:
            type: credential
            slot: page_access_token
        - id: page_id
          label: Page ID
          description: The numeric ID of the Page authorized by the Page token.
          input: text
          required: true
          target:
            type: configuration
            field: page_id
  verification:
    issuer:
      source: package
      value: https://facebook.com
    checks:
      - id: authorized-pages
        operationId: list-pages
        credentialSlots: [user_access_token]
        success:
          - kind: present
            path: /data
      - id: current-page
        operationId: current-page
        credentialSlots: [page_access_token]
        success:
          - kind: present
            path: /id
          - kind: present
            path: /name
          - kind: present
            path: /category
    comparisons:
      - kind: equals
        left:
          source: response
          checkId: current-page
          path: /id
        right:
          source: configuration
          field: page_id
      - kind: array_contains
        array:
          source: response
          checkId: authorized-pages
          path: /data
        itemPath: /id
        value:
          source: configuration
          field: page_id
    evidence:
      assurance: identified
      subject:
        kind: account
        checkId: current-page
        path: /id
        namespace: issuer
      tenant:
        kind: account
        source: response
        checkId: current-page
        path: /id
  healthCheckOperationId: list-pages

operations:
  - id: list-pages
    name: facebook_list_pages
    description: List Facebook Pages the user token can manage, without returning Page access tokens.
    effect: read
    identityMode: shared_only
    credentialSlot: user_access_token
    credentialInjection:
      in: query
      name: access_token
      format: "{token}"
    source:
      type: http
      method: GET
      baseUrl: https://graph.facebook.com
      path: /v25.0/me/accounts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: fields
          in: query
          value: id,name,category,category_list,tasks
          schema: { type: string }
    pagination:
      type: cursor
      requestParameter: after
      responsePath: /paging/cursors/after
      itemsPath: /data
    response:
      maxBytes: 524288
      schema:
        type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                category: { type: string }
                category_list: { type: array }
                tasks:
                  type: array
                  items: { type: string }
              required: [id, name]
          paging:
            type: object
            properties:
              cursors:
                type: object
                properties:
                  before: { type: string }
                  after: { type: string }
        required: [data]
      projection:
        - /data

  - id: current-page
    name: facebook_current_page
    description: Confirm the selected credential resolves to a Facebook Page and return its ID.
    effect: read
    identityMode: shared_only
    credentialSlot: page_access_token
    credentialInjection:
      in: query
      name: access_token
      format: "{token}"
    source:
      type: http
      method: GET
      baseUrl: https://graph.facebook.com
      path: /v25.0/me
      parameters:
        - name: fields
          in: query
          value: id,name,category
          schema: { type: string }
    response:
      maxBytes: 131072
      schema:
        type: object
        properties:
          id: { type: string, minLength: 1 }
          name: { type: string, minLength: 1 }
          category: { type: string, minLength: 1 }
        required: [id, name, category]
      projection:
        - /id
        - /name
        - /category

  - id: list-page-posts
    name: facebook_list_page_posts
    description: List posts from one Facebook Page authorized by the Page token.
    effect: sensitive_read
    identityMode: shared_only
    credentialSlot: page_access_token
    credentialInjection:
      in: query
      name: access_token
      format: "{token}"
    source:
      type: http
      method: GET
      baseUrl: https://graph.facebook.com
      path: /v25.0/{page_id}/feed
      parameters:
        - name: page_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]+$"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: fields
          in: query
          value: id,message,created_time,permalink_url
          schema: { type: string }
    pagination:
      type: cursor
      requestParameter: after
      responsePath: /paging/cursors/after
      itemsPath: /data
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                message: { type: string }
                created_time: { type: string }
                permalink_url: { type: string }
              required: [id]
          paging:
            type: object
            properties:
              cursors:
                type: object
                properties:
                  before: { type: string }
                  after: { type: string }
        required: [data]
      projection:
        - /data

  - id: create-page-post
    name: facebook_create_page_post
    description: Create one immediate text or link post on a Facebook Page authorized by the Page token.
    effect: send
    identityMode: shared_only
    credentialSlot: page_access_token
    credentialInjection:
      in: query
      name: access_token
      format: "{token}"
    source:
      type: http
      method: POST
      baseUrl: https://graph.facebook.com
      path: /v25.0/{page_id}/feed
      parameters:
        - name: page_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]+$"
    requestSchema:
      type: object
      properties:
        message:
          type: string
          minLength: 1
        link:
          type: string
          pattern: "^https://"
      required: [message]
      additionalProperties: false
    response:
      maxBytes: 32768
      schema:
        type: object
        properties:
          id: { type: string }
        required: [id]
      projection:
        - /id
