oimVersion: "1.0"
kind: Integration

metadata:
  id: hubspot
  name: HubSpot
  version: 1.0.0
  description: Read, create, and update HubSpot CRM contacts and companies through a connected app.
  license: Apache-2.0
  maintainers:
    - name: TulipFarm
      url: https://tulipfarm.dev

profiles:
  core: "1.1"
  auth: "1.0"

files:
  - path: fixtures.yml
    role: fixture
    sha256: "1f0dff9b0ab814a2ccb06050d52a2513846d768af1bff4a04df0d42c83a91737"

auth:
  allowedOriginHosts:
    - api.hubapi.com
  credentialSlots:
    - id: client_id
      label: App client id
      kind: api_key
      required: true
    - id: client_secret
      label: App client secret
      kind: client_secret
      required: true
    - id: access_token
      label: Access token
      kind: oauth2_access_token
      required: true
    - id: refresh_token
      label: Refresh token
      kind: oauth2_refresh_token
  steps:
    # The app is the operator's, not TulipFarm's. A shipped client id would put every self-hosted
    # instance behind one app's rate limit and one app's suspension.
    - id: app
      type: fields
      title: Create a HubSpot app
      description: >-
        Open https://developers.hubspot.com, create an app, and add
        https://YOUR-TULIPFARM-HOST/api/v1/integrations/oim/auth/callback as a redirect URL. Copy
        the client id and client secret from the app's Auth tab.
      fields:
        - id: client_id
          label: Client id
          input: text
          required: true
          target:
            type: credential
            slot: client_id
        - id: client_secret
          label: Client secret
          input: password
          required: true
          target:
            type: credential
            slot: client_secret
    - id: consent
      type: oauth2
      title: Authorize the app on your HubSpot account
      description: >-
        HubSpot asks which account to install the app on and shows the scopes below before it
        issues a token.
      authorizationUrl: https://app.hubspot.com/oauth/authorize
      tokenUrl: https://api.hubapi.com/oauth/v1/token
      scopes:
        - oauth
        - crm.objects.contacts.read
        - crm.objects.contacts.write
        - crm.objects.companies.read
        - crm.objects.companies.write
      clientId:
        type: credential
        slot: client_id
      clientSecret:
        type: credential
        slot: client_secret
      bindings:
        - sourcePath: /access_token
          target:
            type: credential
            slot: access_token
        - sourcePath: /refresh_token
          target:
            type: credential
            slot: refresh_token
  healthCheckOperationId: list-contacts

operations:
  - id: list-contacts
    name: hubspot_list_contacts
    description: List CRM contacts.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://api.hubapi.com
      path: /crm/v3/objects/contacts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: properties
          in: query
          schema: { type: string }
    pagination:
      type: cursor
      requestParameter: after
      responsePath: /paging/next/after
      itemsPath: /results
    response:
      maxBytes: 524288
      schema:
        type: object
        properties:
          results:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                createdAt: { type: string }
                updatedAt: { type: string }
                properties: { type: object }
              required: [id, properties]
          paging: { type: object }
        required: [results]
      projection:
        - /results
    rateLimit:
      requests: 100
      perSeconds: 10
      scope: connection

  - id: get-contact
    name: hubspot_get_contact
    description: Read one CRM contact by its HubSpot object id.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://api.hubapi.com
      path: /crm/v3/objects/contacts/{contact_id}
      parameters:
        - name: contact_id
          in: path
          required: true
          schema: { type: string }
        - name: properties
          in: query
          schema: { type: string }
    response:
      maxBytes: 131072
      schema:
        type: object
        properties:
          id: { type: string }
          createdAt: { type: string }
          updatedAt: { type: string }
          properties: { type: object }
        required: [id, properties]
    rateLimit:
      requests: 100
      perSeconds: 10
      scope: connection

  - id: create-contact
    name: hubspot_create_contact
    description: Create a CRM contact.
    effect: create
    identityMode: shared_or_personal
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: POST
      baseUrl: https://api.hubapi.com
      path: /crm/v3/objects/contacts
    requestSchema:
      type: object
      required: [properties]
      properties:
        properties:
          type: object
          description: Contact property values, such as email, firstname and lastname.
      additionalProperties: false
    response:
      maxBytes: 131072
      schema:
        type: object
        properties:
          id: { type: string }
          createdAt: { type: string }
          properties: { type: object }
        required: [id, properties]
    rateLimit:
      requests: 100
      perSeconds: 10
      scope: connection

  - id: update-contact
    name: hubspot_update_contact
    description: Update property values on one CRM contact.
    effect: update
    identityMode: shared_or_personal
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: PATCH
      baseUrl: https://api.hubapi.com
      path: /crm/v3/objects/contacts/{contact_id}
      parameters:
        - name: contact_id
          in: path
          required: true
          schema: { type: string }
    requestSchema:
      type: object
      required: [properties]
      properties:
        properties:
          type: object
          description: Contact property values to change, such as firstname, lastname or phone.
      additionalProperties: false
    response:
      maxBytes: 131072
      schema:
        type: object
        properties:
          id: { type: string }
          createdAt: { type: string }
          updatedAt: { type: string }
          properties: { type: object }
        required: [id, properties]
    rateLimit:
      requests: 100
      perSeconds: 10
      scope: connection

  - id: get-company
    name: hubspot_get_company
    description: Read one CRM company by its HubSpot object id.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://api.hubapi.com
      path: /crm/v3/objects/companies/{company_id}
      parameters:
        - name: company_id
          in: path
          required: true
          schema: { type: string }
        - name: properties
          in: query
          schema: { type: string }
    response:
      maxBytes: 131072
      schema:
        type: object
        properties:
          id: { type: string }
          createdAt: { type: string }
          updatedAt: { type: string }
          properties: { type: object }
        required: [id, properties]
    rateLimit:
      requests: 100
      perSeconds: 10
      scope: connection

  - id: create-company
    name: hubspot_create_company
    description: Create a CRM company with at least a name or domain property.
    effect: create
    identityMode: shared_or_personal
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: POST
      baseUrl: https://api.hubapi.com
      path: /crm/v3/objects/companies
    requestSchema:
      type: object
      required: [properties]
      properties:
        properties:
          type: object
          description: Company property values. Include at least name or domain.
      additionalProperties: false
    response:
      maxBytes: 131072
      schema:
        type: object
        properties:
          id: { type: string }
          createdAt: { type: string }
          properties: { type: object }
        required: [id, properties]
    rateLimit:
      requests: 100
      perSeconds: 10
      scope: connection
