version: 1
cases:
  - name: lists-audiences
    operationId: list-audiences
    configuration:
      data_center: us21.api.mailchimp.com
    request:
      count: 2
      offset: 0
    response:
      status: 200
      body:
        lists:
          - id: audience-1
            name: Tulip buyers
            date_created: "2026-08-01T10:00:00Z"
            stats:
              member_count: 120
              unsubscribe_count: 3
        total_items: 1
    expect:
      request:
        method: GET
        url: https://us21.api.mailchimp.com/3.0/lists?count=2&offset=0&fields=lists.id%2Clists.name%2Clists.date_created%2Clists.stats.member_count%2Clists.stats.unsubscribe_count%2Ctotal_items
      result:
        lists:
          - id: audience-1
            name: Tulip buyers
            date_created: "2026-08-01T10:00:00Z"
            stats:
              member_count: 120
              unsubscribe_count: 3
        total_items: 1

  - name: adds-audience-member
    operationId: add-member
    configuration:
      data_center: us21.api.mailchimp.com
    request:
      list_id: audience-1
      body:
        email_address: muskan@example.com
        status: pending
        merge_fields:
          FNAME: Muskan
        tags: [spring]
    response:
      status: 200
      body:
        id: 0123456789abcdef0123456789abcdef
        email_address: muskan@example.com
        status: pending
        merge_fields:
          FNAME: Muskan
        tags:
          - id: 1
            name: spring
        last_changed: "2026-09-01T10:00:00Z"
    expect:
      request:
        method: POST
        url: https://us21.api.mailchimp.com/3.0/lists/audience-1/members
        body:
          email_address: muskan@example.com
          status: pending
          merge_fields:
            FNAME: Muskan
          tags: [spring]
      result:
        id: 0123456789abcdef0123456789abcdef
        email_address: muskan@example.com
        status: pending
        merge_fields:
          FNAME: Muskan
        tags:
          - id: 1
            name: spring
        last_changed: "2026-09-01T10:00:00Z"

  - name: rejects-invalid-credential
    operationId: get-account
    configuration:
      data_center: us21.api.mailchimp.com
    request: {}
    response:
      status: 401
      body:
        type: https://mailchimp.com/developer/marketing/docs/errors/
        title: API Key Invalid
        status: 401
        detail: Your API key may be invalid.
    expect:
      request:
        method: GET
        url: https://us21.api.mailchimp.com/3.0/?fields=account_id%2Clogin_id%2Caccount_name%2Ctotal_subscribers
      expectedError:
        phase: before_dispatch
        code: provider_unauthorized
        retryable: false

  - name: lists-audience-members
    operationId: list-members
    configuration:
      data_center: us21.api.mailchimp.com
    request:
      list_id: audience-1
      count: 2
      offset: 0
      status: subscribed
    response:
      status: 200
      body:
        members:
          - id: 0123456789abcdef0123456789abcdef
            email_address: muskan@example.com
            status: subscribed
            merge_fields:
              FNAME: Muskan
            tags: []
            last_changed: "2026-09-01T10:00:00Z"
        total_items: 1
    expect:
      request:
        method: GET
        url: https://us21.api.mailchimp.com/3.0/lists/audience-1/members?count=2&offset=0&status=subscribed&fields=members.id%2Cmembers.email_address%2Cmembers.status%2Cmembers.merge_fields%2Cmembers.tags%2Cmembers.last_changed%2Ctotal_items
      result:
        members:
          - id: 0123456789abcdef0123456789abcdef
            email_address: muskan@example.com
            status: subscribed
        total_items: 1

  - name: updates-audience-member
    operationId: update-member
    configuration:
      data_center: us21.api.mailchimp.com
    request:
      list_id: audience-1
      subscriber_hash: 0123456789abcdef0123456789abcdef
      skip_merge_validation: false
      body:
        status: subscribed
        merge_fields:
          FNAME: Muskan
        vip: true
    response:
      status: 200
      body:
        id: 0123456789abcdef0123456789abcdef
        email_address: muskan@example.com
        status: subscribed
        merge_fields:
          FNAME: Muskan
        tags: []
        last_changed: "2026-09-12T10:00:00Z"
    expect:
      request:
        method: PATCH
        url: https://us21.api.mailchimp.com/3.0/lists/audience-1/members/0123456789abcdef0123456789abcdef?skip_merge_validation=false
        body:
          status: subscribed
          merge_fields:
            FNAME: Muskan
          vip: true
      result:
        id: 0123456789abcdef0123456789abcdef
        status: subscribed
        merge_fields:
          FNAME: Muskan

  - name: lists-campaigns
    operationId: list-campaigns
    configuration:
      data_center: us21.api.mailchimp.com
    request:
      count: 2
      offset: 0
      status: save
    response:
      status: 200
      body:
        campaigns:
          - id: campaign-1
            type: regular
            status: save
            settings:
              title: September update
              subject_line: Operations update
              from_name: Muskan
              reply_to: muskan@example.com
            recipients:
              list_id: audience-1
            send_time: ""
            archive_url: ""
        total_items: 1
    expect:
      request:
        method: GET
        url: https://us21.api.mailchimp.com/3.0/campaigns?count=2&offset=0&status=save&fields=campaigns.id%2Ccampaigns.type%2Ccampaigns.status%2Ccampaigns.settings.title%2Ccampaigns.settings.subject_line%2Ccampaigns.settings.from_name%2Ccampaigns.settings.reply_to%2Ccampaigns.recipients.list_id%2Ccampaigns.send_time%2Ccampaigns.archive_url%2Ctotal_items
      result:
        campaigns:
          - id: campaign-1
            type: regular
            status: save
        total_items: 1

  - name: creates-campaign
    operationId: create-campaign
    configuration:
      data_center: us21.api.mailchimp.com
    request:
      body:
        type: regular
        recipients:
          list_id: audience-1
        settings:
          subject_line: Operations update
          title: September update
          from_name: Muskan
          reply_to: muskan@example.com
    response:
      status: 200
      body:
        id: campaign-1
        type: regular
        status: save
        recipients:
          list_id: audience-1
        settings:
          subject_line: Operations update
          title: September update
          from_name: Muskan
          reply_to: muskan@example.com
        create_time: "2026-09-12T10:00:00Z"
    expect:
      request:
        method: POST
        url: https://us21.api.mailchimp.com/3.0/campaigns
        body:
          type: regular
          recipients:
            list_id: audience-1
          settings:
            subject_line: Operations update
            title: September update
            from_name: Muskan
            reply_to: muskan@example.com
      result:
        id: campaign-1
        type: regular
        status: save

  - name: updates-campaign
    operationId: update-campaign
    configuration:
      data_center: us21.api.mailchimp.com
    request:
      campaign_id: campaign-1
      body:
        settings:
          subject_line: Final operations update
          title: September update
          from_name: Muskan
          reply_to: muskan@example.com
    response:
      status: 200
      body:
        id: campaign-1
        type: regular
        status: save
        recipients:
          list_id: audience-1
        settings:
          subject_line: Final operations update
          title: September update
          from_name: Muskan
          reply_to: muskan@example.com
        create_time: "2026-09-12T10:00:00Z"
    expect:
      request:
        method: PATCH
        url: https://us21.api.mailchimp.com/3.0/campaigns/campaign-1
        body:
          settings:
            subject_line: Final operations update
            title: September update
            from_name: Muskan
            reply_to: muskan@example.com
      result:
        id: campaign-1
        settings:
          subject_line: Final operations update
