query ShopifyListProducts($first: Int!, $after: String, $query: String) {
  products(first: $first, after: $after, query: $query, sortKey: UPDATED_AT, reverse: true) {
    nodes {
      id
      title
      handle
      status
      vendor
      productType
      tags
      updatedAt
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
