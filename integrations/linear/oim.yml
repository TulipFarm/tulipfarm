oimVersion: "1.0"
kind: Integration

metadata:
  id: linear
  name: Linear
  version: 1.0.0
  description: >-
    Read, create, update and comment on Linear issues through fixed GraphQL documents and a scoped
    Linear API key.
  license: Apache-2.0
  maintainers:
    - name: TulipFarm
      url: https://tulipfarm.dev

profiles:
  core: "1.0"
  auth: "1.1"

# Every GraphQL document this Integration can send is shipped here and digest-pinned. An Agent
# supplies variables and nothing else, so no argument can widen what a call selects or mutates.
files:
  - path: operations/viewer.graphql
    role: graphql
    sha256: "09e0b4ab3a583a9a2ee156eecfca06cfe3529a6e083ec510ec99a9ca63d48c0c"
  - path: operations/list-teams.graphql
    role: graphql
    sha256: "dd67fe7debfb044de10b779c063e5e3517410432092a27e2d635d694ae33d70d"
  - path: operations/list-issues.graphql
    role: graphql
    sha256: "784266f4186ec720c74cca4d4383f1b338d65c85e6beecf6ac28c76b5f486506"
  - path: operations/read-issue.graphql
    role: graphql
    sha256: "d7241fd88b7a51f89ce0736082aa9da6d031ba98bfee125038f8a8b8ad5be4b3"
  - path: operations/create-issue.graphql
    role: graphql
    sha256: "aa6e9febea50a256996a18c61a72c1019c0c708cdfb947920ec069cf92b5017d"
  - path: operations/update-issue.graphql
    role: graphql
    sha256: "368d828f6813eeef40aab723c4229c5ba08124506243dd446fe8d23d7b002068"
  - path: operations/create-comment.graphql
    role: graphql
    sha256: "869dd8b4d3163e2886ce6c06cd55afc7d787fffc39d1495f67416e159b9a8799"
  - path: operations/list-team-states.graphql
    role: graphql
    sha256: "78419a13e288e82a5c7d3393b69b99880a7b77ba1b4d3a1e552b6ff98e82aa51"
  - path: operations/list-team-members.graphql
    role: graphql
    sha256: "31792eca74828cb5ab1f16c34ca96f3a343bfdef57d88c32e858c5f2ff84bd1b"
  - path: setup-guide-oim.md
    role: guide
    sha256: "ee64ec37d771f602ef4c23c51f7336e86498388cb8723ca4a35d0fb0a6962120"
  - path: setup-guide.md
    role: guide
    sha256: "a36e9cb0be9176f688ff9ddadc090ff7073e0cd4632fa827f8e7fa920e1fbbc5"
  - path: fixtures.yml
    role: fixture
    sha256: "bbe9b6af8c6198bb05436ab909c78c7060b234a9b22b0f1874b1753bc2af0d9a"

auth:
  # Linear is single-tenant on one host, so nothing about the destination is configurable.
  allowedOriginHosts:
    - api.linear.app
  credentialSlots:
    - id: api_key
      label: Linear API key
      kind: api_key
      required: true
  steps:
    - id: key
      type: fields
      title: Create an API key
      description: >-
        In Linear, open Settings > Security & access > Personal API keys and create a key for
        TulipFarm. Limit it to the teams and the read, write, issue-create or comment-create
        permissions this Connection should have — the Connection can do exactly what the key can
        do and nothing more. Linear shows the key once. Agents never see it.
      fields:
        - id: api_key
          label: API key
          input: password
          required: true
          target:
            type: credential
            slot: api_key
  healthCheckOperationId: viewer
  verification:
    issuer:
      source: package
      value: https://api.linear.app
    checks:
      - id: viewer
        operationId: viewer
        credentialSlots: [api_key]
        success:
          - kind: present
            path: /data/viewer/id
    evidence:
      assurance: identified
      subject:
        kind: human
        checkId: viewer
        path: /data/viewer/id
        namespace: issuer

operations:
  - id: viewer
    name: linear_viewer
    description: The Linear account this Connection authenticates as. Use it to confirm the key works.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_key
    # A Linear personal API key is the complete Authorization value, not a Bearer token.
    credentialInjection:
      in: header
      name: Authorization
      format: "{token}"
    source:
      type: graphql
      url: https://api.linear.app/graphql
      operation: Viewer
      documentFile: operations/viewer.graphql
    response:
      maxBytes: 32768
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              viewer:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  email: { type: string }
                required: [id, name]
            required: [viewer]
        required: [data]
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: list-teams
    name: linear_list_teams
    description: >-
      List the Linear teams this Connection can reach. Read it before creating an issue when the
      exact team id is not already known. Request 1–50 teams at a time; while hasNextPage is true,
      pass endCursor as after. A single page is not the complete team list.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_key
    credentialInjection:
      in: header
      name: Authorization
      format: "{token}"
    source:
      type: graphql
      url: https://api.linear.app/graphql
      operation: ListTeams
      documentFile: operations/list-teams.graphql
    requestSchema:
      type: object
      properties:
        first: { type: integer, minimum: 1, maximum: 50 }
        after:
          type: string
          maxLength: 4096
          description: The endCursor from the previous page.
      required: [first]
      additionalProperties: false
    response:
      maxBytes: 131072
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              teams:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        key: { type: string }
                      required: [id, name, key]
                  pageInfo:
                    type: object
                    properties:
                      hasNextPage: { type: boolean }
                      endCursor: { type: ["string", "null"] }
                    required: [hasNextPage, endCursor]
                required: [nodes, pageInfo]
            required: [teams]
        required: [data]
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: list-issues
    name: linear_list_issues
    description: >-
      List issues visible to this Connection, newest activity first. Use the returned ids before
      reading, updating or commenting on one.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_key
    credentialInjection:
      in: header
      name: Authorization
      format: "{token}"
    source:
      type: graphql
      url: https://api.linear.app/graphql
      operation: ListIssues
      documentFile: operations/list-issues.graphql
    # GraphQL variables are the whole input. Linear pages with `first` and `after`, and the cursor
    # comes back in the response, so the Agent asks for the next page itself.
    requestSchema:
      type: object
      properties:
        first:
          type: integer
          minimum: 1
          maximum: 50
        after:
          type: string
          maxLength: 4096
          description: The endCursor from a previous response.
      required: [first]
      additionalProperties: false
    response:
      maxBytes: 262144
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              issues:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        identifier: { type: string }
                        title: { type: string }
                        url: { type: string }
                        updatedAt: { type: string }
                      required: [id, identifier, title]
                  pageInfo:
                    type: object
                    properties:
                      hasNextPage: { type: boolean }
                      endCursor: { type: ["string", "null"] }
                    required: [hasNextPage, endCursor]
                required: [nodes, pageInfo]
            required: [issues]
        required: [data]
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: read-issue
    name: linear_read_issue
    description: >-
      Read one issue by id or identifier. Read it before changing an issue so the edit rests on the
      current title, description, state, assignee, priority, estimate and team.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_key
    credentialInjection:
      in: header
      name: Authorization
      format: "{token}"
    source:
      type: graphql
      url: https://api.linear.app/graphql
      operation: ReadIssue
      documentFile: operations/read-issue.graphql
    requestSchema:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: The issue id, or its identifier such as ENG-42.
      required: [id]
      additionalProperties: false
    response:
      maxBytes: 131072
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              issue:
                type: object
                properties:
                  id: { type: string }
                  identifier: { type: string }
                  title: { type: string }
                  description: { type: string }
                  url: { type: string }
                  updatedAt: { type: string }
                required: [id, identifier, title]
            required: [issue]
        required: [data]
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: create-issue
    name: linear_create_issue
    description: >-
      Create one issue in a team. Read linear_list_teams first for the team id.
    effect: create
    identityMode: shared_or_personal
    credentialSlot: api_key
    credentialInjection:
      in: header
      name: Authorization
      format: "{token}"
    source:
      type: graphql
      url: https://api.linear.app/graphql
      operation: CreateIssue
      documentFile: operations/create-issue.graphql
    requestSchema:
      type: object
      properties:
        teamId: { type: string, minLength: 1, maxLength: 128 }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 100000 }
      required: [teamId, title]
      additionalProperties: false
    response:
      maxBytes: 32768
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              issueCreate:
                type: object
                properties:
                  success: { const: true }
                  issue:
                    type: object
                    properties:
                      id: { type: string }
                      identifier: { type: string }
                      title: { type: string }
                      url: { type: string }
                    required: [id, identifier, title]
                required: [success, issue]
            required: [issueCreate]
        required: [data]
    rateLimit:
      requests: 30
      perSeconds: 60
      scope: connection

  - id: update-issue
    name: linear_update_issue
    description: >-
      Update an issue's title, description, status, assignee, priority or estimate. Read it first.
      Discover stateId with linear_list_team_states and assigneeId with linear_list_team_members
      for the issue's team. Omit unchanged fields; null clears assigneeId or estimate. Priority is
      0 none, 1 urgent, 2 high, 3 normal, 4 low. Use the team's configured estimate scale.
    effect: update
    identityMode: shared_or_personal
    credentialSlot: api_key
    credentialInjection:
      in: header
      name: Authorization
      format: "{token}"
    source:
      type: graphql
      url: https://api.linear.app/graphql
      operation: UpdateIssue
      documentFile: operations/update-issue.graphql
    requestSchema:
      type: object
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 100000 }
        stateId: { type: string, minLength: 1, maxLength: 128 }
        assigneeId: { type: ["string", "null"], minLength: 1, maxLength: 128 }
        priority: { type: integer, minimum: 0, maximum: 4 }
        estimate: { type: ["number", "null"], minimum: 0 }
      required: [id]
      additionalProperties: false
    response:
      maxBytes: 65536
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              issueUpdate:
                type: object
                properties:
                  success: { const: true }
                  issue:
                    type: object
                    properties:
                      id: { type: string }
                      identifier: { type: string }
                      title: { type: string }
                      url: { type: string }
                    required: [id, identifier, title]
                required: [success, issue]
            required: [issueUpdate]
        required: [data]
    rateLimit:
      requests: 30
      perSeconds: 60
      scope: connection

  - id: list-team-states
    name: linear_list_team_states
    description: >-
      Discover valid workflow state ids, names and types for one Linear team before changing an
      issue's status. Page with first (1–50) and after until hasNextPage is false.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_key
    credentialInjection: { in: header, name: Authorization, format: "{token}" }
    source:
      type: graphql
      url: https://api.linear.app/graphql
      operation: ListTeamStates
      documentFile: operations/list-team-states.graphql
    requestSchema:
      type: object
      properties:
        teamId: { type: string, minLength: 1, maxLength: 128 }
        first: { type: integer, minimum: 1, maximum: 50 }
        after: { type: string, maxLength: 4096 }
      required: [teamId, first]
      additionalProperties: false
    response:
      maxBytes: 131072
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              team:
                type: object
                properties:
                  id: { type: string }
                  states:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            type: { type: string }
                            position: { type: number }
                          required: [id, name, type, position]
                      pageInfo:
                        type: object
                        properties:
                          hasNextPage: { type: boolean }
                          endCursor: { type: ["string", "null"] }
                        required: [hasNextPage, endCursor]
                    required: [nodes, pageInfo]
                required: [id, states]
            required: [team]
        required: [data]
    rateLimit: { requests: 60, perSeconds: 60, scope: connection }

  - id: list-team-members
    name: linear_list_team_members
    description: >-
      Discover member ids, names and active status for one Linear team before assigning an issue.
      Page with first (1–50) and after until hasNextPage is false. Do not assign inactive members.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_key
    credentialInjection: { in: header, name: Authorization, format: "{token}" }
    source:
      type: graphql
      url: https://api.linear.app/graphql
      operation: ListTeamMembers
      documentFile: operations/list-team-members.graphql
    requestSchema:
      type: object
      properties:
        teamId: { type: string, minLength: 1, maxLength: 128 }
        first: { type: integer, minimum: 1, maximum: 50 }
        after: { type: string, maxLength: 4096 }
      required: [teamId, first]
      additionalProperties: false
    response:
      maxBytes: 131072
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              team:
                type: object
                properties:
                  id: { type: string }
                  members:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            displayName: { type: string }
                            active: { type: boolean }
                          required: [id, name, displayName, active]
                      pageInfo:
                        type: object
                        properties:
                          hasNextPage: { type: boolean }
                          endCursor: { type: ["string", "null"] }
                        required: [hasNextPage, endCursor]
                    required: [nodes, pageInfo]
                required: [id, members]
            required: [team]
        required: [data]
    rateLimit: { requests: 60, perSeconds: 60, scope: connection }

  - id: create-comment
    name: linear_create_comment
    description: Add one comment to an issue. Read the issue first to confirm its id and context.
    effect: create
    identityMode: shared_or_personal
    credentialSlot: api_key
    credentialInjection:
      in: header
      name: Authorization
      format: "{token}"
    source:
      type: graphql
      url: https://api.linear.app/graphql
      operation: CreateComment
      documentFile: operations/create-comment.graphql
    requestSchema:
      type: object
      properties:
        issueId: { type: string, minLength: 1, maxLength: 128 }
        body: { type: string, minLength: 1, maxLength: 100000 }
      required: [issueId, body]
      additionalProperties: false
    response:
      maxBytes: 32768
      schema:
        type: object
        properties:
          data:
            type: object
            properties:
              commentCreate:
                type: object
                properties:
                  success: { const: true }
                  comment:
                    type: object
                    properties:
                      id: { type: string }
                      body: { type: string }
                      createdAt: { type: string }
                    required: [id, body]
                required: [success, comment]
            required: [commentCreate]
        required: [data]
    rateLimit:
      requests: 30
      perSeconds: 60
      scope: connection
