oimVersion: "1.0"
kind: Integration

metadata:
  id: jira
  name: Jira
  version: 1.1.0
  description: >-
    Discover project fields, search issues, read comments and history, and create, update or
    transition Jira Cloud issues using an unscoped Atlassian API token on one site.
  license: Apache-2.0
  maintainers:
    - name: TulipFarm
      url: https://tulipfarm.dev

profiles:
  core: "1.1"
  auth: "1.1"

files:
  - path: setup-guide.md
    role: guide
    sha256: "81f4678ac0314d7c009490d32f87241afa99a058e5419f594a2254201a58d01a"
  - path: fixtures.yml
    role: fixture
    sha256: "fbe97d788dd678395412129d68e4bb347ddad2421a6345270aade9f149bc507d"

auth:
  # The site is the installation's own Atlassian tenant, so the base URL is templated rather than
  # fixed, and the allowlist keeps that template from becoming a way to point the Tools anywhere.
  # Jira Server and Data Center live on their own domains and are deliberately out of scope.
  allowedOriginHosts:
    - "*.atlassian.net"
  credentialSlots:
    - id: api_credential
      label: Atlassian email and API token
      kind: api_key
      required: true
  configurationFields:
    - id: jira_site
      label: Jira site
      type: string
      required: true
      agentVisible: true
  steps:
    - id: site
      type: fields
      title: Name your Jira site
      description: >-
        Paste the host you sign in to, for example acme.atlassian.net. Only Atlassian Cloud sites
        are accepted; any other host is refused when the Integration compiles.
      fields:
        - id: jira_site
          label: Site host
          input: text
          required: true
          target:
            type: configuration
            field: jira_site
    - id: token
      type: fields
      title: Create an API token
      description: >-
        Create a token without scopes at https://id.atlassian.com/manage-profile/security/api-tokens using the
        account whose Jira access this Connection should carry. Jira Cloud authenticates with the
        account email and the token together, so paste them as one value separated by a colon —
        for example muskan.vijayvargiya@acme.com:the-token. TulipFarm encodes the pair itself; you
        never run base64 by hand, and Agents never see either half.
      fields:
        - id: api_credential
          label: Email and API token
          description: your.email@example.com:api-token
          input: password
          required: true
          target:
            type: credential
            slot: api_credential
  healthCheckOperationId: current-user
  verification:
    issuer:
      source: package
      value: https://api.atlassian.com
    checks:
      - id: current-user
        operationId: current-user
        credentialSlots: [api_credential]
        success:
          - kind: present
            path: /accountId
          - kind: equals
            path: /active
            value: true
    evidence:
      assurance: identified
      subject:
        kind: human
        checkId: current-user
        path: /accountId
        namespace: issuer

operations:
  - id: current-user
    name: jira_current_user
    description: The Jira account this Connection authenticates as. Use it to confirm the token works.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: GET
      baseUrl: https://{jira_site}
      path: /rest/api/3/myself
    response:
      maxBytes: 32768
      schema:
        type: object
        properties:
          accountId: { type: string }
          displayName: { type: string }
          emailAddress: { type: string }
          active: { type: boolean }
        required: [accountId, displayName]
      projection:
        - /accountId
        - /displayName
        - /emailAddress
        - /active
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: search-issues
    name: jira_search_issues
    description: >-
      Search issues with JQL. Read this before estimating or reporting so the answer rests on the
      matching issues and their fields rather than on a guess.
    # Jira models JQL search as a POST because the query goes in the body, but it only reads.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: POST
      baseUrl: https://{jira_site}
      path: /rest/api/3/search/jql
    requestSchema:
      type: object
      properties:
        jql:
          type: string
          minLength: 1
          maxLength: 10000
          description: A JQL query, for example project = ENG AND status != Done.
        maxResults:
          type: integer
          minimum: 1
          maximum: 100
        fields:
          type: array
          maxItems: 50
          items: { type: string }
        expand:
          type: string
          description: Expanded history may be truncated; use jira_list_issue_changelog for all pages.
      required: [jql]
      additionalProperties: false
    pagination:
      type: body_cursor
      requestPointer: /nextPageToken
      responsePath: /nextPageToken
      itemsPath: /issues
    response:
      maxBytes: 524288
      schema:
        type: object
        properties:
          nextPageToken: { type: string }
          issues:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                key: { type: string }
                fields: { type: object }
              required: [id, key, fields]
        required: [issues]
      projection:
        - /issues
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: get-issue
    name: jira_get_issue
    description: >-
      Read one issue by key or id. Embedded comments and expanded changelog can be truncated;
      use jira_list_issue_comments and jira_list_issue_changelog for complete paginated reads.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: GET
      baseUrl: https://{jira_site}
      path: /rest/api/3/issue/{issueIdOrKey}
      parameters:
        - name: issueIdOrKey
          in: path
          schema:
            type: string
            minLength: 1
            description: The issue key such as ENG-421, or its numeric id.
        - name: fields
          in: query
          schema:
            type: string
            description: Comma-separated field names.
        - name: expand
          in: query
          schema:
            type: string
            description: Expanded history may be truncated; use jira_list_issue_changelog for all pages.
    response:
      maxBytes: 262144
      schema:
        type: object
        properties:
          id: { type: string }
          key: { type: string }
          fields: { type: object }
          changelog: { type: object }
        required: [id, key, fields]
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: list-priorities
    name: jira_list_priorities
    description: >-
      List the priorities this Connection can set. Read it before changing a priority when the
      exact priority id is not already known.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: GET
      baseUrl: https://{jira_site}
      path: /rest/api/3/priority
    response:
      maxBytes: 65536
      schema:
        type: array
        items:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            description: { type: string }
          required: [id, name]
    rateLimit:
      requests: 30
      perSeconds: 60
      scope: connection

  - id: list-transitions
    name: jira_list_transitions
    description: >-
      List the workflow transitions available for one issue. Read it before moving an issue,
      because every Jira project can use different transition ids.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: GET
      baseUrl: https://{jira_site}
      path: /rest/api/3/issue/{issueIdOrKey}/transitions
      parameters:
        - name: issueIdOrKey
          in: path
          schema:
            type: string
            minLength: 1
        - name: expand
          in: query
          value: transitions.fields
          schema: { type: string }
    response:
      maxBytes: 65536
      schema:
        type: object
        properties:
          transitions:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                to:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                  required: [id, name]
                fields:
                  type: object
                  description: Required transition fields, schemas, operations and allowed values.
              required: [id, name, to]
        required: [transitions]
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: list-projects
    name: jira_list_projects
    description: >-
      Discover Jira projects visible to this Connection. Use action=create before creating an
      issue. Returns one bounded page; start at startAt=0, then add values.length to the returned
      startAt until reaching total. Never infer project ids from names.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: GET
      baseUrl: https://{jira_site}
      path: /rest/api/3/project/search
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 256 }
        - name: action
          in: query
          schema: { type: string, enum: [view, browse, edit, create] }
        - name: startAt
          in: query
          schema: { type: integer, minimum: 0, maximum: 2147483647 }
        - name: maxResults
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
    response:
      maxBytes: 524288
      schema:
        type: object
        properties:
          startAt: { type: integer, minimum: 0 }
          maxResults: { type: integer, minimum: 1 }
          total: { type: integer, minimum: 0 }
          isLast: { type: boolean }
          values:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                key: { type: string }
                name: { type: string }
              required: [id, key, name]
        required: [startAt, maxResults, total, values]
      projection: [/startAt, /maxResults, /total, /isLast, /values]
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: list-create-issue-types
    name: jira_list_create_issue_types
    description: >-
      Discover issue types this Connection can create in the selected project. Use the returned
      id with jira_list_create_fields. Returns one bounded page; start at startAt=0, then add
      issueTypes.length to the returned startAt until reaching total.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: GET
      baseUrl: https://{jira_site}
      path: /rest/api/3/issue/createmeta/{projectIdOrKey}/issuetypes
      parameters:
        - name: projectIdOrKey
          in: path
          schema: { type: string, minLength: 1 }
        - name: startAt
          in: query
          schema: { type: integer, minimum: 0, maximum: 2147483647 }
        - name: maxResults
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
    response:
      maxBytes: 524288
      schema:
        type: object
        properties:
          startAt: { type: integer, minimum: 0 }
          maxResults: { type: integer, minimum: 1 }
          total: { type: integer, minimum: 0 }
          issueTypes:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                subtask: { type: boolean }
              required: [id, name]
        required: [startAt, maxResults, total, issueTypes]
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: list-create-fields
    name: jira_list_create_fields
    description: >-
      Discover required fields, field ids, schemas, operations, defaults and allowed values for
      creating an issue in this project and issue type. Fetch every page before creating:
      start at startAt=0, then add fields.length to the returned startAt until reaching total.
      If Jira exposes autocomplete instead of all allowed values, ask for a valid value rather
      than inventing an id. Rich-text fields use Atlassian Document Format (ADF).
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: GET
      baseUrl: https://{jira_site}
      path: /rest/api/3/issue/createmeta/{projectIdOrKey}/issuetypes/{issueTypeId}
      parameters:
        - name: projectIdOrKey
          in: path
          schema: { type: string, minLength: 1 }
        - name: issueTypeId
          in: path
          schema: { type: string, minLength: 1 }
        - name: startAt
          in: query
          schema: { type: integer, minimum: 0, maximum: 2147483647 }
        - name: maxResults
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          startAt: { type: integer, minimum: 0 }
          maxResults: { type: integer, minimum: 1 }
          total: { type: integer, minimum: 0 }
          fields:
            type: array
            items:
              type: object
              properties:
                fieldId: { type: string }
                name: { type: string }
                required: { type: boolean }
                schema: { type: object }
                operations: { type: array, items: { type: string } }
                allowedValues: { type: array }
                hasDefaultValue: { type: boolean }
              required: [fieldId, name, required, schema]
        required: [startAt, maxResults, total, fields]
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: get-edit-fields
    name: jira_get_edit_fields
    description: >-
      Discover fields editable on this exact issue, including tenant-required fields, schemas,
      allowed values and update operations. Read this before jira_update_issue; creation metadata
      and fields on other issues do not establish what is editable here.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: GET
      baseUrl: https://{jira_site}
      path: /rest/api/3/issue/{issueIdOrKey}/editmeta
      parameters:
        - name: issueIdOrKey
          in: path
          schema: { type: string, minLength: 1 }
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          fields:
            type: object
            additionalProperties:
              type: object
              properties:
                name: { type: string }
                required: { type: boolean }
                schema: { type: object }
                operations: { type: array, items: { type: string } }
                allowedValues: { type: array }
              required: [name, required, schema]
        required: [fields]
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: list-issue-comments
    name: jira_list_issue_comments
    description: >-
      Read a bounded page of comments visible to this Connection, including ADF bodies, authors,
      timestamps and visibility restrictions. Embedded issue comments can be truncated. Start at
      startAt=0, then add comments.length to the returned startAt until reaching total.
      Never claim a complete thread while unread pages remain.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: GET
      baseUrl: https://{jira_site}
      path: /rest/api/3/issue/{issueIdOrKey}/comment
      parameters:
        - name: issueIdOrKey
          in: path
          schema: { type: string, minLength: 1 }
        - name: startAt
          in: query
          schema: { type: integer, minimum: 0, maximum: 2147483647 }
        - name: maxResults
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: orderBy
          in: query
          value: created
          schema: { type: string }
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          startAt: { type: integer, minimum: 0 }
          maxResults: { type: integer, minimum: 1 }
          total: { type: integer, minimum: 0 }
          comments:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                body: { type: object }
                author: { type: object }
                created: { type: string }
                updated: { type: string }
                visibility: { type: object }
              required: [id, body, created]
        required: [startAt, maxResults, total, comments]
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: list-issue-changelog
    name: jira_list_issue_changelog
    description: >-
      Read a bounded page of issue change history, oldest first, for status changes and cycle-time
      analysis. Expanded issue changelog can be truncated. Start at startAt=0, then add
      values.length to the returned startAt until reaching total. Never claim complete history
      while unread pages remain.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: GET
      baseUrl: https://{jira_site}
      path: /rest/api/3/issue/{issueIdOrKey}/changelog
      parameters:
        - name: issueIdOrKey
          in: path
          schema: { type: string, minLength: 1 }
        - name: startAt
          in: query
          schema: { type: integer, minimum: 0, maximum: 2147483647 }
        - name: maxResults
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          startAt: { type: integer, minimum: 0 }
          maxResults: { type: integer, minimum: 1 }
          total: { type: integer, minimum: 0 }
          isLast: { type: boolean }
          values:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                author: { type: object }
                created: { type: string }
                items: { type: array, items: { type: object } }
              required: [id, created, items]
        required: [startAt, maxResults, total, values]
      projection: [/startAt, /maxResults, /total, /isLast, /values]
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: create-issue
    name: jira_create_issue
    description: >-
      Create one issue. First use jira_list_projects, jira_list_create_issue_types and
      jira_list_create_fields for the selected project and issue type. Supply all tenant-required
      fields and allowed value ids from that metadata, not from a different issue. Rich text uses ADF.
    effect: create
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: POST
      baseUrl: https://{jira_site}
      path: /rest/api/3/issue
    requestSchema:
      type: object
      properties:
        fields:
          type: object
          additionalProperties: true
          description: Jira field ids and values, for example project, issuetype and summary.
        update:
          type: object
          additionalProperties: true
      required: [fields]
      additionalProperties: false
    response:
      maxBytes: 32768
      schema:
        type: object
        properties:
          id: { type: string }
          key: { type: string }
          self: { type: string }
        required: [id, key, self]
      projection:
        - /id
        - /key
        - /self
    rateLimit:
      requests: 30
      perSeconds: 60
      scope: connection

  - id: update-issue
    name: jira_update_issue
    description: >-
      Update fields on one issue, including its priority or an estimate. First read
      jira_get_edit_fields for editable field ids, schemas, operations and allowed values.
      A null result confirms Jira returned HTTP 204; it does not contain the updated issue.
    effect: update
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: PUT
      baseUrl: https://{jira_site}
      path: /rest/api/3/issue/{issueIdOrKey}
      parameters:
        - name: issueIdOrKey
          in: path
          schema:
            type: string
            minLength: 1
    requestSchema:
      type: object
      properties:
        fields:
          type: object
          additionalProperties: true
        update:
          type: object
          additionalProperties: true
      additionalProperties: false
    response:
      maxBytes: 32768
      schema:
        type: "null"
    rateLimit:
      requests: 30
      perSeconds: 60
      scope: connection

  - id: transition-issue
    name: jira_transition_issue
    description: >-
      Move one issue using a transition id returned by jira_list_transitions. This changes the
      issue's state in Jira. Supply any required transition fields from that Tool's metadata.
      A null result confirms Jira returned HTTP 204.
    effect: update
    identityMode: shared_or_personal
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: POST
      baseUrl: https://{jira_site}
      path: /rest/api/3/issue/{issueIdOrKey}/transitions
      parameters:
        - name: issueIdOrKey
          in: path
          schema:
            type: string
            minLength: 1
    requestSchema:
      type: object
      properties:
        transition:
          type: object
          properties:
            id: { type: string, minLength: 1 }
          required: [id]
          additionalProperties: false
        fields:
          type: object
          additionalProperties: true
      required: [transition]
      additionalProperties: false
    response:
      maxBytes: 32768
      schema:
        type: "null"
    rateLimit:
      requests: 30
      perSeconds: 60
      scope: connection
