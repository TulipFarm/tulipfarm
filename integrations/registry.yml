# Curated integration catalog — the "marketplace" an operator browses.
#
# Bundled integrations (a directory next to this file) are discovered automatically; an entry here
# only adds the presentation metadata discovery cannot infer — display title, category, homepage.
# `color` is a brand hex used only when the icon set carries no mark for the brand, so a logo-less
# entry still reads as itself rather than as the one grey row in a coloured catalog.
# An entry with a `source` is a curated third-party integration: nothing ships in the image, and
# installing it clones that repo. Operators can also install any repo by URL without it being
# listed here; this file is curation, not an allowlist.
#
# `availability: coming_soon` means the manifest is in the image but the connect flow is not
# something an operator should be handed yet. The catalog lists the entry so the roadmap is
# visible, and refuses to open it, rather than offering a setup that ends in a dead end.
# An OIM package is ready as soon as every step its `auth` declares is one the runtime can run;
# a package that still declares an `oauth2` step keeps the flag until that lands.
#
# Third-party integrations must be purely declarative. A manifest that runs code — `ts-code`
# egress, a stdio MCP server, or an `ingress.handler` — is rejected at install
# (packages/soul/src/integration-trust.ts).

version: 1

integrations:
  - name: slack
    title: Slack
    # `slack` is not a Simple Icons slug — Slack asked to be removed from that set, so the API's
    # lookup misses and `iconPath` stays empty. It resolves instead against the vendored full-colour
    # marks in apps/web/app/components/integrations/brand-logo.tsx, which carry Slack's official
    # unmodified four-colour mark to identify a Slack integration, the use Slack's brand guidelines
    # allow. Still do not point this at a *lookalike* Simple Icons slug.
    # `color` remains Slack's aubergine, so a client without the vendored mark degrades to a
    # monogram that still reads as Slack rather than as the one grey row in a coloured catalog.
    icon: slack
    color: "4A154B"
    category: chat
    homepage: https://slack.com
    description: Chat with your agents in channels and DMs, and let them post back.

  - name: github
    title: GitHub
    icon: github
    category: code
    homepage: https://github.com
    description: Read and write repositories, issues, and pull requests.

  - name: jira
    title: Jira
    icon: jira
    category: productivity
    homepage: https://www.atlassian.com/software/jira
    description: Search, read, create, update, and transition Jira Cloud issues.

  - name: linear
    title: Linear
    icon: linear
    category: productivity
    homepage: https://linear.app
    description: Read, create, update, and comment on issues with approval for changes.

  - name: telegram
    title: Telegram
    icon: telegram
    color: "26A5E4"
    category: chat
    homepage: https://telegram.org
    description: Send and read messages through a Telegram bot.

  - name: notion
    title: Notion
    icon: notion
    category: productivity
    homepage: https://www.notion.so
    description: Search, read, and page through Notion content shared with an integration.

  - name: hubspot
    title: HubSpot
    icon: hubspot
    color: "FF7A59"
    category: productivity
    homepage: https://www.hubspot.com
    description: Read and create HubSpot CRM contacts and companies through your own connected app.

  - name: twilio
    title: Twilio
    icon: twilio
    color: "F22F46"
    category: communication
    homepage: https://www.twilio.com
    description: Send SMS and WhatsApp messages, and read message history.

  - name: trello
    title: Trello
    icon: trello
    color: "0C66E4"
    category: productivity
    homepage: https://trello.com
    description: Confirm a Trello API key and token, then read the connected member.

  - name: gitlab
    title: GitLab
    icon: gitlab
    category: engineering
    homepage: https://gitlab.com
    description: Read and write issues, merge requests, and notes, and receive project webhooks as
      events.

  - name: confluence
    title: Confluence
    icon: confluence
    category: productivity
    homepage: https://www.atlassian.com/software/confluence
    description: Read spaces and pages, and index them into Knowledge with the page restrictions
      Confluence enforces.

  - name: openweather
    title: OpenWeather
    icon: openweathermap
    category: data
    homepage: https://openweathermap.org
    description: Read current conditions and forecasts for a location.

  - name: google
    availability: coming_soon
    title: Google Workspace
    icon: google
    category: productivity
    homepage: https://workspace.google.com
    description: One Google sign-in for Gmail, Calendar, Drive, and Docs — read and write across all
      of them from a single connection.
