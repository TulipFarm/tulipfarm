oimVersion: "1.0"
kind: Integration

metadata:
  id: telegram
  name: Telegram
  version: 1.0.0
  description: >-
    Send and read messages through a Telegram bot, using the token BotFather issues.
  license: Apache-2.0
  maintainers:
    - name: TulipFarm
      url: https://tulipfarm.dev

profiles:
  core: "1.1"
  auth: "1.0"
  events: "1.0"

files:
  - path: setup-guide.md
    role: guide
    sha256: "d438212f647c51eb5b0400e699cf18fc0c0d2a54a98b4db8aa36b6c001f57381"
  - path: fixtures.yml
    role: fixture
    sha256: "009061c13c268005be698ce79a781da9bbd2e1b371e493a2cc3bcce0405151c6"

auth:
  allowedOriginHosts:
    - api.telegram.org
  credentialSlots:
    - id: bot_token
      label: Telegram bot token
      kind: api_key
      required: true
  steps:
    - id: token
      type: fields
      title: Create a bot and paste its token
      description: >-
        Message @BotFather in Telegram, send /newbot, and copy the token it replies with. Agents
        never see it; it is stored as a Secret and placed in the request URL at call time.
      fields:
        - id: bot_token
          label: Bot token
          input: password
          required: true
          target:
            type: credential
            slot: bot_token
  healthCheckOperationId: get-me

operations:
  - id: get-me
    name: telegram_get_me
    description: Identify the bot this connection authenticates as.
    effect: read
    identityMode: shared_only
    credentialSlot: bot_token
    # Telegram puts the credential in the path, not a header: every endpoint is /bot{token}/method.
    credentialInjection:
      in: path
      format: "bot{token}"
    source:
      type: http
      method: GET
      baseUrl: https://api.telegram.org
      path: /{credential}/getMe
    response:
      maxBytes: 16384
      schema:
        type: object
        properties:
          ok: { const: true }
          result:
            type: object
            properties:
              id: { type: number }
              username: { type: string }
              first_name: { type: string }
            required: [id, first_name]
        required: [ok, result]
      projection:
        - /ok
        - /result/id
        - /result/username
        - /result/first_name
    rateLimit:
      requests: 30
      perSeconds: 60
      scope: connection

  - id: send-message
    name: telegram_send_message
    description: Send a text message to a chat the bot is a member of.
    effect: send
    identityMode: shared_only
    credentialSlot: bot_token
    credentialInjection:
      in: path
      format: "bot{token}"
    source:
      type: http
      method: POST
      baseUrl: https://api.telegram.org
      path: /{credential}/sendMessage
    requestSchema:
      type: object
      properties:
        chat_id:
          type: string
          description: Numeric chat id, or an @channelusername.
        text:
          type: string
          maxLength: 4096
        parse_mode:
          type: string
          enum: [MarkdownV2, HTML]
      required: [chat_id, text]
      additionalProperties: false
    response:
      maxBytes: 32768
      schema:
        type: object
        properties:
          ok: { const: true }
          result:
            type: object
            properties:
              message_id: { type: number }
              date: { type: number }
            required: [message_id, date]
        required: [ok, result]
      projection:
        - /ok
        - /result/message_id
        - /result/date
    rateLimit:
      requests: 30
      perSeconds: 60
      scope: connection

  - id: get-updates
    name: telegram_get_updates
    description: Read pending bot updates, optionally starting after a previously seen update.
    effect: sensitive_read
    identityMode: shared_only
    credentialSlot: bot_token
    credentialInjection:
      in: path
      format: "bot{token}"
    source:
      type: http
      method: GET
      baseUrl: https://api.telegram.org
      path: /{credential}/getUpdates
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            description: >-
              The previous update_id plus one. Telegram confirms all earlier updates when this
              offset is supplied.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        # Pinned: long polling holds the socket open for its whole duration, which a bounded Tool
        # call cannot honour. An Agent able to raise it would time the call out, not wait longer.
        - name: timeout
          in: query
          value: "0"
          schema: { type: integer }
    response:
      maxBytes: 262144
      schema:
        type: object
        properties:
          ok: { const: true }
          result:
            type: array
            items:
              type: object
              properties:
                update_id: { type: integer, minimum: 0 }
                message:
                  type: object
                  properties:
                    message_id: { type: number }
                    text: { type: string }
                    date: { type: number }
                    chat:
                      type: object
                      properties:
                        id: { type: number }
                        title: { type: string }
              required: [update_id]
        required: [ok, result]
    rateLimit:
      requests: 30
      perSeconds: 60
      scope: connection

ingress:
  kind: polling
  operationId: get-updates
  intervalSeconds: 60
  eventTypes:
    - type: message.received
      selector:
        pointer: /message/message_id
        matches: "^[0-9]+$"
      schema:
        type: object
        properties:
          update_id: { type: integer, minimum: 0 }
          message:
            type: object
            properties:
              message_id: { type: integer }
              text: { type: string }
              date: { type: integer }
              chat:
                type: object
                properties:
                  id: { type: integer }
                  title: { type: string }
                required: [id]
            required: [message_id, date, chat]
        required: [update_id, message]
    - type: update.received
      selector:
        pointer: /update_id
        matches: "^[0-9]+$"
      schema:
        type: object
        properties:
          update_id: { type: integer, minimum: 0 }
        required: [update_id]
  cursor:
    mode: max_integer_plus_one
    responsePointer: /result
    itemPointer: /update_id
    requestParameter: offset
