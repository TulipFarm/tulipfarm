oimVersion: "1.0"
kind: Integration

metadata:
  id: linkedin
  name: LinkedIn
  version: 2.0.0
  description: Identify a LinkedIn member and read or create approved Community Management posts.
  license: Apache-2.0
  maintainers:
    - name: TulipFarm
      url: https://tulipfarm.dev

profiles:
  core: "1.1"
  auth: "1.1"

files:
  - path: fixtures.yml
    role: fixture
    sha256: "4801b5bde8dc03e8576c71ac46dd4608c2a8572c3a2dcabe021995bfbc5df2e9"
  - path: setup-guide.md
    role: guide
    sha256: "cf211691dd231e726b41c084e18b723c9afeb36fb3cf7141585f97abb5b51d9d"

auth:
  allowedOriginHosts:
    - api.linkedin.com
  credentialSlots:
    - id: client_id
      label: LinkedIn OAuth client ID
      kind: api_key
      required: true
    - id: client_secret
      label: LinkedIn OAuth client secret
      kind: client_secret
      required: true
    - id: access_token
      label: LinkedIn member access token
      kind: oauth2_access_token
      required: true
  steps:
    - id: app
      type: fields
      title: Add your approved LinkedIn app
      description: >-
        Enter the client credentials for an app approved for the Community Management API. Add the
        exact TulipFarm callback URL to the app before authorizing.
      fields:
        - id: client_id
          label: Client ID
          input: text
          required: true
          target:
            type: credential
            slot: client_id
        - id: client_secret
          label: Client secret
          input: password
          required: true
          target:
            type: credential
            slot: client_secret
    - id: member_consent
      type: oauth2
      title: Authorize a LinkedIn member
      description: >-
        LinkedIn requests only Community Management permissions granted by the app's approved
        product. Organization operations also require an eligible role on the target Page.
      authorizationUrl: https://www.linkedin.com/oauth/v2/authorization
      tokenUrl: https://www.linkedin.com/oauth/v2/accessToken
      scopes:
        - openid
        - profile
        - r_organization_social
        - w_organization_social
        - w_member_social
      clientId:
        type: credential
        slot: client_id
      clientSecret:
        type: credential
        slot: client_secret
      bindings:
        - sourcePath: /access_token
          target:
            type: credential
            slot: access_token
  healthCheckOperationId: current-member
  verification:
    issuer:
      source: package
      value: https://www.linkedin.com
    checks:
      - id: current-member
        operationId: current-member
        credentialSlots: [access_token]
        success:
          - kind: present
            path: /sub
    evidence:
      assurance: identified
      subject:
        kind: human
        checkId: current-member
        path: /sub
        namespace: issuer_client
        clientIdSlot: client_id

operations:
  - id: current-member
    name: linkedin_current_member
    description: Identify the LinkedIn member who authorized this Connection.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://api.linkedin.com
      path: /v2/userinfo
    response:
      maxBytes: 131072
      schema:
        type: object
        properties:
          sub: { type: string, minLength: 1 }
          name: { type: string }
          given_name: { type: string }
          family_name: { type: string }
          picture: { type: string }
          locale:
            type: object
            properties:
              country: { type: string }
              language: { type: string }
        required: [sub]
      projection:
        - /sub
        - /name
        - /given_name
        - /family_name
        - /picture
        - /locale

  - id: read-post
    name: linkedin_read_post
    description: >-
      Read one organization post by encoded URN. Member-post reads need the separately restricted
      r_member_social permission, which this package does not request.
    effect: sensitive_read
    identityMode: shared_or_personal
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://api.linkedin.com
      path: /rest/posts/{post_urn}
      parameters:
        - name: post_urn
          in: path
          required: true
          schema:
            type: string
            pattern: "^urn:li:(share|ugcPost):[0-9]+$"
        - name: X-Restli-Protocol-Version
          in: header
          value: 2.0.0
          schema: { type: string }
        - name: Linkedin-Version
          in: header
          value: "202608"
          schema: { type: string }
    response:
      maxBytes: 524288
      schema:
        type: object
        properties:
          id: { type: string }
          author: { type: string }
          commentary: { type: string }
          lifecycleState: { type: string }
          visibility: { type: string }
          createdAt: { type: integer }
          publishedAt: { type: integer }
          lastModifiedAt: { type: integer }
          distribution: { type: object }
          content: { type: object }
        required: [id, author]
      projection:
        - /id
        - /author
        - /commentary
        - /lifecycleState
        - /visibility
        - /createdAt
        - /publishedAt
        - /lastModifiedAt
        - /distribution
        - /content

  - id: create-post
    name: linkedin_create_post
    description: >-
      Create one public text post as an approved member or organization. Organization authors
      require an eligible LinkedIn Page role.
    effect: send
    identityMode: shared_or_personal
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: POST
      baseUrl: https://api.linkedin.com
      path: /rest/posts
      parameters:
        - name: X-Restli-Protocol-Version
          in: header
          value: 2.0.0
          schema: { type: string }
        - name: Linkedin-Version
          in: header
          value: "202608"
          schema: { type: string }
    requestSchema:
      type: object
      properties:
        author:
          type: string
          pattern: "^urn:li:(person|organization):[A-Za-z0-9_-]+$"
        commentary:
          type: string
          minLength: 1
        visibility:
          type: string
          enum: [PUBLIC]
        distribution:
          type: object
          properties:
            feedDistribution:
              type: string
              enum: [MAIN_FEED]
            targetEntities:
              type: array
              maxItems: 0
            thirdPartyDistributionChannels:
              type: array
              maxItems: 0
          required: [feedDistribution, targetEntities, thirdPartyDistributionChannels]
          additionalProperties: false
        lifecycleState:
          type: string
          enum: [PUBLISHED]
        isReshareDisabledByAuthor:
          type: boolean
      required:
        - author
        - commentary
        - visibility
        - distribution
        - lifecycleState
        - isReshareDisabledByAuthor
      additionalProperties: false
    response:
      maxBytes: 32768
      schema:
        type: object
        additionalProperties: false
