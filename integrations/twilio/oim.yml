oimVersion: "1.0"
kind: Integration

metadata:
  id: twilio
  name: Twilio
  version: 1.0.0
  description: Send SMS and read message history through a Twilio account.
  license: Apache-2.0
  maintainers:
    - name: TulipFarm
      url: https://tulipfarm.dev

profiles:
  core: "1.1"
  auth: "1.0"

auth:
  allowedOriginHosts:
    - api.twilio.com
  credentialSlots:
    # Twilio authenticates with HTTP Basic over `SID:secret`. One slot holds the pair rather than
    # two, because Basic encodes them as a single credential and splitting them here would mean
    # inventing a second lease for a value that never travels separately.
    - id: api_credential
      label: Twilio API key SID and secret
      kind: api_key
      required: true
  configurationFields:
    - id: account_sid
      label: Account SID
      type: string
      required: true
  steps:
    - id: account
      type: fields
      title: Find your Account SID
      description: >-
        Open the Twilio Console dashboard and copy the Account SID. It starts with AC and is not a
        secret — it identifies which account every request addresses.
      fields:
        - id: account_sid
          label: Account SID
          input: text
          required: true
          target:
            type: configuration
            field: account_sid
    - id: credential
      type: fields
      title: Create an API key
      description: >-
        In the Console go to Account → API keys & tokens → Create API key. Paste the value as
        SID:SECRET — for example SKxxxxxxxx:your-secret. Use an API key rather than the Auth Token
        so you can revoke TulipFarm's access alone.
      fields:
        - id: api_credential
          label: API key SID and secret
          input: password
          required: true
          target:
            type: credential
            slot: api_credential
  healthCheckOperationId: get-account

operations:
  - id: get-account
    name: twilio_get_account
    description: Confirm the credential works and report the account's friendly name and status.
    effect: read
    identityMode: shared_only
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: GET
      baseUrl: https://api.twilio.com
      path: /2010-04-01/Accounts/{account_sid}.json
    response:
      maxBytes: 32768
      schema:
        type: object
        properties:
          sid: { type: string }
          friendly_name: { type: string }
          status: { type: string }
          type: { type: string }
      projection:
        - /sid
        - /friendly_name
        - /status
        - /type
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: send-message
    name: twilio_send_sms
    description: Send an SMS or WhatsApp message from a number the account owns.
    effect: send
    identityMode: shared_only
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: POST
      baseUrl: https://api.twilio.com
      # `{account_sid}` is filled from installation configuration, not from a Tool argument: an
      # Agent that could choose the account could address one this Connection never authorized.
      path: /2010-04-01/Accounts/{account_sid}/Messages.json
      # Twilio's REST API takes form-encoded bodies, not JSON.
      contentType: form
    requestSchema:
      type: object
      properties:
        To:
          type: string
          description: Destination in E.164 form, e.g. +14155552671.
        From:
          type: string
          description: A number or messaging service the account owns, in E.164 form.
        Body:
          type: string
          maxLength: 1600
      required: [To, From, Body]
      additionalProperties: false
    response:
      maxBytes: 32768
      schema:
        type: object
        properties:
          sid: { type: string }
          status: { type: string }
          to: { type: string }
          from: { type: string }
          date_created: { type: string }
      projection:
        - /sid
        - /status
        - /to
        - /from
        - /date_created
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection

  - id: list-messages
    name: twilio_list_messages
    description: List messages the account has sent or received, newest first.
    effect: sensitive_read
    identityMode: shared_only
    credentialSlot: api_credential
    credentialInjection:
      in: header
      name: Authorization
      format: "Basic {token}"
      encoding: basic
    source:
      type: http
      method: GET
      baseUrl: https://api.twilio.com
      path: /2010-04-01/Accounts/{account_sid}/Messages.json
      parameters:
        - name: To
          in: query
          schema: { type: string }
        - name: From
          in: query
          schema: { type: string }
        - name: PageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
    response:
      maxBytes: 262144
      schema:
        type: object
        properties:
          messages:
            type: array
            items:
              type: object
              properties:
                sid: { type: string }
                status: { type: string }
                to: { type: string }
                from: { type: string }
                body: { type: string }
                date_sent: { type: string }
    rateLimit:
      requests: 60
      perSeconds: 60
      scope: connection
