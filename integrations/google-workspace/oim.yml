  - id: gmail-list-messages
    name: google_workspace_gmail_list_messages
    description: >-
      Search the connected user's Gmail mailbox. The result contains message and thread IDs; read a
      selected message next for headers, snippet, and body structure.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://gmail.googleapis.com
      path: /gmail/v1/users/{user_id}/messages
      parameters:
        - name: user_id
          in: path
          value: me
          schema: { type: string }
        - name: q
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: labelIds
          in: query
          schema:
            type: string
            maxLength: 256
            description: One Gmail label ID, such as INBOX or UNREAD.
        - name: maxResults
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: includeSpamTrash
          in: query
          schema: { type: boolean }
    pagination:
      type: cursor
      requestParameter: pageToken
      responsePath: /nextPageToken
      itemsPath: /messages
    response:
      maxBytes: 2097152
      schema:
        type: object
        properties:
          messages:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                threadId: { type: string }
          nextPageToken: { type: string }
          resultSizeEstimate: { type: integer }

  - id: gmail-get-message
    name: google_workspace_gmail_get_message
    description: >-
      Read one Gmail message by ID. Use metadata for headers only, full for parsed MIME structure,
      minimal for IDs and labels, or raw for the base64url RFC 2822 message.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://gmail.googleapis.com
      path: /gmail/v1/users/{user_id}/messages/{message_id}
      parameters:
        - name: user_id
          in: path
          value: me
          schema: { type: string }
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: format
          in: query
          schema:
            type: string
            enum: [minimal, full, raw, metadata]
    response:
      maxBytes: 10485760
      schema:
        type: object
        properties:
          id: { type: string }
          threadId: { type: string }
          labelIds:
            type: array
            items: { type: string }
          snippet: { type: string }
          historyId: { type: string }
          internalDate: { type: string }
          raw: { type: string }
          payload:
            type: object
            properties:
              partId: { type: string }
              mimeType: { type: string }
              filename: { type: string }
              headers:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    value: { type: string }
              body: { type: object }
              parts:
                type: array
                items: { type: object }

  - id: gmail-send-message
    name: google_workspace_gmail_send_message
    description: >-
      Send one Gmail message for the connected user. Supply a complete RFC 2822 message encoded as
      base64url in raw; optionally supply threadId to add it to an existing thread.
    effect: send
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: POST
      baseUrl: https://gmail.googleapis.com
      path: /gmail/v1/users/{user_id}/messages/send
      parameters:
        - name: user_id
          in: path
          value: me
          schema: { type: string }
    requestSchema:
      type: object
      properties:
        raw:
          type: string
          minLength: 1
          maxLength: 5000000
          pattern: "^[A-Za-z0-9_-]+={0,2}$"
          description: Complete RFC 2822 message encoded as base64url.
        threadId:
          type: string
          maxLength: 256
      required: [raw]
      additionalProperties: false
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          id: { type: string }
          threadId: { type: string }
          labelIds:
            type: array
            items: { type: string }
