oimVersion: "1.0"
kind: Integration

metadata:
  id: google-workspace
  name: Google Workspace
  version: 2.1.0
  description: >-
    Read and write Docs, Sheets, Slides, Drive files, Calendar events, and Gmail messages through
    one Google user OAuth Connection.
  license: Apache-2.0
  maintainers:
    - name: TulipFarm
      url: https://tulipfarm.dev

profiles:
  core: "1.4"
  auth: "1.1"

files:
  - path: setup-guide.md
    role: guide
    sha256: "23fb2370355b0301a33f0501a1a2a9e44f01d90de398cd2e36d806ffca31b82f"
  - path: fixtures.yml
    role: fixture
    sha256: "2c696e7d94c995c7215e91988a488895af4cd32d3a8875899fa464223c45c16d"

auth:
  # Fixed operation origins are also compiled into each Tool contract. Drive and Calendar share
  # Google's documented www.googleapis.com REST origin, so six services have five unique hosts.
  allowedOriginHosts:
    - docs.googleapis.com
    - sheets.googleapis.com
    - slides.googleapis.com
    - www.googleapis.com
    - gmail.googleapis.com
    - openidconnect.googleapis.com
  credentialSlots:
    - id: client_id
      label: Google OAuth client ID
      kind: api_key
      required: true
    - id: client_secret
      label: Google OAuth client secret
      kind: client_secret
      required: true
    - id: access_token
      label: Google OAuth access token
      kind: oauth2_access_token
      required: true
    - id: refresh_token
      label: Google OAuth refresh token
      kind: oauth2_refresh_token
      required: true
  steps:
    - id: oauth_client
      type: fields
      title: Add your Google OAuth client
      description: >-
        Create a Web application OAuth client in the Google Cloud project owned by this deployment.
        Enable the six Workspace APIs and add the exact TulipFarm callback URL before copying these
        values. The setup guide lists Google's review and test-user limits.
      fields:
        - id: client_id
          label: OAuth client ID
          description: The client ID from Google Cloud Console > Google Auth Platform > Clients.
          input: text
          required: true
          target:
            type: credential
            slot: client_id
        - id: client_secret
          label: OAuth client secret
          description: The secret issued with the Web application OAuth client.
          input: password
          required: true
          target:
            type: credential
            slot: client_secret
    - id: user_consent
      type: oauth2
      title: Connect a Google user
      description: >-
        Sign in as the Google user whose Workspace data this personal Connection should use.
        Google shows every requested scope and asks for offline access so TulipFarm can refresh the
        Connection after the user leaves.
      authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
      tokenUrl: https://oauth2.googleapis.com/token
      authorizationParameters:
        access_type: offline
        prompt: consent
        include_granted_scopes: "true"
      scopes:
        - openid
        - profile
        - email
        - https://www.googleapis.com/auth/documents
        - https://www.googleapis.com/auth/spreadsheets
        - https://www.googleapis.com/auth/presentations
        - https://www.googleapis.com/auth/drive
        - https://www.googleapis.com/auth/calendar.events
        - https://www.googleapis.com/auth/calendar.calendarlist.readonly
        - https://www.googleapis.com/auth/gmail.readonly
        - https://www.googleapis.com/auth/gmail.send
        - https://www.googleapis.com/auth/gmail.compose
      pkce: true
      clientId:
        type: credential
        slot: client_id
      clientSecret:
        type: credential
        slot: client_secret
      bindings:
        - sourcePath: /access_token
          target:
            type: credential
            slot: access_token
        - sourcePath: /refresh_token
          target:
            type: credential
            slot: refresh_token
  healthCheckOperationId: current-user
  verification:
    issuer:
      source: package
      value: https://accounts.google.com
    checks:
      - id: current-user
        operationId: current-user
        credentialSlots: [access_token]
        success:
          - kind: present
            path: /sub
    evidence:
      assurance: identified
      subject:
        kind: human
        checkId: current-user
        path: /sub
        namespace: issuer_client
        clientIdSlot: client_id

operations:
  - id: current-user
    name: google_workspace_current_user
    description: Identify the Google user who authorized this personal Connection.
    effect: read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://openidconnect.googleapis.com
      path: /v1/userinfo
    response:
      maxBytes: 131072
      schema:
        type: object
        properties:
          sub: { type: string, minLength: 1 }
          name: { type: string }
          given_name: { type: string }
          family_name: { type: string }
          picture: { type: string }
          email: { type: string }
          email_verified: { type: boolean }
          locale: { type: string }
          hd: { type: string }
        required: [sub]
      projection:
        - /sub
        - /name
        - /given_name
        - /family_name
        - /picture
        - /email
        - /email_verified
        - /locale
        - /hd

  - id: docs-get
    name: google_workspace_docs_get
    description: >-
      Read one Google Doc, including its title, revision, tabs, and structural content. Read it
      before editing so a batch update can use the current revision.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://docs.googleapis.com
      path: /v1/documents/{document_id}
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: includeTabsContent
          in: query
          schema: { type: boolean }
    response:
      maxBytes: 10485760
      schema:
        type: object
        properties:
          documentId: { type: string }
          title: { type: string }
          revisionId: { type: string }
          body:
            type: object
            properties:
              content:
                type: array
                items: { type: object }
          tabs:
            type: array
            items: { type: object }

  - id: docs-create
    name: google_workspace_docs_create
    description: Create a blank Google Doc with a title. Use the returned document ID for edits.
    effect: create
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: POST
      baseUrl: https://docs.googleapis.com
      path: /v1/documents
    requestSchema:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
      required: [title]
      additionalProperties: false
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          documentId: { type: string }
          title: { type: string }
          revisionId: { type: string }

  - id: docs-batch-update
    name: google_workspace_docs_batch_update
    description: >-
      Apply one atomic Google Docs batchUpdate request. Read the document first and include a
      writeControl revision when replacing or inserting content into a shared document.
    effect: update
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: POST
      baseUrl: https://docs.googleapis.com
      path: /v1/documents/{document_id}:batchUpdate
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
    requestSchema:
      type: object
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            minProperties: 1
        writeControl:
          type: object
          properties:
            requiredRevisionId: { type: string }
            targetRevisionId: { type: string }
          additionalProperties: false
      required: [requests]
      additionalProperties: false
    response:
      maxBytes: 2097152
      schema:
        type: object
        properties:
          documentId: { type: string }
          replies:
            type: array
            items: { type: object }
          writeControl: { type: object }

  - id: sheets-get
    name: google_workspace_sheets_get
    description: >-
      Read spreadsheet metadata and sheet properties. Use a field mask or a small range when the
      spreadsheet is large; use the values operation for cell data.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://sheets.googleapis.com
      path: /v4/spreadsheets/{spreadsheet_id}
      parameters:
        - name: spreadsheet_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: ranges
          in: query
          schema:
            type: string
            maxLength: 1024
            description: One A1 range. Use sheets-get-values for direct cell reads.
        - name: includeGridData
          in: query
          schema: { type: boolean }
        - name: fields
          in: query
          schema:
            type: string
            maxLength: 2048
    response:
      maxBytes: 10485760
      schema:
        type: object
        properties:
          spreadsheetId: { type: string }
          spreadsheetUrl: { type: string }
          properties: { type: object }
          sheets:
            type: array
            items: { type: object }
          namedRanges:
            type: array
            items: { type: object }

  - id: sheets-get-values
    name: google_workspace_sheets_get_values
    description: Read cell values from one A1 range in a Google Sheet.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://sheets.googleapis.com
      path: /v4/spreadsheets/{spreadsheet_id}/values/{range}
      parameters:
        - name: spreadsheet_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: range
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: majorDimension
          in: query
          schema:
            type: string
            enum: [ROWS, COLUMNS]
        - name: valueRenderOption
          in: query
          schema:
            type: string
            enum: [FORMATTED_VALUE, UNFORMATTED_VALUE, FORMULA]
        - name: dateTimeRenderOption
          in: query
          schema:
            type: string
            enum: [SERIAL_NUMBER, FORMATTED_STRING]
    response:
      maxBytes: 10485760
      schema:
        type: object
        properties:
          range: { type: string }
          majorDimension: { type: string }
          values:
            type: array
            items:
              type: array
              items: {}

  - id: sheets-create
    name: google_workspace_sheets_create
    description: Create a Google spreadsheet. Use the returned spreadsheet ID for value writes.
    effect: create
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: POST
      baseUrl: https://sheets.googleapis.com
      path: /v4/spreadsheets
    requestSchema:
      type: object
      properties:
        properties:
          type: object
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 512
            locale: { type: string }
            timeZone: { type: string }
          required: [title]
          additionalProperties: false
        sheets:
          type: array
          maxItems: 100
          items: { type: object }
      required: [properties]
      additionalProperties: false
    response:
      maxBytes: 4194304
      schema:
        type: object
        properties:
          spreadsheetId: { type: string }
          spreadsheetUrl: { type: string }
          properties: { type: object }
          sheets:
            type: array
            items: { type: object }

  - id: sheets-update-values
    name: google_workspace_sheets_update_values
    description: >-
      Replace values in one A1 range. USER_ENTERED interprets formulas and dates as if a user typed
      them; RAW stores literal values.
    effect: update
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: PUT
      baseUrl: https://sheets.googleapis.com
      path: /v4/spreadsheets/{spreadsheet_id}/values/{range}
      parameters:
        - name: spreadsheet_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: range
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: valueInputOption
          in: query
          required: true
          schema:
            type: string
            enum: [RAW, USER_ENTERED]
        - name: includeValuesInResponse
          in: query
          schema: { type: boolean }
    requestSchema:
      type: object
      properties:
        range: { type: string }
        majorDimension:
          type: string
          enum: [ROWS, COLUMNS]
        values:
          type: array
          minItems: 1
          items:
            type: array
            items: {}
      required: [values]
      additionalProperties: false
    response:
      maxBytes: 4194304
      schema:
        type: object
        properties:
          spreadsheetId: { type: string }
          updatedRange: { type: string }
          updatedRows: { type: integer }
          updatedColumns: { type: integer }
          updatedCells: { type: integer }
          updatedData: { type: object }

  - id: slides-get
    name: google_workspace_slides_get
    description: Read one Google Slides presentation, including slide and page element structure.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://slides.googleapis.com
      path: /v1/presentations/{presentation_id}
      parameters:
        - name: presentation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
    response:
      maxBytes: 10485760
      schema:
        type: object
        properties:
          presentationId: { type: string }
          title: { type: string }
          revisionId: { type: string }
          slides:
            type: array
            items:
              type: object
              properties:
                objectId: { type: string }
                pageElements:
                  type: array
                  items: { type: object }

  - id: slides-create
    name: google_workspace_slides_create
    description: Create a blank Google Slides presentation with a title.
    effect: create
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: POST
      baseUrl: https://slides.googleapis.com
      path: /v1/presentations
    requestSchema:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
      required: [title]
      additionalProperties: false
    response:
      maxBytes: 4194304
      schema:
        type: object
        properties:
          presentationId: { type: string }
          title: { type: string }
          revisionId: { type: string }
          slides:
            type: array
            items: { type: object }

  - id: slides-batch-update
    name: google_workspace_slides_batch_update
    description: >-
      Apply one atomic Google Slides batchUpdate request. Read the presentation first and use its
      object IDs and revision when changing existing elements.
    effect: update
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: POST
      baseUrl: https://slides.googleapis.com
      path: /v1/presentations/{presentation_id}:batchUpdate
      parameters:
        - name: presentation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
    requestSchema:
      type: object
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            minProperties: 1
        writeControl:
          type: object
          properties:
            requiredRevisionId: { type: string }
          additionalProperties: false
      required: [requests]
      additionalProperties: false
    response:
      maxBytes: 2097152
      schema:
        type: object
        properties:
          presentationId: { type: string }
          replies:
            type: array
            items: { type: object }
          writeControl: { type: object }

  - id: drive-list-files
    name: google_workspace_drive_list_files
    description: >-
      Search and list Drive files visible to the connected user. Use the returned IDs before
      reading metadata, updating, or downloading a file. This lists the user corpus, including
      Shared Drive files the user has accessed. For complete discovery within one Shared Drive,
      use drive_list_shared_drive_files with its driveId. This is a bounded page, not a full scan.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://www.googleapis.com
      path: /drive/v3/files
      parameters:
        - name: supportsAllDrives
          in: query
          value: "true"
          schema: { type: boolean }
        - name: includeItemsFromAllDrives
          in: query
          value: "true"
          schema: { type: boolean }
        - name: corpora
          in: query
          value: user
          schema: { type: string }
        - name: q
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: orderBy
          in: query
          schema:
            type: string
            maxLength: 512
        - name: spaces
          in: query
          schema:
            type: string
            enum: [drive]
        - name: fields
          in: query
          value: "nextPageToken,incompleteSearch,files(id,name,mimeType,modifiedTime,size,webViewLink,driveId,capabilities(canDownload))"
          schema: { type: string }
    pagination:
      type: cursor
      requestParameter: pageToken
      responsePath: /nextPageToken
      itemsPath: /files
    response:
      maxBytes: 4194304
      schema:
        type: object
        properties:
          nextPageToken: { type: string }
          incompleteSearch: { type: boolean, const: false }
          files:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                mimeType: { type: string }
                modifiedTime: { type: string }
                size: { type: string }
                webViewLink: { type: string }
                capabilities:
                  type: object
                  properties:
                    canDownload: { type: boolean }

  - id: drive-get-file
    name: google_workspace_drive_get_file
    description: Read metadata and download capability for one Drive file by ID.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://www.googleapis.com
      path: /drive/v3/files/{file_id}
      parameters:
        - name: supportsAllDrives
          in: query
          value: "true"
          schema: { type: boolean }
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: fields
          in: query
          value: "id,name,mimeType,description,createdTime,modifiedTime,size,parents,webViewLink,capabilities(canDownload,canEdit)"
          schema: { type: string }
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          id: { type: string }
          name: { type: string }
          mimeType: { type: string }
          description: { type: string }
          createdTime: { type: string }
          modifiedTime: { type: string }
          size: { type: string }
          parents:
            type: array
            items: { type: string }
          webViewLink: { type: string }
          capabilities: { type: object }

  - id: drive-create-file
    name: google_workspace_drive_create_file
    description: >-
      Create a metadata-only Drive file, such as a folder or an empty file. This operation does not
      upload bytes; create Docs, Sheets, and Slides through their service operations.
    effect: create
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: POST
      baseUrl: https://www.googleapis.com
      path: /drive/v3/files
      parameters:
        - name: supportsAllDrives
          in: query
          value: "true"
          schema: { type: boolean }
        - name: fields
          in: query
          value: "id,name,mimeType,description,parents,webViewLink"
          schema: { type: string }
    requestSchema:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        mimeType:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 32768
        parents:
          type: array
          maxItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 256
      required: [name]
      additionalProperties: false
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          id: { type: string }
          name: { type: string }
          mimeType: { type: string }
          description: { type: string }
          parents:
            type: array
            items: { type: string }
          webViewLink: { type: string }

  - id: drive-update-file
    name: google_workspace_drive_update_file
    description: >-
      Update Drive metadata such as a file's name, description, starred state, or trashed state.
      Read the file first so the edit targets the intended item.
    effect: update
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: PATCH
      baseUrl: https://www.googleapis.com
      path: /drive/v3/files/{file_id}
      parameters:
        - name: supportsAllDrives
          in: query
          value: "true"
          schema: { type: boolean }
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: fields
          in: query
          value: "id,name,mimeType,description,starred,trashed,modifiedTime,webViewLink"
          schema: { type: string }
    requestSchema:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        description:
          type: string
          maxLength: 32768
        starred: { type: boolean }
        trashed: { type: boolean }
      additionalProperties: false
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          id: { type: string }
          name: { type: string }
          mimeType: { type: string }
          description: { type: string }
          starred: { type: boolean }
          trashed: { type: boolean }
          modifiedTime: { type: string }
          webViewLink: { type: string }

  - id: drive-download-file
    name: google_workspace_drive_download_file
    description: >-
      Download one Drive blob file into a TulipFarm File. Check google_workspace_drive_get_file
      first and continue only when capabilities.canDownload is true. Google Workspace-native files
      need export instead.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://www.googleapis.com
      path: /drive/v3/files/{file_id}
      parameters:
        - name: supportsAllDrives
          in: query
          value: "true"
          schema: { type: boolean }
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: alt
          in: query
          value: media
          schema: { type: string }
    response:
      mode: binary
      maxBytes: 10485760

  - id: calendar-list-events
    name: google_workspace_calendar_list_events
    description: >-
      List events on one calendar. Use "primary" for the connected user's main calendar. Use
      timeMin and timeMax for a bounded window.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://www.googleapis.com
      path: /calendar/v3/calendars/{calendar_id}/events
      parameters:
        - name: calendar_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: timeMin
          in: query
          schema:
            type: string
            format: date-time
        - name: timeMax
          in: query
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          schema:
            type: string
            maxLength: 1024
        - name: singleEvents
          in: query
          schema: { type: boolean }
        - name: orderBy
          in: query
          schema:
            type: string
            enum: [startTime, updated]
        - name: maxResults
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2500
        - name: showDeleted
          in: query
          schema: { type: boolean }
    pagination:
      type: cursor
      requestParameter: pageToken
      responsePath: /nextPageToken
      itemsPath: /items
    response:
      maxBytes: 10485760
      schema:
        type: object
        properties:
          kind: { type: string }
          summary: { type: string }
          timeZone: { type: string }
          nextPageToken: { type: string }
          nextSyncToken: { type: string }
          items:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                status: { type: string }
                htmlLink: { type: string }
                created: { type: string }
                updated: { type: string }
                summary: { type: string }
                description: { type: string }
                location: { type: string }
                start: { type: object }
                end: { type: object }
                attendees:
                  type: array
                  items: { type: object }

  - id: calendar-create-event
    name: google_workspace_calendar_create_event
    description: >-
      Create one Calendar event. Supply start and end as dateTime values with a time zone, or as
      all-day date values. Choose sendUpdates explicitly when attendees are present.
    effect: create
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: POST
      baseUrl: https://www.googleapis.com
      path: /calendar/v3/calendars/{calendar_id}/events
      parameters:
        - name: calendar_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: sendUpdates
          in: query
          schema:
            type: string
            enum: [all, externalOnly, none]
        - name: conferenceDataVersion
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1
    requestSchema:
      type: object
      properties:
        summary:
          type: string
          maxLength: 1024
        description:
          type: string
          maxLength: 32768
        location:
          type: string
          maxLength: 1024
        start:
          type: object
          minProperties: 1
          properties:
            date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
            dateTime: { type: string, format: date-time }
            timeZone: { type: string }
          additionalProperties: false
        end:
          type: object
          minProperties: 1
          properties:
            date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
            dateTime: { type: string, format: date-time }
            timeZone: { type: string }
          additionalProperties: false
        attendees:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              email:
                type: string
                minLength: 3
                maxLength: 320
              displayName: { type: string }
              optional: { type: boolean }
            required: [email]
            additionalProperties: false
        recurrence:
          type: array
          maxItems: 20
          items: { type: string }
        reminders: { type: object }
        conferenceData: { type: object }
      required: [start, end]
      additionalProperties: false
    response:
      maxBytes: 4194304
      schema:
        type: object
        properties:
          id: { type: string }
          status: { type: string }
          htmlLink: { type: string }
          created: { type: string }
          updated: { type: string }
          summary: { type: string }
          description: { type: string }
          location: { type: string }
          start: { type: object }
          end: { type: object }
          attendees:
            type: array
            items: { type: object }

  - id: calendar-update-event
    name: google_workspace_calendar_update_event
    description: >-
      Patch selected fields on one Calendar event. Read the event first, then change only the
      fields supplied here. Choose sendUpdates explicitly when changing attendee-visible details.
    effect: update
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: PATCH
      baseUrl: https://www.googleapis.com
      path: /calendar/v3/calendars/{calendar_id}/events/{event_id}
      parameters:
        - name: calendar_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: sendUpdates
          in: query
          schema:
            type: string
            enum: [all, externalOnly, none]
        - name: conferenceDataVersion
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1
    requestSchema:
      type: object
      minProperties: 1
      properties:
        summary:
          type: string
          maxLength: 1024
        description:
          type: string
          maxLength: 32768
        location:
          type: string
          maxLength: 1024
        status:
          type: string
          enum: [confirmed, tentative, cancelled]
        start:
          type: object
          minProperties: 1
          properties:
            date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
            dateTime: { type: string, format: date-time }
            timeZone: { type: string }
          additionalProperties: false
        end:
          type: object
          minProperties: 1
          properties:
            date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
            dateTime: { type: string, format: date-time }
            timeZone: { type: string }
          additionalProperties: false
        attendees:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              email:
                type: string
                minLength: 3
                maxLength: 320
              displayName: { type: string }
              optional: { type: boolean }
            required: [email]
            additionalProperties: false
        recurrence:
          type: array
          maxItems: 20
          items: { type: string }
        reminders: { type: object }
        conferenceData: { type: object }
      additionalProperties: false
    response:
      maxBytes: 4194304
      schema:
        type: object
        properties:
          id: { type: string }
          status: { type: string }
          htmlLink: { type: string }
          updated: { type: string }
          summary: { type: string }
          description: { type: string }
          location: { type: string }
          start: { type: object }
          end: { type: object }
          attendees:
            type: array
            items: { type: object }

  - id: gmail-list-messages
    name: google_workspace_gmail_list_messages
    description: >-
      Search the connected user's Gmail mailbox. The result contains message and thread IDs; read a
      selected message next for headers, snippet, and body structure.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://gmail.googleapis.com
      path: /gmail/v1/users/{user_id}/messages
      parameters:
        - name: user_id
          in: path
          value: me
          schema: { type: string }
        - name: q
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: labelIds
          in: query
          schema:
            type: string
            maxLength: 256
            description: One Gmail label ID, such as INBOX or UNREAD.
        - name: maxResults
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: includeSpamTrash
          in: query
          schema: { type: boolean }
    pagination:
      type: cursor
      requestParameter: pageToken
      responsePath: /nextPageToken
      itemsPath: /messages
    response:
      maxBytes: 2097152
      schema:
        type: object
        properties:
          messages:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                threadId: { type: string }
          nextPageToken: { type: string }
          resultSizeEstimate: { type: integer }

  - id: gmail-get-message
    name: google_workspace_gmail_get_message
    description: >-
      Read one Gmail message by ID. Use metadata for headers only, full for parsed MIME structure,
      minimal for IDs and labels, or raw for the base64url RFC 2822 message.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://gmail.googleapis.com
      path: /gmail/v1/users/{user_id}/messages/{message_id}
      parameters:
        - name: user_id
          in: path
          value: me
          schema: { type: string }
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: format
          in: query
          schema:
            type: string
            enum: [minimal, full, raw, metadata]
    response:
      maxBytes: 10485760
      schema:
        type: object
        properties:
          id: { type: string }
          threadId: { type: string }
          labelIds:
            type: array
            items: { type: string }
          snippet: { type: string }
          historyId: { type: string }
          internalDate: { type: string }
          raw: { type: string }
          payload:
            type: object
            properties:
              partId: { type: string }
              mimeType: { type: string }
              filename: { type: string }
              headers:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    value: { type: string }
              body: { type: object }
              parts:
                type: array
                items: { type: object }

  - id: gmail-send-message
    name: google_workspace_gmail_send_message
    description: >-
      Send one Gmail message for the connected user. Supply a complete RFC 2822 message encoded as
      base64url in raw; optionally supply threadId to add it to an existing thread. Prefer
      google_workspace_gmail_compose_send_message for text, HTML, and TulipFarm File attachments.
    effect: send
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: POST
      baseUrl: https://gmail.googleapis.com
      path: /gmail/v1/users/{user_id}/messages/send
      parameters:
        - name: user_id
          in: path
          value: me
          schema: { type: string }
    requestSchema:
      type: object
      properties:
        raw:
          type: string
          minLength: 1
          maxLength: 5000000
          pattern: "^[A-Za-z0-9_-]+={0,2}$"
          description: Complete RFC 2822 message encoded as base64url.
        threadId:
          type: string
          maxLength: 256
      required: [raw]
      additionalProperties: false
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          id: { type: string }
          threadId: { type: string }
          labelIds:
            type: array
            items: { type: string }

  - id: drive-list-drives
    name: google_workspace_drive_list_drives
    description: List Shared Drives accessible to the connected user, one bounded page at a time.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection: &bearer
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://www.googleapis.com
      path: /drive/v3/drives
      parameters:
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: fields
          in: query
          value: "nextPageToken,drives(id,name)"
          schema: { type: string }
    pagination:
      type: cursor
      requestParameter: pageToken
      responsePath: /nextPageToken
      itemsPath: /drives
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          nextPageToken: { type: string }
          drives:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                name: { type: string }

  - id: drive-list-shared-drive-files
    name: google_workspace_drive_list_shared_drive_files
    description: >-
      Search a single Shared Drive by driveId from drive_list_drives. The corpus is pinned to
      drive, so there is no ambiguous allDrives search. Follow the host next_page_token until absent.
      A provider incompleteSearch=true response is rejected, never reported as complete.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection: *bearer
    source:
      type: http
      method: GET
      baseUrl: https://www.googleapis.com
      path: /drive/v3/files
      parameters:
        - name: supportsAllDrives
          in: query
          value: "true"
          schema: { type: boolean }
        - name: includeItemsFromAllDrives
          in: query
          value: "true"
          schema: { type: boolean }
        - name: corpora
          in: query
          value: drive
          schema: { type: string }
        - name: driveId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: q
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: fields
          in: query
          value: "nextPageToken,incompleteSearch,files(id,name,mimeType,modifiedTime,size,parents,driveId,webViewLink,capabilities(canDownload))"
          schema: { type: string }
    pagination:
      type: cursor
      requestParameter: pageToken
      responsePath: /nextPageToken
      itemsPath: /files
    response:
      maxBytes: 4194304
      schema:
        type: object
        properties:
          nextPageToken: { type: string }
          incompleteSearch: { type: boolean, const: false }
          files:
            type: array
            items: { type: object }

  - id: drive-upload-file
    name: google_workspace_drive_upload_file
    description: >-
      Upload the bytes of an authorized TulipFarm File with Drive metadata in one bounded
      multipart/related request. Supply a parent folder ID to upload into a Shared Drive.
      Combined metadata and file bytes must not exceed 5 MiB; larger/resumable uploads are unsupported.
    effect: create
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection: *bearer
    source:
      type: http
      method: POST
      baseUrl: https://www.googleapis.com
      path: /upload/drive/v3/files
      contentType: multipart
      multipart:
        subtype: related
        maxBytes: 5242880
        parts:
          - name: metadata
            kind: field
            pointer: /metadata
            mediaType: application/json
            maxBytes: 65536
          - name: file
            kind: file
            pointer: /fileId
      parameters:
        - name: uploadType
          in: query
          value: multipart
          schema: { type: string }
        - name: supportsAllDrives
          in: query
          value: "true"
          schema: { type: boolean }
        - name: fields
          in: query
          value: "id,name,mimeType,size,parents,driveId,webViewLink"
          schema: { type: string }
    requestSchema:
      type: object
      required: [metadata, fileId]
      additionalProperties: false
      properties:
        fileId:
          type: string
          minLength: 1
          maxLength: 128
          description: TulipFarm File ID; never a local path, URL, Drive ID, or base64 payload.
        metadata:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name: { type: string, minLength: 1, maxLength: 1024 }
            description: { type: string, maxLength: 32768 }
            parents:
              type: array
              maxItems: 1
              items: { type: string, minLength: 1, maxLength: 256 }
    response:
      maxBytes: 1048576
      schema:
        type: object
        properties:
          id: { type: string }
          name: { type: string }
          mimeType: { type: string }
          size: { type: string }
          parents: { type: array, items: { type: string } }
          driveId: { type: string }
          webViewLink: { type: string }

  - id: drive-export-file
    name: google_workspace_drive_export_file
    description: >-
      Export a Google Workspace-native file into an authorized TulipFarm File, at most 10 MiB.
      Choose a MIME type supported by the source: Docs text/plain or application/pdf; Sheets
      text/csv (first sheet only) or application/pdf; Slides application/pdf. The provider enforces
      canDownload and export compatibility. Files.export has no supportsAllDrives parameter.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection: *bearer
    source:
      type: http
      method: GET
      baseUrl: https://www.googleapis.com
      path: /drive/v3/files/{file_id}/export
      parameters:
        - name: file_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: mimeType
          in: query
          required: true
          schema: { type: string, enum: [text/plain, text/csv, application/pdf] }
    response:
      mode: binary
      maxBytes: 10485760

  - id: calendar-list-calendars
    name: google_workspace_calendar_list_calendars
    description: >-
      Discover calendars in the connected user's calendar list, including IDs, names, time zones,
      and access roles. Follow the bounded continuation to discover more calendars.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection: *bearer
    source:
      type: http
      method: GET
      baseUrl: https://www.googleapis.com
      path: /calendar/v3/users/me/calendarList
      parameters:
        - name: maxResults
          in: query
          schema: { type: integer, minimum: 1, maximum: 250 }
    pagination:
      type: cursor
      requestParameter: pageToken
      responsePath: /nextPageToken
      itemsPath: /items
    response:
      maxBytes: 4194304
      schema:
        type: object
        properties:
          nextPageToken: { type: string }
          items:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                summary: { type: string }
                description: { type: string }
                timeZone: { type: string }
                primary: { type: boolean }
                accessRole: { type: string }

  - id: calendar-get-event
    name: google_workspace_calendar_get_event
    description: >-
      Read a Calendar event by calendar_id and event_id, including readable summary, description,
      location, all-day or timed start/end, recurrence, attendees, status, and conference details.
      A cancelled event can contain only id and status.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection: *bearer
    source:
      type: http
      method: GET
      baseUrl: https://www.googleapis.com
      path: /calendar/v3/calendars/{calendar_id}/events/{event_id}
      parameters:
        - name: calendar_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: event_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 1024 }
    response:
      maxBytes: 4194304
      schema:
        type: object
        properties:
          id: { type: string }
          status: { type: string }
          summary: { type: string }
          description: { type: string }
          location: { type: string }
          start: { type: object }
          end: { type: object }
          recurrence: { type: array, items: { type: string } }
          attendees: { type: array, items: { type: object } }
          conferenceData: { type: object }
          htmlLink: { type: string }

  - id: gmail-compose-send-message
    name: google_workspace_gmail_compose_send_message
    description: >-
      Compose and send UTF-8 text, HTML, or multipart alternative email. Recipients are ASCII mailbox
      lists; subject may be Unicode. Attach up to ten authorized TulipFarm File IDs. The host builds
      MIME and base64url; do not encode body text. Complete encoded request is limited to 10 MiB.
      This sends a new message, not a reply; use the raw send operation for RFC-compliant threading.
    effect: send
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection: *bearer
    source:
      type: http
      method: POST
      baseUrl: https://gmail.googleapis.com
      path: /gmail/v1/users/me/messages/send
      mime: { outputPointer: /raw, maxBytes: 10485760 }
    requestSchema: &composedMessage
      type: object
      required: [to, subject]
      anyOf:
        - required: [text]
        - required: [html]
      additionalProperties: false
      properties:
        to: { type: string, minLength: 1, maxLength: 900, pattern: '^[ -~]+$' }
        cc: { type: string, maxLength: 900, pattern: '^[ -~]*$' }
        bcc: { type: string, maxLength: 900, pattern: '^[ -~]*$' }
        subject: { type: string, maxLength: 900, pattern: '^[^\u0000-\u001f\u007f]*$' }
        text: { type: string, maxLength: 2000000 }
        html: { type: string, maxLength: 2000000 }
        attachments:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
    response: &messageResponse
      maxBytes: 1048576
      schema:
        type: object
        required: [id]
        properties:
          id: { type: string }
          threadId: { type: string }
          labelIds: { type: array, items: { type: string } }

  - id: gmail-create-draft
    name: google_workspace_gmail_create_draft
    description: >-
      Create a composed Gmail draft without sending. Supply text, HTML, or both, and optional
      authorized TulipFarm File attachments. Review the draft before using gmail_send_draft.
      Complete encoded request is limited to 10 MiB.
    effect: create
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection: *bearer
    source:
      type: http
      method: POST
      baseUrl: https://gmail.googleapis.com
      path: /gmail/v1/users/me/drafts
      mime: { outputPointer: /message/raw, maxBytes: 10485760 }
    requestSchema: *composedMessage
    response: &draftResponse
      maxBytes: 1048576
      schema:
        type: object
        required: [id, message]
        properties:
          id: { type: string }
          message: { type: object }

  - id: gmail-update-draft
    name: google_workspace_gmail_update_draft
    description: >-
      Replace a draft's entire message with composed text/HTML and optional File attachments.
      Read the draft first; omitted recipients, content, and attachments are not preserved.
      This does not send. Complete encoded request is limited to 10 MiB.
    effect: update
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection: *bearer
    source:
      type: http
      method: PUT
      baseUrl: https://gmail.googleapis.com
      path: /gmail/v1/users/me/drafts/{draft_id}
      parameters:
        - name: draft_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      mime: { outputPointer: /message/raw, maxBytes: 10485760 }
    requestSchema: *composedMessage
    response: *draftResponse

  - id: gmail-list-drafts
    name: google_workspace_gmail_list_drafts
    description: List Gmail draft IDs and message IDs, one bounded page at a time.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection: *bearer
    source:
      type: http
      method: GET
      baseUrl: https://gmail.googleapis.com
      path: /gmail/v1/users/me/drafts
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: maxResults
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
    pagination:
      type: cursor
      requestParameter: pageToken
      responsePath: /nextPageToken
      itemsPath: /drafts
    response:
      maxBytes: 2097152
      schema:
        type: object
        properties:
          nextPageToken: { type: string }
          resultSizeEstimate: { type: integer }
          drafts:
            type: array
            items: { type: object }

  - id: gmail-get-draft
    name: google_workspace_gmail_get_draft
    description: >-
      Read a draft's full MIME structure, headers, and body data before replacing or sending it.
      Body data is Gmail base64url; this operation does not materialize attachment IDs as Files.
    effect: sensitive_read
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection: *bearer
    source:
      type: http
      method: GET
      baseUrl: https://gmail.googleapis.com
      path: /gmail/v1/users/me/drafts/{draft_id}
      parameters:
        - name: draft_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: format
          in: query
          value: full
          schema: { type: string }
    response:
      maxBytes: 10485760
      schema:
        type: object
        properties:
          id: { type: string }
          message: { type: object }

  - id: gmail-send-draft
    name: google_workspace_gmail_send_draft
    description: Send an existing Gmail draft by its draft ID, after reviewing its contents.
    effect: send
    identityMode: personal_required
    credentialSlot: access_token
    credentialInjection: *bearer
    source:
      type: http
      method: POST
      baseUrl: https://gmail.googleapis.com
      path: /gmail/v1/users/me/drafts/send
    requestSchema:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 256 }
    response: *messageResponse
