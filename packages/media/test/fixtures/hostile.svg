  <script>fetch('http://127.0.0.1:PORT/script')</script>
  <rect width="120" height="80" fill="#00ff00"/>
  <image href="http://127.0.0.1:PORT/x.png" width="120" height="80"/>
  <image xlink:href="http://127.0.0.1:PORT/y.png" width="120" height="80"/>
</svg>
