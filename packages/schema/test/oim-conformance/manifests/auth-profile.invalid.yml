oimVersion: "1.0"
kind: Integration
metadata:
  id: weather
  name: Weather
  version: 1.0.0
  description: Read current weather.
  license: Apache-2.0
profiles:
  core: "1.0"
auth:
  credentialSlots:
    - id: api_key
      label: API key
      kind: api_key
  steps:
    - id: credentials
      type: fields
      title: Connect Weather
      fields:
        - id: api_key
          label: API key
          input: password
          target:
            type: credential
            slot: api_key
operations:
  - id: current-weather
    name: current_weather
    description: Read current weather.
    effect: read
    identityMode: shared_only
    credentialSlot: api_key
    credentialInjection:
      in: header
      name: x-api-key
      format: "{token}"
    source:
      type: http
      method: GET
      baseUrl: https://api.weather.example
      path: /v1/current
    response:
      schema:
        type: object
      maxBytes: 16384
