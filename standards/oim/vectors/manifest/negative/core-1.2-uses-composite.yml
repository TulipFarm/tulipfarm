oimVersion: "1.0"
kind: Integration
metadata:
  id: directory
  name: Directory
  version: 1.0.0
  description: Look up a person.
  license: Apache-2.0
profiles:
  core: "1.2"
operations:
  - id: lookup
    name: lookup_person
    description: Look up a person.
    effect: read
    identityMode: shared_only
    source:
      type: http
      method: GET
      baseUrl: https://directory.example
      path: /people
    response:
      schema:
        type: object
      maxBytes: 4096
  - id: composite
    name: lookup_composite
    description: Look up a person through a sequence.
    effect: read
    identityMode: shared_only
    requestSchema:
      type: object
      additionalProperties: false
    source:
      type: composite
      steps:
        - id: lookup
          operationId: lookup
    response:
      schema:
        type: object
      maxBytes: 4096
