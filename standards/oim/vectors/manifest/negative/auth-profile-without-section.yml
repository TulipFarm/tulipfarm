oimVersion: "1.0"
kind: Integration
metadata:
  id: contacts
  name: Contacts
  version: 1.0.0
  description: Read contacts.
  license: Apache-2.0
profiles: { core: "1.0", auth: "1.0" }
operations:
  - id: contacts
    name: list_contacts
    description: List contacts.
    effect: read
    identityMode: shared_only
    source:
      type: http
      method: GET
      baseUrl: https://api.example.test
      path: /contacts
    response:
      schema: { type: array }
      maxBytes: 4096
