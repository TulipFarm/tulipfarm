oimVersion: "1.0"
kind: Integration
metadata:
  id: contacts
  name: Contacts
  version: 1.0.0
  description: Read contacts.
  license: Apache-2.0
profiles:
  core: "1.0"
  auth: "1.1"
auth:
  credentialSlots:
    - id: api_key
      label: API key
      kind: api_key
  steps:
    - id: credentials
      type: fields
      title: Connect
      fields:
        - id: api_key
          label: API key
          input: password
          target: { type: credential, slot: api_key }
  healthCheckOperationId: current-user
  verification:
    issuer:
      source: package
      value: https://api.example.test
    checks:
      - id: current-user
        operationId: current-user
        credentialSlots: [api_key]
        success:
          - kind: present
            path: /id
    evidence:
      assurance: identified
      subject:
        kind: human
        checkId: current-user
        path: /id
        namespace: issuer
operations:
  - id: current-user
    name: current_user
    description: Identify the current user.
    effect: read
    identityMode: shared_or_personal
    credentialSlot: api_key
    credentialInjection:
      in: header
      name: Authorization
      format: "Bearer {token}"
    source:
      type: http
      method: GET
      baseUrl: https://api.example.test
      path: /me
    response:
      schema:
        type: object
        properties:
          id: { type: string }
        required: [id]
      maxBytes: 16384
