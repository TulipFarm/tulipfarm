oimVersion: "1.0"
kind: Integration
metadata:
  id: issues
  name: Issues
  version: 1.0.0
  description: Receive issue events.
  license: Apache-2.0
profiles:
  core: "1.0"
  auth: "1.0"
  events: "1.0"
auth:
  credentialSlots:
    - id: webhook_secret
      label: Webhook secret
      kind: webhook_secret
  steps:
    - id: secret
      type: fields
      title: Set webhook secret
      fields:
        - id: webhook_secret
          label: Webhook secret
          input: password
          target: { type: credential, slot: webhook_secret }
operations:
  - id: status
    name: issue_status
    description: Read service status.
    effect: read
    identityMode: shared_only
    source:
      type: http
      method: GET
      baseUrl: https://api.example.test
      path: /status
    response:
      schema: { type: object }
      maxBytes: 4096
events:
  path: /issues
  verification:
    scheme: hmac_sha256
    secretSlot: webhook_secret
    signatureHeader: X-Signature
  deduplication:
    kind: delivery_id_header
    header: X-Delivery-Id
  eventTypes:
    - type: issue.created
      selector:
        pointer: /type
        equals: issue.created
      schema: { type: object }
