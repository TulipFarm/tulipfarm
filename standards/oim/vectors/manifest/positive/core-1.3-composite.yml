oimVersion: "1.0"
kind: Integration
metadata:
  id: directory
  name: Directory
  version: 1.0.0
  description: Look up a person and their profile.
  license: Apache-2.0
profiles:
  core: "1.3"
operations:
  - id: lookup
    name: lookup_person
    description: Look up a person.
    effect: read
    identityMode: shared_only
    source:
      type: http
      method: GET
      baseUrl: https://directory.example
      path: /people/{id}
      parameters:
        - name: id
          in: path
          schema:
            type: string
    response:
      schema:
        type: object
        properties:
          id:
            type: string
        required: [id]
        additionalProperties: false
      maxBytes: 4096
  - id: profile
    name: read_profile
    description: Read a person profile.
    effect: read
    identityMode: shared_only
    source:
      type: http
      method: GET
      baseUrl: https://directory.example
      path: /profiles/{id}
      parameters:
        - name: id
          in: path
          schema:
            type: string
    response:
      schema:
        type: object
        properties:
          name:
            type: string
        required: [name]
        additionalProperties: false
      maxBytes: 4096
  - id: lookup-profile
    name: lookup_profile
    description: Look up a person and read their profile.
    effect: read
    identityMode: shared_only
    requestSchema:
      type: object
      properties:
        id:
          type: string
      required: [id]
      additionalProperties: false
    source:
      type: composite
      steps:
        - id: lookup
          operationId: lookup
          bindings:
            - target: /id
              source:
                type: input
                pointer: /id
        - id: profile
          operationId: profile
          bindings:
            - target: /id
              source:
                type: step
                stepId: lookup
                pointer: /id
    response:
      schema:
        type: object
        properties:
          name:
            type: string
        required: [name]
        additionalProperties: false
      maxBytes: 4096
